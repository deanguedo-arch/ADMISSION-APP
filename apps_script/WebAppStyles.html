<style>
      :root {
        --bg-page: #f2f5f3;
        --bg-panel: #ffffff;
        --bg-subtle: #f8fbf9;
        --ink: #2f3a35;
        --ink-soft: #5c6a64;
        --brand: #1f9d72;
        --brand-dark: #176f52;
        --brand-soft: #d8f1e8;
        --line: #d7e2dc;
        --line-strong: #b9ccc2;
        --warn: #8b6200;
        --danger: #8e3a2f;
        --info: #1c5e96;
        --shadow: 0 10px 28px rgba(16, 43, 33, 0.08);
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --radius-sm: 10px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --focus-ring: 0 0 0 3px rgba(31, 157, 114, 0.28);
        --touch-target: 44px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Open Sans", sans-serif;
        color: var(--ink);
        line-height: 1.4;
        background: radial-gradient(1400px circle at 0 0, #f9fcfb 0%, var(--bg-page) 46%, #edf3ef 100%);
      }

      .shell {
        max-width: 1560px;
        margin: 0 auto;
        padding: calc(var(--space-4) + env(safe-area-inset-top))
          calc(var(--space-4) + env(safe-area-inset-right))
          calc(var(--space-6) + env(safe-area-inset-bottom))
          calc(var(--space-4) + env(safe-area-inset-left));
      }

      .hero {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
      }

      .hero-main {
        flex: 1 1 auto;
        border: 1px solid var(--line);
        border-top: 4px solid var(--brand);
        border-radius: 12px;
        background: var(--bg-panel);
        padding: 10px 14px;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-logo {
        width: min(42vw, 280px);
        max-height: 68px;
        object-fit: contain;
        object-position: left center;
      }

      .title {
        margin: 0;
        font-family: "Rubik", sans-serif;
        font-size: clamp(1.2rem, 0.85vw + 0.95rem, 1.65rem);
        font-weight: 600;
        color: var(--brand-dark);
      }

      .subtitle {
        margin: 5px 0 0;
        color: var(--ink-soft);
        font-size: 0.93rem;
      }

      .stamp {
        font-size: 0.86rem;
        color: var(--brand-dark);
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg-panel);
        min-width: 260px;
      }

      .auth-strip {
        margin-bottom: 12px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg-panel);
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }

      .auth-line {
        margin: 0;
        color: var(--ink-soft);
        font-size: 0.93rem;
      }

      .workflow {
        display: grid;
        grid-template-columns: minmax(300px, 360px) minmax(500px, 1fr) minmax(340px, 430px);
        gap: 14px;
        align-items: start;
      }

      .workflow.inputs-collapsed {
        grid-template-columns: minmax(540px, 1fr) minmax(340px, 460px);
      }

      .workflow.inputs-collapsed .panel-inputs {
        display: none;
      }

      .workflow.inputs-collapsed .panel-results {
        grid-column: 1;
      }

      .workflow.inputs-collapsed .panel-details {
        grid-column: 2;
      }

      .panel {
        background: var(--bg-panel);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        padding: var(--space-4);
        box-shadow: var(--shadow);
      }

      .panel-inputs,
      .panel-results,
      .panel-details {
        min-width: 0;
      }

      .panel-results {
        container-type: inline-size;
        container-name: results-panel;
      }

      .panel h2 {
        margin: 0 0 var(--space-2);
        font-family: "Rubik", sans-serif;
        font-size: 1.03rem;
        color: var(--brand-dark);
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }

      .panel-head h2 {
        margin: 0;
      }

      .panel-toggle-btn {
        white-space: nowrap;
        padding: 6px 10px;
      }

      .panel-toggle-btn.is-hidden {
        display: none;
      }

      .panel h3 {
        margin: 12px 0 7px;
        font-size: 0.92rem;
        color: var(--ink);
      }

      .hint {
        color: var(--ink-soft);
        margin: 0 0 10px;
        font-size: 0.9rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th,
      td {
        border-bottom: 1px solid #e2ebe6;
        text-align: left;
        padding: 6px 5px;
        vertical-align: top;
      }

      th {
        font-size: 0.73rem;
        letter-spacing: 0.03em;
        color: var(--ink-soft);
        text-transform: uppercase;
      }

      input[type="text"],
      input[type="number"],
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        padding: 7px 8px;
        font: inherit;
        color: var(--ink);
        background: #fff;
      }

      #electiveTable {
        table-layout: fixed;
      }

      #electiveTable th:nth-child(1),
      #electiveTable td:nth-child(1) {
        width: 46%;
      }

      #electiveTable th:nth-child(2),
      #electiveTable td:nth-child(2) {
        width: 20%;
      }

      #electiveTable th:nth-child(3),
      #electiveTable td:nth-child(3) {
        width: 24%;
      }

      #electiveTable th:nth-child(4),
      #electiveTable td:nth-child(4) {
        width: 10%;
      }

      #electiveTable select,
      #electiveTable input.mark-input {
        min-width: 0;
      }

      #electiveTable td:nth-child(4) {
        padding-right: 0;
      }

      #electiveTable td:nth-child(4) .btn-subtle {
        width: 100%;
        min-width: 0;
        min-height: 34px;
        padding: 6px 0;
        line-height: 1;
      }

      #namedTable td:nth-child(3) .btn-subtle {
        min-height: 34px;
        padding: 6px 8px;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(31, 157, 114, 0.14);
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      .filter-btn:focus-visible,
      .result-control:focus-visible,
      .pin-btn:focus-visible,
      .action-btn:focus-visible,
      .compare-chip:focus-visible,
      .compare-view-btn:focus-visible,
      .detail-link:focus-visible,
      .source-link-inline:focus-visible {
        outline: none;
        border-color: var(--brand-dark);
        box-shadow: var(--focus-ring);
      }

      .result-card:focus-within {
        border-color: #89b8dc;
        box-shadow: inset 3px 0 0 #73a7e2, var(--focus-ring);
      }

      .mark-input-wrap {
        display: grid;
        gap: 3px;
      }

      .cell-error {
        min-height: 14px;
        font-size: 0.72rem;
        color: var(--danger);
      }

      .input-invalid {
        border-color: #df6e5f !important;
        background: #fff7f5;
      }

      .actions {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .run-actions {
        margin-top: 12px;
      }

      .btn {
        border: 1px solid transparent;
        border-radius: 9px;
        font: inherit;
        padding: 7px 11px;
        min-height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1.2;
        cursor: pointer;
        transition: border-color 0.12s ease, background 0.12s ease, color 0.12s ease;
      }

      .btn-main {
        background: var(--brand);
        color: #fff;
        font-weight: 700;
      }

      .btn-main:hover {
        background: var(--brand-dark);
      }

      .btn-subtle {
        border-color: var(--line-strong);
        background: #fff;
        color: var(--brand-dark);
      }

      .btn-subtle:hover {
        border-color: var(--brand);
      }

      .btn-danger-lite {
        background: #fff4f1;
        border-color: #eac3ba;
        color: var(--danger);
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: var(--space-2);
        margin-bottom: var(--space-3);
      }

      .mode-tabs {
        display: inline-flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        margin-bottom: var(--space-3);
      }

      .mode-tab {
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        min-height: var(--touch-target);
        padding: 8px 14px;
        font-size: 0.84rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      .mode-tab.active {
        border-color: #8bbfaa;
        background: #edf7f2;
        color: var(--brand-dark);
      }

      .mode-count {
        min-width: 22px;
        padding: 2px 7px;
        border-radius: 999px;
        border: 1px solid #c7d9d0;
        font-size: 0.74rem;
        text-align: center;
        background: #fff;
      }

      .snapshot-banner {
        border: 1px solid #cfe0d8;
        border-radius: 10px;
        background: #f6fbf8;
        padding: 9px 10px;
        margin-bottom: 10px;
        display: grid;
        gap: 4px;
      }

      .snapshot-banner-title {
        font-size: 0.84rem;
        color: #1f4f3f;
        font-weight: 700;
      }

      .snapshot-banner-date {
        font-size: 0.82rem;
        color: #375b4d;
      }

      .stat {
        border-radius: var(--radius-sm);
        padding: var(--space-2) var(--space-3);
        border: 1px solid var(--line);
        background: #fbfdfc;
      }

      .stat .label {
        font-size: 0.75rem;
        color: var(--ink-soft);
      }

      .stat .value {
        margin-top: 3px;
        font-family: "Rubik", sans-serif;
        font-size: 1.04rem;
        font-weight: 700;
      }

      .stat.good .value {
        color: var(--brand-dark);
      }

      .stat.warn .value {
        color: var(--warn);
      }

      .stat.neutral .value {
        color: #245444;
      }

      .result-toolbar {
        display: grid;
        gap: var(--space-2);
        margin-bottom: var(--space-2);
        padding: var(--space-2);
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: #f8fcfa;
      }

      .tab-group {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
      }

      .filter-btn {
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        background: #fff;
        padding: 8px 12px;
        min-height: var(--touch-target);
        font-size: 0.84rem;
        font-weight: 600;
        cursor: pointer;
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        gap: var(--space-1);
      }

      .filter-btn.active {
        background: var(--brand-soft);
        border-color: #9ccfbf;
        color: var(--brand-dark);
        font-weight: 700;
        box-shadow: 0 1px 0 rgba(31, 157, 114, 0.14);
      }

      .tab-count {
        min-width: 18px;
        text-align: center;
        padding: 1px 5px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid #c7d9d0;
        font-size: 0.75rem;
      }

      .toolbar-controls {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        align-items: stretch;
      }

      .result-control {
        width: auto;
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        padding: 10px;
        min-height: var(--touch-target);
        font: inherit;
        color: var(--ink);
        background: #fff;
        min-width: 0;
        flex: 1 1 150px;
      }

      #resultSearch {
        flex: 2.2 1 260px;
      }

      #sortSelect {
        flex: 1.3 1 220px;
      }

      #requirementTypeFilter {
        flex: 1.3 1 230px;
        min-width: 210px;
      }

      .clear-control {
        white-space: nowrap;
        flex: 0 0 auto;
        min-height: var(--touch-target);
      }

      .meeting-toggle {
        min-height: var(--touch-target);
      }

      .meeting-toggle[aria-pressed="true"] {
        border-color: #8bbfaa;
        background: #edf7f2;
        color: var(--brand-dark);
        font-weight: 700;
      }

      .results-wrap {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fbfefd;
        padding: var(--space-2);
        max-height: 71vh;
        overflow: auto;
      }

      .result-list {
        display: grid;
        gap: var(--space-2);
      }

      .result-card {
        border: 1px solid #d3e1da;
        border-radius: var(--radius-md);
        padding: var(--space-3);
        background: #fff;
        cursor: pointer;
        display: grid;
        gap: var(--space-2);
        content-visibility: auto;
        contain-intrinsic-size: 220px;
        transition: border-color 0.14s ease, box-shadow 0.14s ease, transform 0.14s ease;
      }

      .result-card:hover {
        border-color: #a9c6bb;
        box-shadow: 0 8px 18px rgba(20, 58, 44, 0.08);
        transform: translateY(-1px);
      }

      .result-card.row-selected {
        border-color: #89b8dc;
        box-shadow: inset 3px 0 0 #73a7e2;
      }

      .result-card.row-pinned {
        box-shadow: inset 3px 0 0 var(--brand);
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
      }

      .card-title-wrap {
        min-width: 0;
      }

      .card-title {
        margin: 0;
        font-family: "Rubik", sans-serif;
        font-size: 1rem;
        color: #1c4135;
      }

      .card-subtitle {
        margin: 2px 0 0;
        font-size: 0.84rem;
        color: var(--ink-soft);
      }

      .card-metrics {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        justify-content: flex-end;
        text-align: right;
        min-width: 0;
      }

      .metric-pill {
        border: 1px solid #d2e1da;
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 0.76rem;
        color: var(--ink-soft);
        background: #fff;
      }

      .status-pill {
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 0.76rem;
        font-weight: 700;
        border: 1px solid transparent;
      }

      .status-pill.eligible {
        color: #155942;
        border-color: #9dcfbf;
        background: #e5f4ee;
      }

      .status-pill.missing {
        color: #7b3a30;
        border-color: #e3b9b1;
        background: #faece9;
      }

      .status-pill.uncheckable {
        color: #184e82;
        border-color: #b2d0ec;
        background: #eaf3fc;
      }

      .decision-pill {
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 0.76rem;
        font-weight: 700;
        border: 1px solid transparent;
      }

      .decision-pill.decision-apply {
        color: #155942;
        border-color: #9dcfbf;
        background: #e5f4ee;
      }

      .decision-pill.decision-hold {
        color: #7a5600;
        border-color: #e3d39e;
        background: #fff9ec;
      }

      .decision-pill.decision-not_now {
        color: #7b3a30;
        border-color: #e3b9b1;
        background: #faece9;
      }

      .student-avg-block {
        flex: 1 0 100%;
        margin-top: 2px;
        line-height: 1.05;
      }

      .student-avg-label {
        font-size: 0.64rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: #4f655d;
      }

      .student-avg-value {
        margin-top: 2px;
        font-family: "Rubik", sans-serif;
        font-size: 1.42rem;
        font-weight: 800;
      }

      .student-avg-block.eligible .student-avg-value {
        color: #155942;
      }

      .student-avg-block.missing .student-avg-value {
        color: #7b3a30;
      }

      .student-avg-block.uncheckable .student-avg-value {
        color: #184e82;
      }

      .student-avg-block.neutral .student-avg-value {
        color: #345247;
      }

      .card-reason {
        font-size: 0.85rem;
        color: #435750;
      }

      .card-warning {
        border: 1px solid #d9e5df;
        border-radius: 8px;
        padding: 6px 8px;
        font-size: 0.79rem;
        line-height: 1.35;
        background: #f9fcfb;
        color: #355449;
      }

      .card-warning.medium {
        border-color: #d7c892;
        background: #fff9eb;
        color: #6f5300;
      }

      .card-warning.low {
        border-color: #e5b5ad;
        background: #fff2f0;
        color: #7f342b;
      }

      .card-warning.uncheckable {
        border-color: #b7d2ea;
        background: #edf5fd;
        color: #184e82;
      }

      .card-warning-title {
        font-weight: 700;
      }

      .card-warning-reasons {
        margin: 4px 0 0 16px;
        padding: 0;
      }

      .source-link-inline {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #c8ddd3;
        border-radius: 999px;
        padding: 6px 11px;
        min-height: 36px;
        font-size: 0.76rem;
        font-weight: 700;
        color: #1d5742;
        background: #f3faf6;
        text-decoration: none;
      }

      .source-link-inline.prominent {
        border-color: #c0841e;
        background: #fff5df;
        color: #7a5300;
      }

      .source-link-inline:hover {
        border-color: #9cc8b6;
        background: #eaf6f0;
      }

      .source-link-missing {
        font-size: 0.78rem;
        color: #7f342b;
        font-weight: 700;
      }

      .card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .pin-btn,
      .action-btn {
        border: 1px solid #d1dfd8;
        border-radius: 999px;
        background: #fff;
        color: #2d5a49;
        font-size: 0.74rem;
        padding: 8px 12px;
        min-height: var(--touch-target);
        cursor: pointer;
      }

      .pin-btn.active,
      .action-btn.active {
        border-color: #8bbfaa;
        background: #edf7f2;
        color: var(--brand-dark);
        font-weight: 700;
      }

      .panel-details {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
        container-type: inline-size;
        container-name: details-panel;
      }

      .panel-details > h2 {
        margin: 0;
      }

      .advanced-tools {
        margin-top: 8px;
        border: 1px solid #d1e1da;
        border-radius: 10px;
        background: #f9fcfa;
      }

      .advanced-tools > summary {
        padding: 9px 12px;
        cursor: pointer;
        font-family: "Rubik", sans-serif;
        font-size: 0.86rem;
        color: #1f5945;
        display: flex;
        align-items: center;
        justify-content: space-between;
        list-style: none;
      }

      .advanced-tools > summary::-webkit-details-marker {
        display: none;
      }

      .advanced-tools > summary::after {
        content: "+";
        font-size: 0.95rem;
        color: #2f6653;
      }

      .advanced-tools[open] > summary::after {
        content: "-";
      }

      .advanced-tools-content {
        padding: 0 8px 8px;
        display: grid;
        gap: 8px;
      }

      .compare-strip {
        border: 1px dashed #c5d8cf;
        border-radius: 10px;
        background: #f9fcfa;
        padding: 8px;
        display: grid;
        gap: 6px;
      }

      .compare-results {
        margin-top: 8px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fcfefd;
        padding: 8px;
        display: grid;
        gap: 8px;
      }

      .compare-results.is-empty {
        display: none;
      }

      .compare-results-head {
        display: grid;
        gap: 2px;
      }

      .compare-results-title {
        margin: 0;
        font-family: "Rubik", sans-serif;
        font-size: 0.96rem;
        color: #1b4638;
      }

      .compare-results-sub {
        margin: 0;
        font-size: 0.82rem;
        color: var(--ink-soft);
      }

      .compare-results-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }

      .compare-view-toggle {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border: 1px solid #d4e1db;
        border-radius: 999px;
        background: #fff;
        padding: 2px;
      }

      .compare-view-btn {
        border: 1px solid transparent;
        border-radius: 999px;
        background: transparent;
        color: #2d5a49;
        font-size: 0.74rem;
        padding: 8px 12px;
        min-height: 40px;
        cursor: pointer;
      }

      .compare-view-btn.active {
        border-color: #8bbfaa;
        background: #edf7f2;
        color: var(--brand-dark);
        font-weight: 700;
      }

      .compare-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .compare-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .compare-chip {
        border: 1px solid #cadcd3;
        border-radius: 999px;
        background: #fff;
        color: #2d5a49;
        font-size: 0.76rem;
        padding: 8px 12px;
        min-height: var(--touch-target);
        cursor: pointer;
      }

      .details-drawer {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fcfefd;
        padding: 10px;
        display: grid;
        gap: 8px;
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
      }

      .detail-head {
        display: grid;
        gap: 2px;
      }

      .detail-title {
        margin: 0;
        font-family: "Rubik", sans-serif;
        font-size: 1rem;
        color: #1b4638;
      }

      .detail-sub {
        margin: 0;
        font-size: 0.88rem;
        color: var(--ink-soft);
      }

      .detail-link-row {
        margin-top: 4px;
      }

      .detail-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #c8ddd3;
        border-radius: 999px;
        padding: 7px 12px;
        min-height: 36px;
        font-size: 0.76rem;
        font-weight: 700;
        color: #1d5742;
        background: #f3faf6;
        text-decoration: none;
      }

      .detail-link:hover {
        border-color: #9cc8b6;
        background: #eaf6f0;
      }

      .detail-link.prominent {
        border-color: #c0841e;
        background: #fff5df;
        color: #7a5300;
      }

      .detail-link-missing {
        font-size: 0.78rem;
        color: #63756f;
      }

      .meaning-panel {
        border: 1px solid #dae8e1;
        border-radius: 10px;
        padding: 8px;
        background: #fff;
      }

      .detail-warning {
        border: 1px solid #d9e5df;
        border-radius: 10px;
        padding: 8px;
        background: #f9fcfb;
        display: grid;
        gap: 4px;
      }

      .detail-warning.medium {
        border-color: #d7c892;
        background: #fff9eb;
        color: #6f5300;
      }

      .detail-warning.low {
        border-color: #e5b5ad;
        background: #fff2f0;
        color: #7f342b;
      }

      .detail-warning.uncheckable {
        border-color: #b7d2ea;
        background: #edf5fd;
        color: #184e82;
      }

      .detail-highlights {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 8px;
      }

      .highlight-card {
        border: 1px solid #d6e5de;
        border-radius: 10px;
        background: #fff;
        padding: 8px;
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .highlight-label {
        font-size: 0.74rem;
        font-weight: 700;
        color: #2a5948;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .highlight-value {
        font-size: 0.88rem;
        color: #31463e;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .highlight-card.ok {
        border-color: #b8d7ca;
        background: #f3faf6;
      }

      .highlight-card.warn {
        border-color: #e3d39e;
        background: #fff9ec;
      }

      .highlight-card.bad {
        border-color: #e5b9b2;
        background: #fff3f1;
      }

      .highlight-card.info {
        border-color: #b7d2ea;
        background: #eef6fd;
      }

      .meaning-panel h4 {
        margin: 0 0 6px;
        font-size: 0.84rem;
        color: var(--brand-dark);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .meaning-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 4px;
      }

      .meaning-item {
        font-size: 0.86rem;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .meaning-item.ok {
        color: #1a5b44;
      }

      .meaning-item.bad {
        color: #7f342b;
      }

      .meaning-item.warn {
        color: #7a5600;
      }

      .detail-grid {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        min-width: 0;
      }

      .detail-block {
        border: 1px solid #dde9e3;
        border-radius: 10px;
        background: #fff;
        padding: 8px;
        min-width: 0;
        overflow: hidden;
      }

      .detail-block h4 {
        margin: 0 0 6px;
        font-size: 0.8rem;
        color: #265845;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .detail-list {
        margin: 0;
        padding-left: 17px;
        display: grid;
        gap: 3px;
        min-width: 0;
      }

      .detail-list li {
        font-size: 0.84rem;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .meeting-notes-block {
        grid-column: 1 / -1;
        display: grid;
        gap: 8px;
        overflow: visible;
      }

      .meeting-note-meta {
        margin: 0;
      }

      .meeting-decision-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .meeting-decision-btn {
        border: 1px solid #cadcd3;
        border-radius: 999px;
        background: #fff;
        color: #2d5a49;
        font-size: 0.76rem;
        padding: 8px 12px;
        min-height: var(--touch-target);
        cursor: pointer;
      }

      .meeting-decision-btn.active {
        font-weight: 700;
      }

      .meeting-decision-btn.active.decision-apply {
        border-color: #9dcfbf;
        background: #e5f4ee;
        color: #155942;
      }

      .meeting-decision-btn.active.decision-hold {
        border-color: #e3d39e;
        background: #fff9ec;
        color: #7a5600;
      }

      .meeting-decision-btn.active.decision-not_now {
        border-color: #e3b9b1;
        background: #faece9;
        color: #7b3a30;
      }

      .meeting-note-input {
        display: block;
        width: 100%;
        min-height: 132px;
        max-width: 100%;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        padding: 10px;
        font: inherit;
        color: var(--ink);
        background: #fff;
        resize: vertical;
        overflow: auto;
      }

      .meeting-note-input:focus-visible {
        outline: 2px solid #4f9bff;
        outline-offset: 1px;
      }

      .meeting-note-actions {
        margin-top: 0;
      }

      .requirement-line {
        display: grid;
        gap: 1px;
      }

      .req-label {
        font-weight: 700;
      }

      .req-meta {
        color: var(--ink-soft);
        font-size: 0.79rem;
      }

      .req-status {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .req-status.met {
        color: #1a5b44;
      }

      .req-status.low_mark {
        color: var(--warn);
      }

      .req-status.missing {
        color: var(--danger);
      }

      .req-status.unknown,
      .req-status.assessment {
        color: var(--info);
      }

      .collapsible {
        border: 1px solid #dde9e3;
        border-radius: 10px;
        background: #fff;
        padding: 8px;
      }

      .collapsible > summary {
        cursor: pointer;
        font-size: 0.82rem;
        font-weight: 700;
        color: #265845;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        list-style: none;
      }

      .collapsible > summary::-webkit-details-marker {
        display: none;
      }

      .collapsible > summary::after {
        content: " +";
        color: var(--ink-soft);
      }

      .collapsible[open] > summary::after {
        content: " -";
      }

      .compare-stack {
        display: grid;
        gap: 8px;
      }

      .compare-stack.mode-list {
        grid-template-columns: 1fr;
      }

      .compare-stack.mode-side {
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }

      .compare-columns-wrap {
        border: 1px solid #ddebe6;
        border-radius: 10px;
        overflow: auto;
        background: #fff;
      }

      .compare-columns-table {
        width: 100%;
        min-width: 720px;
        border-collapse: collapse;
      }

      .compare-columns-table th,
      .compare-columns-table td {
        border-bottom: 1px solid #e5f0ec;
        padding: 8px;
        vertical-align: top;
        text-align: left;
      }

      .compare-columns-table thead th {
        background: #f3f9f6;
      }

      .compare-columns-table .field-col {
        width: 190px;
        min-width: 190px;
        color: var(--brand-dark);
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .compare-columns-table .program-col {
        min-width: 220px;
      }

      .compare-columns-table td {
        font-size: 0.82rem;
        color: #3f544c;
        line-height: 1.35;
      }

      .compare-columns-table .compare-program {
        display: grid;
        gap: 3px;
      }

      .compare-columns-table .compare-program .status-pill {
        justify-self: start;
      }

      .compare-item {
        border: 1px solid #dde8e3;
        border-radius: 10px;
        background: #fff;
        padding: 8px;
        display: grid;
        gap: 7px;
      }

      .compare-item-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
      }

      .compare-item-title {
        min-width: 0;
      }

      .compare-item-title strong {
        display: block;
        font-size: 0.9rem;
        color: #1f4b3c;
      }

      .compare-item-title span {
        display: block;
        margin-top: 2px;
        font-size: 0.79rem;
        color: var(--ink-soft);
      }

      .compare-item-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .compare-item-stat {
        border: 1px solid #deebe5;
        border-radius: 8px;
        background: #fbfefd;
        padding: 6px;
      }

      .compare-item-stat .label {
        font-size: 0.72rem;
        color: var(--ink-soft);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .compare-item-stat .value {
        margin-top: 2px;
        font-size: 0.88rem;
        font-weight: 700;
        color: #1f4b3c;
      }

      .compare-item-line {
        margin: 0;
        font-size: 0.82rem;
        color: #3f544c;
      }

      .compare-item-line strong {
        color: #214f3f;
      }

      .compare-item-req {
        margin: 0;
        padding-left: 16px;
        display: grid;
        gap: 3px;
      }

      .compare-item-req li {
        font-size: 0.8rem;
        color: #3f544c;
      }

      .compare-table-wrap {
        border: 1px solid #ddebe6;
        border-radius: 10px;
        overflow: auto;
        background: #fff;
      }

      .compare-table {
        width: 100%;
        min-width: 860px;
        border-collapse: collapse;
      }

      .compare-table th,
      .compare-table td {
        border-bottom: 1px solid #e5f0ec;
        padding: 8px;
        vertical-align: top;
        text-align: left;
      }

      .compare-table thead th {
        background: #f3f9f6;
      }

      .compare-table .field-col {
        width: 210px;
        min-width: 210px;
        color: var(--brand-dark);
        font-size: 0.79rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .compare-program {
        display: grid;
        gap: 2px;
      }

      .compare-program strong {
        font-size: 0.88rem;
        color: #1d4739;
      }

      .compare-program span {
        font-size: 0.78rem;
        color: var(--ink-soft);
      }

      .status {
        margin-top: 8px;
        min-height: 18px;
        color: var(--ink-soft);
        font-size: 0.88rem;
      }

      .status.mini {
        margin-top: 6px;
        min-height: 16px;
        font-size: 0.8rem;
      }

      .status.error {
        color: var(--danger);
      }

      .empty {
        padding: 14px;
        color: var(--ink-soft);
        border: 1px dashed #d7e3dd;
        border-radius: 10px;
        background: #fff;
      }

      .ghost {
        font-size: 0.83rem;
        color: var(--ink-soft);
      }

      body.is-meeting .summary {
        gap: 9px;
      }

      body.is-meeting .stat {
        padding: 10px;
      }

      body.is-meeting .stat .label {
        font-size: 0.79rem;
      }

      body.is-meeting .stat .value {
        font-size: 1.12rem;
      }

      body.is-meeting .result-card {
        padding: 12px;
        gap: 8px;
      }

      body.is-meeting .card-title {
        font-size: 1.06rem;
      }

      body.is-meeting .card-subtitle {
        font-size: 0.88rem;
      }

      body.is-meeting .card-reason {
        font-size: 0.89rem;
      }

      body.is-meeting .details-drawer {
        padding: 12px;
        gap: 10px;
      }

      body.is-meeting .detail-title {
        font-size: 1.08rem;
      }

      body.is-meeting .detail-sub {
        font-size: 0.92rem;
      }

      body.is-meeting .detail-block {
        padding: 10px;
      }

      body.is-meeting .detail-block h4,
      body.is-meeting .meaning-panel h4 {
        font-size: 0.83rem;
      }

      body.is-meeting .detail-list li,
      body.is-meeting .meaning-item,
      body.is-meeting .highlight-value {
        font-size: 0.88rem;
      }

      body.is-meeting .meeting-note-input {
        font-size: 0.9rem;
        min-height: 140px;
      }

      body.is-meeting .meeting-decision-btn {
        font-size: 0.8rem;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }

        .result-card:hover {
          transform: none;
        }
      }

      @container results-panel (max-width: 760px) {
        .toolbar-controls {
          display: grid;
          grid-template-columns: 1fr;
        }

        .toolbar-controls > * {
          width: 100%;
        }

        #resultSearch,
        #sortSelect {
          flex: 1 1 auto;
        }

        .card-top {
          flex-direction: column;
          align-items: stretch;
        }

        .card-metrics {
          justify-content: flex-start;
        }
      }

      @container details-panel (max-width: 430px) {
        .details-drawer {
          padding: 8px;
          gap: 8px;
        }

        .detail-highlights,
        .detail-grid {
          grid-template-columns: 1fr;
        }

        .detail-block,
        .collapsible,
        .meaning-panel,
        .detail-warning {
          padding: 8px;
        }

        .detail-link {
          width: 100%;
        }

        .meeting-note-input {
          min-height: 120px;
        }
      }

      @media (max-width: 1480px) {
        .workflow {
          grid-template-columns: minmax(300px, 370px) minmax(420px, 1fr);
        }

        .workflow.inputs-collapsed {
          grid-template-columns: minmax(420px, 1fr) minmax(300px, 380px);
        }

        .panel-details {
          grid-column: 1 / -1;
        }

        .workflow.inputs-collapsed .panel-details {
          grid-column: auto;
        }

        .details-drawer {
          max-height: none;
        }
      }

      @media (max-width: 980px) {
        .hero {
          flex-direction: column;
          align-items: stretch;
        }

        .shell {
          padding: calc(var(--space-3) + env(safe-area-inset-top))
            calc(var(--space-3) + env(safe-area-inset-right))
            calc(var(--space-5) + env(safe-area-inset-bottom))
            calc(var(--space-3) + env(safe-area-inset-left));
        }

        .stamp {
          min-width: 0;
        }

        .brand-lockup {
          flex-direction: column;
          align-items: flex-start;
        }

        .brand-logo {
          width: min(72vw, 280px);
        }

        .workflow {
          grid-template-columns: 1fr;
        }

        .summary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .mode-tabs {
          display: grid;
          grid-template-columns: 1fr;
          width: 100%;
        }

        .mode-tab {
          width: 100%;
          justify-content: space-between;
        }

        .toolbar-controls {
          display: grid;
          grid-template-columns: 1fr;
        }

        .toolbar-controls > * {
          width: 100%;
        }

        .btn,
        .filter-btn,
        .mode-tab,
        .pin-btn,
        .action-btn {
          min-height: var(--touch-target);
        }

        .run-actions {
          position: sticky;
          bottom: calc(8px + env(safe-area-inset-bottom));
          z-index: 5;
          padding: 8px;
          border: 1px solid var(--line);
          border-radius: 12px;
          background: rgba(255, 255, 255, 0.94);
          backdrop-filter: blur(6px);
        }

        .run-actions .btn {
          flex: 1 1 calc(50% - 8px);
        }

        .detail-grid {
          grid-template-columns: 1fr;
        }

        .detail-highlights {
          grid-template-columns: 1fr;
        }

        .compare-item-grid {
          grid-template-columns: 1fr;
        }
      }

      /* Phase 1-2 visual refresh: stronger hierarchy + cleaner educational SaaS feel */
      :root {
        --bg-page: #ebf2ef;
        --bg-panel: #ffffff;
        --bg-subtle: #f3faf6;
        --ink: #172b24;
        --ink-soft: #4b635a;
        --brand: #0f8f66;
        --brand-dark: #0a5941;
        --brand-soft: #ddf4ea;
        --line: #cddcd5;
        --line-strong: #a9c0b7;
        --warn: #7a5300;
        --danger: #7f3128;
        --info: #1a4f7a;
        --shadow: 0 14px 36px rgba(8, 35, 26, 0.11);
        --focus-ring: 0 0 0 3px rgba(15, 143, 102, 0.24);
        --radius-sm: 12px;
        --radius-md: 14px;
        --radius-lg: 18px;
      }

      @keyframes shell-fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      body {
        font-family: "Source Sans 3", sans-serif;
        line-height: 1.5;
        background:
          radial-gradient(1200px circle at -14% -14%, rgba(15, 143, 102, 0.2), transparent 52%),
          radial-gradient(900px circle at 114% 8%, rgba(194, 150, 58, 0.18), transparent 50%),
          linear-gradient(180deg, #f9fdfb 0%, #eef5f2 45%, #e3ece7 100%);
        background-attachment: fixed;
        min-height: 100vh;
        overflow-x: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: auto auto 0 0;
        pointer-events: none;
        z-index: -1;
      }

      body::before {
        width: 52vw;
        height: 52vw;
        background: radial-gradient(circle, rgba(15, 143, 102, 0.1) 0%, transparent 68%);
        transform: translate(-28%, 38%);
      }

      body::after {
        inset: 0 0 auto auto;
        width: 44vw;
        height: 44vw;
        background: radial-gradient(circle, rgba(194, 150, 58, 0.12) 0%, transparent 70%);
        transform: translate(26%, -28%);
      }

      .shell {
        max-width: 1640px;
        animation: shell-fade-in 340ms ease-out;
      }

      .title,
      .panel h2,
      .panel h3,
      .mode-tab,
      .card-title,
      .detail-title,
      .compare-results-title,
      .stat .value {
        font-family: "Sora", sans-serif;
        letter-spacing: -0.01em;
      }

      .hero {
        gap: 16px;
        margin-bottom: 14px;
      }

      .hero-main {
        border-top: none;
        border-left: 4px solid var(--brand);
        border-radius: var(--radius-lg);
        background: linear-gradient(130deg, rgba(255, 255, 255, 0.98), rgba(242, 250, 246, 0.94));
        box-shadow: 0 10px 24px rgba(8, 35, 26, 0.08);
        padding: 12px 16px;
      }

      .brand-lockup {
        gap: 16px;
      }

      .brand-logo {
        max-height: 64px;
        filter: drop-shadow(0 3px 5px rgba(12, 61, 46, 0.14));
      }

      .title {
        font-size: clamp(1.28rem, 0.92vw + 0.98rem, 1.72rem);
        font-weight: 700;
        color: var(--brand-dark);
      }

      .subtitle {
        font-size: 0.98rem;
        color: #49645b;
      }

      .stamp {
        border: 1px solid rgba(154, 179, 168, 0.64);
        border-radius: 12px;
        background: linear-gradient(180deg, #ffffff, #f3f9f6);
        box-shadow: 0 8px 18px rgba(9, 38, 28, 0.08);
        color: #1b5f47;
        font-weight: 600;
      }

      .auth-strip {
        border-color: rgba(160, 184, 173, 0.7);
        border-radius: var(--radius-md);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(244, 250, 247, 0.94));
        box-shadow: 0 8px 18px rgba(9, 38, 28, 0.06);
      }

      .auth-line {
        color: #3e5b51;
      }

      .workflow {
        gap: 16px;
      }

      .panel {
        border: 1px solid rgba(159, 182, 171, 0.62);
        border-radius: var(--radius-lg);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.97), rgba(248, 252, 250, 0.95));
        box-shadow: var(--shadow);
      }

      @keyframes panel-enter {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .panel-inputs,
      .panel-results,
      .panel-details {
        animation: panel-enter 300ms ease-out both;
      }

      .panel-results {
        animation-delay: 40ms;
      }

      .panel-details {
        animation-delay: 80ms;
      }

      .panel h2 {
        color: #0d5f45;
