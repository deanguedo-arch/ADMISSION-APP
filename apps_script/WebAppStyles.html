<style>
      :root {
        --bg-page: #f2f5f3;
        --bg-panel: #ffffff;
        --bg-subtle: #f8fbf9;
        --ink: #2f3a35;
        --ink-soft: #5c6a64;
        --brand: #1f9d72;
        --brand-dark: #176f52;
        --brand-soft: #d8f1e8;
        --line: #d7e2dc;
        --line-strong: #b9ccc2;
        --warn: #8b6200;
        --danger: #8e3a2f;
        --info: #1c5e96;
        --shadow: 0 10px 28px rgba(16, 43, 33, 0.08);
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --radius-sm: 10px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --focus-ring: 0 0 0 3px rgba(31, 157, 114, 0.28);
        --touch-target: 44px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Open Sans", sans-serif;
        color: var(--ink);
        line-height: 1.4;
        background: radial-gradient(1400px circle at 0 0, #f9fcfb 0%, var(--bg-page) 46%, #edf3ef 100%);
      }

      .shell {
        max-width: 1560px;
        margin: 0 auto;
        padding: calc(var(--space-4) + env(safe-area-inset-top))
          calc(var(--space-4) + env(safe-area-inset-right))
          calc(var(--space-6) + env(safe-area-inset-bottom))
          calc(var(--space-4) + env(safe-area-inset-left));
      }

      .hero {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 10px;
      }

      .hero-main {
        flex: 1 1 auto;
        border: 1px solid var(--line);
        border-top: 4px solid var(--brand);
        border-radius: 12px;
        background: var(--bg-panel);
        padding: 8px 12px;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-logo {
        width: min(38vw, 240px);
        max-height: 56px;
        object-fit: contain;
        object-position: left center;
      }

      .title {
        margin: 0;
        font-family: "Rubik", sans-serif;
        font-size: clamp(1.2rem, 0.85vw + 0.95rem, 1.65rem);
        font-weight: 600;
        color: var(--brand-dark);
      }

      .subtitle {
        margin: 5px 0 0;
        color: var(--ink-soft);
        font-size: 0.89rem;
      }

      .stamp {
        font-size: 0.82rem;
        color: var(--brand-dark);
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg-panel);
        min-width: 220px;
      }

      .auth-strip {
        margin-bottom: 10px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg-panel);
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }

      .auth-line {
        margin: 0;
        color: var(--ink-soft);
        font-size: 0.93rem;
      }

      .auth-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }

      #googleSignIn {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .auth-fallback {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .auth-fallback-link {
        text-decoration: none;
      }

      .auth-fallback-note {
        margin: 0;
        font-size: 0.78rem;
      }

      .workflow {
        display: grid;
        grid-template-columns: minmax(300px, 360px) minmax(500px, 1fr) minmax(340px, 430px);
        gap: 14px;
        align-items: start;
      }

      .workflow.inputs-collapsed {
        grid-template-columns: minmax(540px, 1fr) minmax(340px, 460px);
      }

      .workflow.inputs-collapsed .panel-inputs {
        display: none;
      }

      .workflow.inputs-collapsed .panel-results {
        grid-column: 1;
      }

      .workflow.inputs-collapsed .panel-details {
        grid-column: 2;
      }

      .panel {
        background: var(--bg-panel);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        padding: var(--space-4);
        box-shadow: var(--shadow);
      }

      .panel-inputs,
      .panel-results,
      .panel-details {
        min-width: 0;
      }

      .panel-results {
        container-type: inline-size;
        container-name: results-panel;
      }

      .panel h2 {
        margin: 0 0 var(--space-2);
        font-family: "Rubik", sans-serif;
        font-size: 1.03rem;
        color: var(--brand-dark);
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }

      .panel-head h2 {
        margin: 0;
      }

      .panel-toggle-btn {
        white-space: nowrap;
        padding: 6px 10px;
      }

      .panel-toggle-btn.is-hidden {
        display: none;
      }

      .panel h3 {
        margin: 12px 0 7px;
        font-size: 0.92rem;
        color: var(--ink);
      }

      .hint {
        color: var(--ink-soft);
        margin: 0 0 10px;
        font-size: 0.9rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th,
      td {
        border-bottom: 1px solid #e2ebe6;
        text-align: left;
        padding: 6px 5px;
        vertical-align: top;
      }

      th {
        font-size: 0.73rem;
        letter-spacing: 0.03em;
        color: var(--ink-soft);
        text-transform: uppercase;
      }

      input[type="text"],
      input[type="number"],
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        padding: 7px 8px;
        font: inherit;
        color: var(--ink);
        background: #fff;
      }

      #electiveTable {
        table-layout: fixed;
      }

      #electiveTable th:nth-child(1),
      #electiveTable td:nth-child(1) {
        width: 46%;
      }

      #electiveTable th:nth-child(2),
      #electiveTable td:nth-child(2) {
        width: 20%;
      }

      #electiveTable th:nth-child(3),
      #electiveTable td:nth-child(3) {
        width: 24%;
      }

      #electiveTable th:nth-child(4),
      #electiveTable td:nth-child(4) {
        width: 10%;
      }

      #electiveTable select,
      #electiveTable input.mark-input {
        min-width: 0;
      }

      #electiveTable td:nth-child(4) {
        padding-right: 0;
      }

      #electiveTable td:nth-child(4) .btn-subtle {
        width: 100%;
        min-width: 0;
        min-height: 34px;
        padding: 6px 0;
        line-height: 1;
      }

      #namedTable td:nth-child(3) .btn-subtle {
        min-height: 34px;
        padding: 6px 8px;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(31, 157, 114, 0.14);
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      .summary-filter:focus-visible,
      .filter-btn:focus-visible,
      .result-control:focus-visible,
      .pin-btn:focus-visible,
      .action-btn:focus-visible,
      .compare-chip:focus-visible,
      .compare-view-btn:focus-visible,
      .detail-link:focus-visible,
      .source-link-inline:focus-visible {
        outline: none;
        border-color: var(--brand-dark);
        box-shadow: var(--focus-ring);
      }

      .result-card:focus-within {
        border-color: #89b8dc;
        box-shadow: inset 3px 0 0 #73a7e2, var(--focus-ring);
      }

      .mark-input-wrap {
        display: grid;
        gap: 3px;
      }

      .cell-error {
        min-height: 14px;
        font-size: 0.72rem;
        color: var(--danger);
      }

      .input-invalid {
        border-color: #df6e5f !important;
        background: #fff7f5;
      }

      .actions {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .run-actions {
        margin: 0 0 12px;
        padding: 2px 0 12px;
        border-bottom: 1px solid #e4ece8;
        align-items: center;
      }

      .run-actions .btn {
        min-width: 140px;
      }

      .btn {
        border: 1px solid transparent;
        border-radius: 9px;
        font: inherit;
        padding: 7px 11px;
        min-height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1.2;
        cursor: pointer;
        transition: border-color 0.12s ease, background 0.12s ease, color 0.12s ease;
      }

      .btn-main {
        background: var(--brand);
        color: #fff;
        font-weight: 700;
      }

      .btn-main:hover {
        background: var(--brand-dark);
      }

      .btn-subtle {
        border-color: var(--line-strong);
        background: #fff;
        color: var(--brand-dark);
      }

      .btn-subtle:hover {
        border-color: var(--brand);
      }

      .btn-danger-lite {
        background: #fff4f1;
        border-color: #eac3ba;
        color: var(--danger);
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: var(--space-2);
        margin-bottom: var(--space-3);
      }

      .mode-tabs {
        display: inline-flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        margin-bottom: var(--space-3);
      }

      .mode-tab {
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        min-height: var(--touch-target);
        padding: 8px 14px;
        font-size: 0.84rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      .mode-tab.active {
        border-color: #8bbfaa;
        background: #edf7f2;
        color: var(--brand-dark);
      }

      .mode-count {
        min-width: 22px;
        padding: 2px 7px;
        border-radius: 999px;
        border: 1px solid #c7d9d0;
        font-size: 0.74rem;
        text-align: center;
        background: #fff;
      }

      .snapshot-banner {
        border: 1px solid #cfe0d8;
        border-radius: 10px;
        background: #f6fbf8;
        padding: 9px 10px;
        margin-bottom: 10px;
        display: grid;
        gap: 4px;
      }

      .snapshot-banner-title {
        font-size: 0.84rem;
        color: #1f4f3f;
        font-weight: 700;
      }

      .snapshot-banner-date {
        font-size: 0.82rem;
        color: #375b4d;
      }

      .snapshot-banner.fresh {
        border-color: #cfe0d8;
        background: #f6fbf8;
      }

      .snapshot-banner.aging {
        border-color: #d8d7c7;
        background: #fcfbf5;
      }

      .snapshot-banner.aging .snapshot-banner-date {
        color: #6d6542;
      }

      .snapshot-banner.stale {
        border-color: #e0cec9;
        background: #fdf7f6;
      }

      .snapshot-banner.stale .snapshot-banner-date {
        color: #7a5149;
      }

      .stat {
        border-radius: var(--radius-sm);
        padding: var(--space-2) var(--space-3);
        border: 1px solid var(--line);
        background: #fbfdfc;
      }

      .summary-filter {
        width: 100%;
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
      }

      .summary-filter.is-active {
        border-color: #8fbfaa;
        background: #eaf6f0;
        box-shadow: 0 1px 0 rgba(17, 102, 76, 0.14);
      }

      .stat .label {
        font-size: 0.75rem;
        color: var(--ink-soft);
      }

      .stat .value {
        margin-top: 3px;
        font-family: "Rubik", sans-serif;
        font-size: 1.04rem;
        font-weight: 700;
      }

      .stat.good .value {
        color: var(--brand-dark);
      }

      .stat.warn .value {
        color: var(--warn);
      }

      .stat.neutral .value {
        color: #245444;
      }

      .result-toolbar {
        display: grid;
        gap: var(--space-2);
        margin-bottom: var(--space-2);
        padding: var(--space-2);
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: #f8fcfa;
      }

      .tab-group {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
      }

      .filter-btn {
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        background: #fff;
        padding: 8px 12px;
        min-height: var(--touch-target);
        font-size: 0.84rem;
        font-weight: 600;
        cursor: pointer;
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        gap: var(--space-1);
      }

      .filter-btn.active {
        background: var(--brand-soft);
        border-color: #9ccfbf;
        color: var(--brand-dark);
        font-weight: 700;
        box-shadow: 0 1px 0 rgba(31, 157, 114, 0.14);
      }

      .tab-count {
        min-width: 18px;
        text-align: center;
        padding: 1px 5px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid #c7d9d0;
        font-size: 0.75rem;
      }

      .toolbar-controls {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        align-items: stretch;
      }

      .result-control {
        width: auto;
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        padding: 10px;
        min-height: var(--touch-target);
        font: inherit;
        color: var(--ink);
        background: #fff;
        min-width: 0;
        flex: 1 1 150px;
      }

      #resultSearch {
        flex: 2.2 1 260px;
      }

      #sortSelect {
        flex: 1.3 1 220px;
      }

      #requirementTypeFilter {
        flex: 1.3 1 230px;
        min-width: 210px;
      }

      .clear-control {
        white-space: nowrap;
        flex: 0 0 auto;
        min-height: var(--touch-target);
      }

      .clear-control.is-active {
        border-color: #84bca9;
        background: #eaf6f0;
        color: var(--brand-dark);
        font-weight: 700;
      }

      .meeting-toggle {
        min-height: var(--touch-target);
      }

      .meeting-toggle[aria-pressed="true"] {
        border-color: #8bbfaa;
        background: #edf7f2;
        color: var(--brand-dark);
        font-weight: 700;
      }

      .results-wrap {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fbfefd;
        padding: var(--space-2);
        max-height: 71vh;
        overflow: auto;
      }

      .result-list {
        display: grid;
        gap: var(--space-2);
      }

      .result-card {
        border: 1px solid #d3e1da;
        border-radius: var(--radius-md);
        padding: var(--space-3);
        background: #fff;
        cursor: pointer;
        display: grid;
        gap: var(--space-2);
        content-visibility: auto;
        contain-intrinsic-size: 220px;
        transition: border-color 0.14s ease, box-shadow 0.14s ease, transform 0.14s ease;
      }

      .result-card:hover {
        border-color: #a9c6bb;
        box-shadow: 0 8px 18px rgba(20, 58, 44, 0.08);
        transform: translateY(-1px);
      }

      .result-card.row-selected {
        border-color: #89b8dc;
        box-shadow: inset 3px 0 0 #73a7e2;
      }

      .result-card.row-pinned {
        box-shadow: inset 3px 0 0 var(--brand);
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
      }

      .card-title-wrap {
        min-width: 0;
      }

      .card-title {
        margin: 0;
        font-family: "Rubik", sans-serif;
        font-size: 1rem;
        color: #1c4135;
      }

      .card-subtitle {
        margin: 2px 0 0;
        font-size: 0.84rem;
        color: var(--ink-soft);
      }

      .card-metrics {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        justify-content: flex-end;
        text-align: right;
        min-width: 0;
      }

      .metric-pill {
        border: 1px solid #d2e1da;
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 0.76rem;
        color: var(--ink-soft);
        background: #fff;
      }

      .status-pill {
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 0.76rem;
        font-weight: 700;
        border: 1px solid transparent;
      }

      .status-pill.eligible {
        color: #155942;
        border-color: #9dcfbf;
        background: #e5f4ee;
      }

      .status-pill.missing {
        color: #7b3a30;
        border-color: #e3b9b1;
        background: #faece9;
      }

      .status-pill.uncheckable {
        color: #184e82;
        border-color: #b2d0ec;
        background: #eaf3fc;
      }

      .decision-pill {
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 0.76rem;
        font-weight: 700;
        border: 1px solid transparent;
      }

      .decision-pill.decision-apply {
        color: #155942;
        border-color: #9dcfbf;
        background: #e5f4ee;
      }

      .decision-pill.decision-hold {
        color: #7a5600;
        border-color: #e3d39e;
        background: #fff9ec;
      }

      .decision-pill.decision-not_now {
        color: #7b3a30;
        border-color: #e3b9b1;
        background: #faece9;
      }

      .student-avg-block {
        flex: 1 0 100%;
        margin-top: 2px;
        line-height: 1.05;
      }

      .student-avg-label {
        font-size: 0.64rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: #4f655d;
      }

      .student-avg-value {
        margin-top: 2px;
        font-family: "Rubik", sans-serif;
        font-size: 1.42rem;
        font-weight: 800;
      }

      .student-avg-block.eligible .student-avg-value {
        color: #155942;
      }

      .student-avg-block.missing .student-avg-value {
        color: #7b3a30;
      }

      .student-avg-block.uncheckable .student-avg-value {
        color: #184e82;
      }

      .student-avg-block.neutral .student-avg-value {
        color: #345247;
      }

      .card-reason {
        font-size: 0.85rem;
        color: #435750;
        overflow-wrap: anywhere;
        word-break: break-word;
        hyphens: auto;
      }

      .card-warning {
        border: 1px solid #d9e5df;
        border-radius: 8px;
        padding: 6px 8px;
        font-size: 0.79rem;
        line-height: 1.35;
        background: #f9fcfb;
        color: #355449;
      }

      .card-warning.medium {
        border-color: #d7c892;
        background: #fff9eb;
        color: #6f5300;
      }

      .card-warning.low {
        border-color: #e5b5ad;
        background: #fff2f0;
        color: #7f342b;
      }

      .card-warning.uncheckable {
        border-color: #b7d2ea;
        background: #edf5fd;
        color: #184e82;
      }

      .card-warning-title {
        font-weight: 700;
      }

      .card-warning-reasons {
        margin: 4px 0 0 16px;
        padding: 0;
      }

      .source-link-inline {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #c8ddd3;
        border-radius: 999px;
        padding: 6px 11px;
        min-height: 36px;
        font-size: 0.76rem;
        font-weight: 700;
        color: #1d5742;
        background: #f3faf6;
        text-decoration: none;
      }

      .source-link-inline.prominent {
        border-color: #c0841e;
        background: #fff5df;
        color: #7a5300;
      }

      .source-link-inline:hover {
        border-color: #9cc8b6;
        background: #eaf6f0;
      }

      .source-link-missing {
        font-size: 0.78rem;
        color: #7f342b;
        font-weight: 700;
      }

      .card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .pin-btn,
      .action-btn {
        border: 1px solid #d1dfd8;
        border-radius: 999px;
        background: #fff;
        color: #2d5a49;
        font-size: 0.74rem;
        padding: 8px 12px;
        min-height: var(--touch-target);
        cursor: pointer;
      }

      .pin-btn.active,
      .action-btn.active {
        border-color: #8bbfaa;
        background: #edf7f2;
        color: var(--brand-dark);
        font-weight: 700;
      }

      .panel-details {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
        container-type: inline-size;
        container-name: details-panel;
      }

      .panel-details > h2 {
        margin: 0;
      }

      .compare-panel {
        margin-top: 8px;
        border: 1px solid #d1e1da;
        border-radius: 10px;
        background: #f9fcfa;
        padding: 8px;
        display: grid;
        gap: 8px;
      }

      .compare-strip {
        border: 1px dashed #c5d8cf;
        border-radius: 10px;
        background: #f9fcfa;
        padding: 8px;
        display: grid;
        gap: 6px;
      }

      .compare-results {
        margin-top: 8px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fcfefd;
        padding: 8px;
        display: grid;
        gap: 8px;
      }

      .compare-results.is-empty {
        display: none;
      }

      .compare-results-head {
        display: grid;
        gap: 2px;

      .compare-results-title {
        margin: 0;

      .compare-results-sub {

      .compare-chip {

        padding: 10px;

        gap: 8px;

        min-height: 0;

      .detail-head {

        gap: 2px;

      .detail-title {

        font-family: "Rubik", sans-serif;

        color: #1b4638;

      .detail-sub {

        font-size: 0.88rem;

      .detail-link {

      .detail-link-missing {

      .meaning-panel {

      .detail-warning {

        background: #fff2f0;
        color: #7f342b;

      .detail-warning.uncheckable {

        color: #184e82;

      .detail-highlights {

      .highlight-card {

      .highlight-card.ok {

        background: #f3faf6;

      .highlight-card.warn {
        border-color: #e3d39e;
        background: #fff9ec;

      .highlight-card.bad {
        border-color: #e5b9b2;

        word-break: break-word;

      }

      .meaning-item.bad {
        color: #7f342b;
      }

      .meaning-item.warn {
        color: #7a5600;
      }

      .detail-grid {

        border-radius: 10px;
        background: #fff;
        padding: 8px;
        min-width: 0;
        overflow: hidden;

      .detail-block h4 {
        margin: 0 0 6px;
        font-size: 0.8rem;
        color: #265845;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .detail-block p {
        margin: 0;
        overflow-wrap: anywhere;
        word-break: break-word;
        hyphens: auto;
      }

      .detail-summary {
        margin-bottom: 6px !important;
        font-weight: 600;
        color: #234d3e;

      .detail-list {
        margin: 0;
        padding-left: 17px;
        display: grid;
        gap: 3px;
        min-width: 0;

      .detail-list li {

        overflow-wrap: anywhere;
        word-break: break-word;

      .meeting-notes-block {

        gap: 8px;
        overflow: visible;

      .meeting-note-meta {
        margin: 0;
      }

      .meeting-decision-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .meeting-decision-btn {
        border: 1px solid #cadcd3;
        border-radius: 999px;
        background: #fff;
        color: #2d5a49;
        font-size: 0.76rem;
        padding: 8px 12px;
        min-height: var(--touch-target);

      }

      .meeting-decision-btn.active {
        font-weight: 700;
      }

        border-color: #9dcfbf;
        background: #e5f4ee;
        color: #155942;
      }

      .meeting-decision-btn.active.decision-hold {
        border-color: #e3d39e;
        background: #fff9ec;
        color: #7a5600;
      }

      .meeting-decision-btn.active.decision-not_now {
        border-color: #e3b9b1;
        background: #faece9;
        color: #7b3a30;
      }

      .meeting-note-input {

        width: 100%;

        background: #fff;

        overflow: auto;

        outline-offset: 1px;
      }

        margin-top: 0;
      }

      .requirement-line {
        display: grid;
        gap: 1px;
      }

      .req-label {
        font-weight: 700;
      }

      .req-meta {
        color: var(--ink-soft);
        font-size: 0.79rem;
      }

      .req-status {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .req-status.met {
        color: #1a5b44;
      }

      .req-status.low_mark {
        color: var(--warn);
      }

      .req-status.missing {
        color: var(--danger);
      }

      .req-status.unknown,
      .req-status.assessment {
        color: var(--info);
      }

      .collapsible {
        border: 1px solid #dde9e3;
        border-radius: 10px;
        background: #fff;
        padding: 8px;
      }

      .collapsible > summary {
        cursor: pointer;
        font-size: 0.82rem;
        font-weight: 700;
        color: #265845;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        list-style: none;
      }

      .collapsible > summary::-webkit-details-marker {
        display: none;
      }

      .collapsible > summary::after {
        content: " +";
        color: var(--ink-soft);
      }

      .collapsible[open] > summary::after {
        content: " -";
      }

      .compare-stack {
        display: grid;
        gap: 8px;
      }

      .compare-stack.mode-list {
        grid-template-columns: 1fr;
      }

      .compare-stack.mode-side {
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }

      .compare-columns-wrap {
        border: 1px solid #ddebe6;
        border-radius: 10px;
        overflow: auto;
        background: #fff;
      }

      .compare-columns-table {
        width: 100%;
        min-width: 720px;
        border-collapse: collapse;
      }

      .compare-columns-table th,
      .compare-columns-table td {
        border-bottom: 1px solid #e5f0ec;
        padding: 8px;
        vertical-align: top;
        text-align: left;
      }

      .compare-columns-table thead th {
        background: #f3f9f6;
      }

      .compare-columns-table .field-col {
        width: 190px;
        min-width: 190px;
        color: var(--brand-dark);
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .compare-columns-table .program-col {
        min-width: 220px;
      }

      .compare-columns-table td {
        font-size: 0.82rem;
        color: #3f544c;
        line-height: 1.35;
      }

      .compare-columns-table .compare-program {
        display: grid;
        gap: 3px;
      }

      .compare-columns-table .compare-program .status-pill {
        justify-self: start;
      }

      .compare-item {
        border: 1px solid #dde8e3;
        border-radius: 10px;
        background: #fff;
        padding: 8px;
        display: grid;
        gap: 7px;
      }

      .compare-item-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
      }

      .compare-item-title {
        min-width: 0;
      }

      .compare-item-title strong {
        display: block;
        font-size: 0.9rem;
        color: #1f4b3c;
      }

      .compare-item-title span {
        display: block;
        margin-top: 2px;
        font-size: 0.79rem;
        color: var(--ink-soft);
      }

      .compare-item-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .compare-item-stat {
        border: 1px solid #deebe5;
        border-radius: 8px;
        background: #fbfefd;
        padding: 6px;
      }

      .compare-item-stat .label {
        font-size: 0.72rem;
        color: var(--ink-soft);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .compare-item-stat .value {
        margin-top: 2px;
        font-size: 0.88rem;
        font-weight: 700;
        color: #1f4b3c;
      }

      .compare-item-line {
        margin: 0;
        font-size: 0.82rem;
        color: #3f544c;
      }

      .compare-item-line strong {
        color: #214f3f;
      }

      .compare-item-req {
        margin: 0;
        padding-left: 16px;
        display: grid;
        gap: 3px;
      }

      .compare-item-req li {
        font-size: 0.8rem;
        color: #3f544c;
      }

      .compare-table-wrap {
        border: 1px solid #ddebe6;
        border-radius: 10px;
        overflow: auto;
        background: #fff;
      }

      .compare-table {
        width: 100%;
        min-width: 860px;
        border-collapse: collapse;
      }

      .compare-table th,
      .compare-table td {
        border-bottom: 1px solid #e5f0ec;
        padding: 8px;
        vertical-align: top;
        text-align: left;
      }

      .compare-table thead th {
        background: #f3f9f6;
      }

      .compare-table .field-col {
        width: 210px;
        min-width: 210px;
        color: var(--brand-dark);
        font-size: 0.79rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .compare-program {
        display: grid;
        gap: 2px;
      }

      .compare-program strong {
        font-size: 0.88rem;
        color: #1d4739;
      }

      .compare-program span {
        font-size: 0.78rem;
        color: var(--ink-soft);
      }

      .status {
        margin-top: 8px;
        min-height: 18px;
        color: var(--ink-soft);
        font-size: 0.88rem;
      }

      .status.mini {
        margin-top: 6px;
        min-height: 16px;
        font-size: 0.8rem;
      }

      .status.error {

      }

      .empty {
        padding: 14px;
        color: var(--ink-soft);
        border: 1px dashed #d7e3dd;
        border-radius: 10px;

      }

      .ghost {
        font-size: 0.83rem;

      body.is-meeting .summary {
        gap: 9px;
      }

      body.is-meeting .stat {
        padding: 10px;
      }

      body.is-meeting .stat .label {
        font-size: 0.79rem;
      }

      body.is-meeting .stat .value {
        font-size: 1.12rem;
      }

      body.is-meeting .result-card {
        padding: 12px;
        gap: 8px;
      }

      body.is-meeting .card-title {
        font-size: 1.06rem;
      }

      body.is-meeting .card-subtitle {
        font-size: 0.88rem;
      }

      body.is-meeting .card-reason {
        font-size: 0.89rem;
      }

      body.is-meeting .details-drawer {
        padding: 12px;
        gap: 10px;
      }

      body.is-meeting .detail-title {
        font-size: 1.08rem;
      }

      body.is-meeting .detail-sub {
        font-size: 0.92rem;
      }

      body.is-meeting .detail-block {
        padding: 10px;
      }

      body.is-meeting .detail-block h4,
      body.is-meeting .meaning-panel h4 {
        font-size: 0.83rem;
      }

      body.is-meeting .detail-list li,
      body.is-meeting .meaning-item,
      body.is-meeting .highlight-value {
        font-size: 0.88rem;
      }

      body.is-meeting .meeting-note-input {
        font-size: 0.9rem;
        min-height: 140px;
      }

      body.is-meeting .meeting-decision-btn {
        font-size: 0.8rem;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }

        .result-card:hover {
          transform: none;
        }
      }

      @container results-panel (max-width: 760px) {
        .toolbar-controls {
          display: grid;
          grid-template-columns: 1fr;
        }

        .toolbar-controls > * {
          width: 100%;
        }

        #resultSearch,
        #sortSelect {
          flex: 1 1 auto;
        }

        .card-top {
          flex-direction: column;
          align-items: stretch;
        }

        .card-metrics {
          justify-content: flex-start;
        }
      }

      @container details-panel (max-width: 430px) {
        .details-drawer {
          padding: 8px;
          gap: 8px;
        }

        .detail-highlights,
        .detail-grid {
          grid-template-columns: 1fr;
        }

        .detail-block,
        .collapsible,
        .meaning-panel,
        .detail-warning {
          padding: 8px;
        }

        .detail-link {
          width: 100%;
        }

        .meeting-note-input {
          min-height: 120px;
        }
      }

      @media (max-width: 1480px) {
        .workflow {
          grid-template-columns: minmax(300px, 370px) minmax(420px, 1fr);
        }

        .workflow.inputs-collapsed {
          grid-template-columns: minmax(420px, 1fr) minmax(300px, 380px);
        }

        .panel-details {
          grid-column: 1 / -1;
        }

        .workflow.inputs-collapsed .panel-details {
          grid-column: auto;
        }

        .details-drawer {
          max-height: none;
        }
      }

      @media (max-width: 980px) {
        .hero {
          flex-direction: column;
          align-items: stretch;
        }

        .shell {
          padding: calc(var(--space-3) + env(safe-area-inset-top))
            calc(var(--space-3) + env(safe-area-inset-right))
            calc(var(--space-5) + env(safe-area-inset-bottom))
            calc(var(--space-3) + env(safe-area-inset-left));
        }

        .stamp {
          min-width: 0;
        }

        .brand-lockup {
          flex-direction: column;
          align-items: flex-start;
        }

        .brand-logo {
          width: min(72vw, 280px);
        }

        .workflow {
          grid-template-columns: 1fr;
        }

        .summary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .mode-tabs {
          display: grid;
          grid-template-columns: 1fr;
          width: 100%;
        }

        .mode-tab {
          width: 100%;
          justify-content: space-between;
        }

        .toolbar-controls {
          display: grid;
          grid-template-columns: 1fr;
        }

        .toolbar-controls > * {
          width: 100%;
        }

        .btn,
        .filter-btn,
        .mode-tab,
        .pin-btn,
        .action-btn {
          min-height: var(--touch-target);
        }

        .run-actions {
          position: sticky;
          bottom: calc(8px + env(safe-area-inset-bottom));
          z-index: 5;
          padding: 8px;
          border: 1px solid var(--line);
          border-radius: 12px;
          background: rgba(255, 255, 255, 0.94);
          backdrop-filter: blur(6px);
        }

        .run-actions .btn {
          flex: 1 1 calc(50% - 8px);
        }

        .detail-grid {
          grid-template-columns: 1fr;
        }

        .detail-highlights {
          grid-template-columns: 1fr;
        }

        .compare-item-grid {
          grid-template-columns: 1fr;
        }
      }

      /* Phase 1-2 visual refresh: stronger hierarchy + cleaner educational SaaS feel */
      :root {
        --bg-page: #ebf2ef;
        --bg-panel: #ffffff;
        --bg-subtle: #f3faf6;
        --ink: #172b24;
        --ink-soft: #4b635a;
        --brand: #0f8f66;
        --brand-dark: #0a5941;
        --brand-soft: #ddf4ea;
        --line: #cddcd5;
        --line-strong: #a9c0b7;
        --warn: #7a5300;
        --danger: #7f3128;
        --info: #1a4f7a;
        --shadow: 0 14px 36px rgba(8, 35, 26, 0.11);
        --focus-ring: 0 0 0 3px rgba(15, 143, 102, 0.24);
        --radius-sm: 12px;
        --radius-md: 14px;
        --radius-lg: 18px;
      }

      @keyframes shell-fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      body {
        font-family: "Source Sans 3", sans-serif;
        line-height: 1.5;
        background:
          radial-gradient(1200px circle at -14% -14%, rgba(15, 143, 102, 0.2), transparent 52%),
          radial-gradient(900px circle at 114% 8%, rgba(194, 150, 58, 0.18), transparent 50%),
          linear-gradient(180deg, #f9fdfb 0%, #eef5f2 45%, #e3ece7 100%);
        background-attachment: fixed;
        min-height: 100vh;
        overflow-x: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: auto auto 0 0;
        pointer-events: none;
        z-index: -1;
      }

      body::before {
        width: 52vw;
        height: 52vw;
        background: radial-gradient(circle, rgba(15, 143, 102, 0.1) 0%, transparent 68%);
        transform: translate(-28%, 38%);
      }

      body::after {
        inset: 0 0 auto auto;
        width: 44vw;
        height: 44vw;
        background: radial-gradient(circle, rgba(194, 150, 58, 0.12) 0%, transparent 70%);
        transform: translate(26%, -28%);
      }

      .shell {
        max-width: 1640px;
        animation: shell-fade-in 340ms ease-out;
      }

      .title,
      .panel h2,
      .panel h3,
      .mode-tab,
      .card-title,
      .detail-title,
      .compare-results-title,
      .stat .value {
        font-family: "Sora", sans-serif;
        letter-spacing: -0.01em;
      }

      .hero {
        gap: 16px;
        margin-bottom: 14px;
      }

      .hero-main {
        border-top: none;
        border-left: 4px solid var(--brand);
        border-radius: var(--radius-lg);
        background: linear-gradient(130deg, rgba(255, 255, 255, 0.98), rgba(242, 250, 246, 0.94));
        box-shadow: 0 10px 24px rgba(8, 35, 26, 0.08);
        padding: 12px 16px;
      }

      .brand-lockup {
        gap: 16px;
      }

      .brand-logo {
        max-height: 64px;
        filter: drop-shadow(0 3px 5px rgba(12, 61, 46, 0.14));
      }

      .title {
        font-size: clamp(1.28rem, 0.92vw + 0.98rem, 1.72rem);
        font-weight: 700;
        color: var(--brand-dark);
      }

      .subtitle {
        font-size: 0.98rem;
        color: #49645b;
      }

      .stamp {
        border: 1px solid rgba(154, 179, 168, 0.64);
        border-radius: 12px;
        background: linear-gradient(180deg, #ffffff, #f3f9f6);
        box-shadow: 0 8px 18px rgba(9, 38, 28, 0.08);
        color: #1b5f47;
        font-weight: 600;
      }

      .auth-strip {
        border-color: rgba(160, 184, 173, 0.7);
        border-radius: var(--radius-md);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(244, 250, 247, 0.94));
        box-shadow: 0 8px 18px rgba(9, 38, 28, 0.06);
      }

      .auth-line {
        color: #3e5b51;
      }

      .workflow {
        gap: 16px;
      }

      .panel {
        border: 1px solid rgba(159, 182, 171, 0.62);
        border-radius: var(--radius-lg);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.97), rgba(248, 252, 250, 0.95));
        box-shadow: var(--shadow);
      }

      @keyframes panel-enter {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .panel-inputs,
      .panel-results,
      .panel-details {
        animation: panel-enter 300ms ease-out both;
      }

      .panel-results {
        animation-delay: 40ms;
      }

      .panel-details {
        animation-delay: 80ms;
      }

      .panel h2 {
        color: #0d5f45;
      }

      .panel h3 {
        color: #27443b;
        font-size: 0.9rem;
      }

      .hint {
        color: #486159;
      }

      .input-flow {
        display: grid;
        gap: 6px;
        margin: 0 0 10px;
      }

      .flow-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        width: fit-content;
        border: 1px solid #c5d7cf;
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 0.78rem;
        font-weight: 600;
        color: #245646;
        background: linear-gradient(180deg, #ffffff, #f0f8f4);
      }

      .flow-chip strong {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #dff0e8;
        color: #12553f;
        font-size: 0.7rem;
        font-family: "Sora", sans-serif;
      }

      table th,
      table td {
        border-bottom-color: #dbe8e2;
      }

      th {
        font-size: 0.71rem;
        color: #587068;
      }

      input[type="text"],
      input[type="number"],
      select,
      textarea {
        border-width: 1.5px;
        border-radius: 11px;
        background: #fdfffe;
        box-shadow: inset 0 1px 0 rgba(15, 44, 33, 0.03);
      }

      input:focus,
      select:focus,
      textarea:focus {
        box-shadow: 0 0 0 3px rgba(15, 143, 102, 0.16);
      }

      .btn {
        border-radius: 12px;
        font-weight: 600;
        transition: border-color 0.16s ease, background 0.16s ease, color 0.16s ease, transform 0.16s ease,
          box-shadow 0.16s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn-main {
        background: linear-gradient(135deg, #13986d 0%, #0d6d4f 100%);
        box-shadow: 0 8px 16px rgba(14, 87, 62, 0.28);
      }

      .btn-main:hover {
        background: linear-gradient(135deg, #14a375 0%, #0e7655 100%);
      }

      .btn-subtle {
        border-color: #b3c9bf;
        background: linear-gradient(180deg, #ffffff, #f3faf6);
        color: #175f47;
      }

      .btn-subtle:hover {
        border-color: #8eb9a8;
        background: linear-gradient(180deg, #ffffff, #eaf5ef);
      }

      .btn-danger-lite {
        background: linear-gradient(180deg, #fff8f6, #fff0ec);
      }

      .mode-tabs {
        gap: 10px;
      }

      .mode-tab {
        border-color: #b8cdc4;
        background: linear-gradient(180deg, #ffffff, #f5faf7);
        color: #2b433b;
      }

      .mode-tab.active {
        border-color: #8dbfab;
        background: linear-gradient(180deg, #eaf7f1, #deefe7);
        color: #0f5f45;
        box-shadow: 0 6px 14px rgba(14, 89, 63, 0.12);
      }

      .snapshot-banner {
        border-color: #c3d8ce;
        background: linear-gradient(180deg, #f5fbf8, #edf6f1);
      }

      .summary {
        gap: 10px;
      }

      .stat {
        border-color: #ccdcd5;
        background: linear-gradient(180deg, #ffffff, #f6fbf8);
      }

      .result-toolbar {
        border-color: #c8d9d1;
        border-radius: 14px;
        background: linear-gradient(180deg, #f9fdfb, #f1f8f4);
      }

      .filter-btn {
        border-color: #bccfc7;
        background: linear-gradient(180deg, #ffffff, #f6fbf8);
      }

      .filter-btn.active {
        background: linear-gradient(180deg, #e5f5ed, #d8eee4);
        border-color: #8fbead;
      }

      .result-control {
        border-color: #b5c9c0;
        border-radius: 11px;
      }

      .results-wrap {
        border-color: #c8d8d1;
        border-radius: 14px;
        background: linear-gradient(180deg, #fdfffe, #f4fbf7);
        box-shadow: inset 0 1px 0 rgba(15, 44, 33, 0.05);
      }

      .result-list {
        gap: 10px;
      }

      .result-card {
        border-color: #c8dacf;
        border-radius: 14px;
        background: linear-gradient(180deg, #ffffff, #f8fcfa);
        box-shadow: 0 8px 16px rgba(12, 48, 36, 0.08);
      }

      .result-card:hover {
        border-color: #9fbfae;
        box-shadow: 0 14px 24px rgba(10, 44, 33, 0.13);
        transform: translateY(-2px);
      }

      .result-card.row-selected {
        border-color: #84aecf;
        box-shadow: inset 4px 0 0 #6298c6, 0 12px 20px rgba(9, 36, 27, 0.09);
      }

      .result-card.row-pinned {
        box-shadow: inset 4px 0 0 var(--brand), 0 12px 20px rgba(9, 36, 27, 0.09);
      }

      .card-title {
        color: #173d31;
      }

      .card-subtitle {
        color: #567068;
      }

      .metric-pill {
        border-color: #c7d9d1;
        background: #f9fdfb;
      }

      .card-reason {
        color: #446057;
      }

      .card-warning {
        border-color: #ccddd5;
        background: #f6fbf8;
      }

      .pin-btn,
      .action-btn {
        border-color: #bfd1c8;
        background: linear-gradient(180deg, #ffffff, #f4faf7);
      }

      .pin-btn.active,
      .action-btn.active {
        background: linear-gradient(180deg, #e5f5ed, #d8eee4);
      }

      .source-link-inline,
      .detail-link {
        border-color: #b8cec4;
        background: linear-gradient(180deg, #ffffff, #eff8f3);
      }

      .source-link-inline:hover,
      .detail-link:hover {
        background: linear-gradient(180deg, #ffffff, #e5f2eb);
      }

      .details-drawer {
        border-color: #c8d8d1;
        border-radius: 14px;
        background: linear-gradient(180deg, #fdfffe, #f3faf6);
      }

      .detail-title {
        color: #143f31;
      }

      .detail-sub {
        color: #516a62;
      }

      .detail-block,
      .collapsible,
      .meaning-panel,
      .detail-warning,
      .compare-strip,
      .compare-results {
        border-radius: 12px;
      }

      .detail-block,
      .collapsible,
      .meaning-panel {
        border-color: #d1e0d9;
      }

      .highlight-card {
        border-color: #cdded7;
      }

      .advanced-tools {
        border-color: #b7cdc3;
        border-radius: 13px;
        background: linear-gradient(180deg, #f8fdfb, #eef6f1);
      }

      .advanced-tools > summary {
        font-size: 0.88rem;
        font-weight: 700;
        color: #15543f;
      }

      .advanced-tools-content {
        padding: 0 10px 10px;
      }

      .compare-chip {
        border-color: #b9ccc3;
        background: linear-gradient(180deg, #ffffff, #f2f9f5);
      }

      .status {
        color: #486159;
      }

      /* Phase 2 refinement: cleaner visual rhythm + premium hierarchy */
      :root {
        --phase2-ink: #112620;
        --phase2-muted: #4d665d;
        --phase2-line: #d1e1d9;
        --phase2-soft-line: #e1ece7;
        --phase2-surface: #ffffff;
        --phase2-surface-soft: #f5faf8;
        --phase2-accent: #0f8f66;
        --phase2-accent-dark: #0a6f50;
      }

      body {
        background:
          radial-gradient(900px circle at -12% -10%, rgba(15, 143, 102, 0.15), transparent 56%),
          radial-gradient(760px circle at 108% 2%, rgba(13, 111, 80, 0.11), transparent 52%),
          linear-gradient(180deg, #f8fcfa 0%, #edf4f1 54%, #e8efeb 100%);
      }

      body::before {
        opacity: 0.6;
      }

      body::after {
        opacity: 0.45;
      }

      .shell {
        max-width: 1680px;
      }

      .hero {
        align-items: flex-start;
        gap: 14px;
      }

      .hero-main {
        border-left: none;
        border: 1px solid var(--phase2-line);
        border-radius: 20px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(246, 252, 249, 0.96));
        box-shadow: 0 10px 22px rgba(11, 47, 35, 0.08);
        padding: 18px 20px;
      }

      .title {
        font-size: clamp(1.3rem, 0.82vw + 1rem, 1.72rem);
        letter-spacing: -0.012em;
        color: var(--phase2-ink);
      }

      .subtitle {
        max-width: 70ch;
        font-size: 0.97rem;
        line-height: 1.5;
        color: var(--phase2-muted);
      }

      .brand-lockup {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .brand-lockup > div {
        display: grid;
        gap: 5px;
      }

      .brand-logo {
        width: clamp(255px, 30vw, 410px);
        max-height: 122px;
        padding: 8px 11px;
        border: 1px solid var(--phase2-soft-line);
        border-radius: 14px;
        background: linear-gradient(180deg, #ffffff, #f4faf7);
        box-shadow: 0 14px 24px rgba(12, 49, 37, 0.14);
        object-fit: contain;
      }

      .stamp {
        align-self: flex-start;
        min-width: 220px;
        border-color: #dbe8e2;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: none;
        color: #59736a;
        font-size: 0.78rem;
        font-weight: 600;
      }

      .auth-strip {
        border-color: var(--phase2-line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 8px 18px rgba(12, 45, 35, 0.06);
      }

      .workflow {
        gap: 12px;
      }

      .panel {
        border: 1px solid var(--phase2-line);
        border-radius: 16px;
        background: var(--phase2-surface);
        box-shadow: 0 7px 16px rgba(10, 41, 31, 0.08);
      }

      .panel-head {
        margin-bottom: 8px;
      }

      .panel h2 {
        color: var(--phase2-ink);
        font-weight: 700;
        font-size: 1.04rem;
      }

      .panel h3 {
        color: #26453b;
        font-size: 0.89rem;
      }

      .hint,
      .ghost,
      .status {
        color: var(--phase2-muted);
      }

      input[type="text"],
      input[type="number"],
      select,
      textarea {
        border: 1px solid var(--phase2-line);
        border-radius: 12px;
        background: #ffffff;
        min-height: 42px;
        transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: rgba(15, 143, 102, 0.55);
        box-shadow: 0 0 0 3px rgba(15, 143, 102, 0.16);
        background: #fbfefd;
      }

      .btn {
        border-radius: 12px;
        min-height: 42px;
      }

      .btn-main {
        background: linear-gradient(135deg, var(--phase2-accent) 0%, var(--phase2-accent-dark) 100%);
        border-color: #0c7e5c;
        box-shadow: 0 10px 18px rgba(11, 99, 70, 0.28);
      }

      .btn-main:hover {
        background: linear-gradient(135deg, #12a777 0%, #0c7b5a 100%);
        box-shadow: 0 12px 22px rgba(10, 83, 60, 0.32);
      }

      .btn-subtle {
        border-color: var(--phase2-line);
        background: #ffffff;
        color: #185640;
      }

      .btn-subtle:hover {
        border-color: #a6c1b6;
        background: var(--phase2-surface-soft);
      }

      .mode-tabs {
        gap: 6px;
        padding: 0;
        margin-bottom: 8px;
        border: none;
        border-radius: 0;
        background: transparent;
      }

      .mode-tab {
        border: 1px solid var(--phase2-line);
        border-radius: 10px;
        background: #ffffff;
        color: #355248;
      }

      .mode-tab.active {
        border-color: #95c2af;
        background: #eef7f2;
        color: #104f3a;
        box-shadow: none;
      }

      .snapshot-banner {
        border-color: var(--phase2-soft-line);
        border-radius: 14px;
        background: #f8fcfa;
      }

      .summary {
        gap: 8px;
        margin-bottom: 10px;
      }

      .stat {
        border-color: var(--phase2-soft-line);
        border-radius: 12px;
        background: #ffffff;
        box-shadow: none;
      }

      .result-toolbar {
        border: 1px solid var(--phase2-line);
        border-radius: 12px;
        background: #ffffff;
        box-shadow: none;
        padding: 10px;
      }

      .tab-group {
        gap: 6px;
      }

      .filter-btn {
        border-color: var(--phase2-line);
        border-radius: 9px;
        background: #ffffff;
        color: #27453b;
        font-size: 0.82rem;
        padding: 7px 11px;
      }

      .filter-btn.active {
        border-color: #95c2af;
        background: #eef7f2;
        color: #0f5f44;
      }

      .toolbar-controls {
        gap: 6px;
      }

      .result-control {
        border-color: var(--phase2-line);
        border-radius: 10px;
        background: #fcfefd;
        padding: 9px 10px;
      }

      .results-wrap {
        border-color: var(--phase2-soft-line);
        border-radius: 14px;
        background: #ffffff;
        padding: 10px;
      }

      .result-list {
        gap: 10px;
      }

      .result-card {
        border: 1px solid #d7e4dd;
        border-radius: 14px;
        background: #ffffff;
        box-shadow: 0 4px 10px rgba(8, 36, 27, 0.06);
        min-height: 196px;
        align-content: start;
      }

      .result-card.row-featured {
        border-color: #8dbdaa;
        box-shadow: 0 10px 20px rgba(12, 56, 40, 0.12);
        position: relative;
      }

      .result-card.row-featured::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        box-shadow: inset 4px 0 0 #3e9a74;
      }

      .result-card:hover {
        border-color: #9dbfae;
        box-shadow: 0 8px 14px rgba(9, 40, 30, 0.09);
        transform: translateY(-1px);
      }

      .card-title-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }

      .priority-pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        border: 1px solid transparent;
        padding: 3px 9px;
        font-size: 0.68rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .priority-pill.recommendation {
        border-color: #9dcfbf;
        background: #e4f4ed;
        color: #12553f;
      }

      .priority-pill.review {
        border-color: #e3b9b1;
        background: #faece9;
        color: #7a362c;
      }

      .priority-pill.manual {
        border-color: #b8d1e8;
        background: #edf5fc;
        color: #1d4f7a;
      }

      .card-key-gap {
        border: 1px solid #d8e5df;
        border-radius: 10px;
        background: #f8fcfa;
        padding: 8px 9px;
        display: grid;
        gap: 4px;
      }

      .card-key-gap-label {
        font-size: 0.66rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #4a665d;
      }

      .card-key-gap-value {
        font-size: 0.82rem;
        color: #24453a;
      }

      .card-key-gap.ok {
        border-color: #cce1d8;
        background: #f2faf6;
      }

      .card-key-gap.warn {
        border-color: #e1d1a2;
        background: #fff9ec;
      }

      .card-key-gap.warn .card-key-gap-label,
      .card-key-gap.warn .card-key-gap-value {
        color: #725700;
      }

      .card-key-gap.bad {
        border-color: #e4c1ba;
        background: #fff3f0;
      }

      .card-key-gap.bad .card-key-gap-label,
      .card-key-gap.bad .card-key-gap-value {
        color: #7b352c;
      }

      .metric-pill {
        border-color: var(--phase2-soft-line);
        background: #f8fcfa;
        color: #2f4e44;
      }

      .pin-btn,
      .action-btn,
      .source-link-inline,
      .detail-link {
        border-color: var(--phase2-line);
        background: #ffffff;
      }

      .details-drawer {
        border: 1px solid var(--phase2-soft-line);
        border-radius: 14px;
        background: #f9fcfa;
      }

      .detail-block,
      .collapsible,
      .meaning-panel,
      .detail-warning,
      .compare-strip,
      .compare-results {
        border-color: var(--phase2-soft-line);
        background: #ffffff;
      }

      .advanced-tools {
        border-color: var(--phase2-line);
        border-radius: 13px;
        background: #ffffff;
      }

      .advanced-tools > summary {
        color: #124d39;
      }

      .decision-pill {
        border-radius: 999px;
        border-width: 1px;
        padding: 3px 9px;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.01em;
      }

      .meeting-notes-block {
        border: 1px solid var(--phase2-line);
        border-radius: 13px;
        background: linear-gradient(180deg, #fcfefd, #f4faf7);
        padding: 10px;
      }

      .meeting-note-meta {
        font-size: 0.79rem;
        color: #557067;
      }

      .meeting-decision-row {
        gap: 8px;
      }

      .meeting-decision-btn {
        border-color: #c5d8cf;
        background: #ffffff;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .meeting-note-input {
        border-color: var(--phase2-line);
        background: #ffffff;
        min-height: 138px;
      }

      .meeting-note-actions .btn {
        min-height: 42px;
      }

      .run-actions {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #e2ece7;
      }

      @media (prefers-reduced-motion: reduce) {
        .panel-inputs,
        .panel-results,
        .panel-details,
        .btn,
        .result-card {
          animation: none !important;
          transition: none !important;
        }
      }

      @media (max-width: 980px) {
        .hero {
          gap: 10px;
        }

        .hero-main,
        .auth-strip,
        .panel {
          border-radius: 16px;
        }

        .result-toolbar {
          padding: 10px;
          position: sticky;
          top: 6px;
          z-index: 6;
        }

        .input-flow {
          display: flex;
          gap: 6px;
          overflow-x: auto;
          padding-bottom: 2px;
        }

        .flow-chip {
          flex: 0 0 auto;
          white-space: nowrap;
        }

        .run-actions {
          border-color: #b7cbc1;
          background: rgba(248, 252, 250, 0.95);
        }

        .hero-main {
          padding: 15px;
        }

        .brand-logo {
          width: min(80vw, 330px);
          max-height: 108px;
          padding: 7px 9px;
        }

        .stamp {
          min-width: 0;
          width: auto;
          font-size: 0.74rem;
        }

        .mode-tabs {
          padding: 3px;
        }

        .mode-tab {
          font-size: 0.82rem;
        }

        .tab-group {
          display: flex;
          flex-wrap: nowrap;
          gap: 6px;
          overflow-x: auto;
          padding-bottom: 2px;
        }

        .filter-btn {
          flex: 0 0 auto;
          white-space: nowrap;
        }

        .result-card {
          min-height: 0;
        }

        .card-title-row {
          flex-wrap: wrap;
        }

        .card-actions {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 6px;
        }

        .card-actions .source-link-inline,
        .card-actions .source-link-missing {
          grid-column: 1 / -1;
          justify-content: center;
          text-align: center;
          min-height: 44px;
        }

        .pin-btn,
        .action-btn {
          width: 100%;
          min-height: 44px;
        }

        .meeting-decision-row {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));

      /* Premium hardening pass (web + iOS-ready responsive shell) */
      :root {
        --premium-bg: #edf4f0;
        --premium-surface: #ffffff;
        --premium-surface-soft: #f6fbf8;
        --premium-line: #cfddd6;
        --premium-line-strong: #b6cbc1;
        --premium-ink: #122922;
        --premium-muted: #4b645b;
        --premium-brand: #0e8b63;
        --premium-brand-dark: #0a6348;
        --premium-ring: 0 0 0 3px rgba(14, 139, 99, 0.2);
      }

      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        color: var(--premium-ink);
        background:
          radial-gradient(1000px circle at -18% -16%, rgba(14, 139, 99, 0.14), transparent 56%),
          radial-gradient(780px circle at 118% 2%, rgba(42, 104, 79, 0.12), transparent 54%),
          linear-gradient(180deg, #f7fcf9 0%, var(--premium-bg) 56%, #e6efea 100%);
      }

      .shell {
        max-width: 1700px;
        padding: calc(14px + env(safe-area-inset-top))
          calc(16px + env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom))
          calc(16px + env(safe-area-inset-left));
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: start;
      }

      .hero-main,
      .auth-strip,
      .panel {
        border: 1px solid var(--premium-line);
        background: var(--premium-surface);
        box-shadow: 0 8px 20px rgba(11, 43, 33, 0.08);
      }

      .hero-main {
        padding: 12px 14px;
      }

      .brand-lockup {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        column-gap: 16px;
        row-gap: 8px;
      }

      .brand-lockup > div {
        display: grid;
        gap: 4px;
      }

      .brand-logo {
        width: clamp(250px, 24vw, 360px);
        max-height: 96px;
        border: 1px solid #dce9e3;
        border-radius: 14px;
        background: linear-gradient(180deg, #ffffff, #f4faf7);
        box-shadow: 0 12px 22px rgba(11, 43, 33, 0.12);
        padding: 6px 8px;
      }

      .title {
        margin: 0;
        font-size: clamp(1.28rem, 0.72vw + 0.96rem, 1.68rem);
        font-weight: 700;
        color: var(--premium-ink);
      }

      .subtitle {
        margin: 0;
        max-width: 58ch;
        font-size: 0.96rem;
        color: var(--premium-muted);
      }

      .stamp {
        min-width: 172px;
        border-color: #d8e6df;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: none;
        color: #577066;
        font-size: 0.8rem;
      }

      .auth-strip {
        margin-bottom: 12px;
      }

      .core-flow-note {
        margin: 0 0 10px;
        padding: 8px 10px;
        border: 1px solid #d8e5df;
        border-radius: 10px;
        background: var(--premium-surface-soft);
        color: #35574b;
        font-size: 0.84rem;
      }

      .input-flow {
        display: none !important;
      }

      .workflow {
        grid-template-columns: minmax(320px, 360px) minmax(640px, 1fr) minmax(340px, 420px);
        gap: 12px;
      }

      .workflow.inputs-collapsed {
        grid-template-columns: minmax(700px, 1fr) minmax(340px, 420px);
      }

      .panel {
        border-radius: 16px;
      }

      .panel h2 {
        color: var(--premium-ink);
      }

      .hint,
      .ghost,
      .status,
      .auth-line,
      .snapshot-banner-date {
        color: #3f5a51;
      }

      input[type="text"],
      input[type="number"],
      select,
      textarea {
        border: 1px solid var(--premium-line);
        border-radius: 11px;
        background: #ffffff;
        min-height: 42px;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: rgba(14, 139, 99, 0.62);
        box-shadow: var(--premium-ring);
      }

      button,
      .btn,
      .filter-btn,
      .mode-tab,
      .action-btn,
      .pin-btn,
      .meeting-decision-btn,
      .compare-chip,
      .compare-view-btn {

      }

      .btn {

      .btn-main {
        background: linear-gradient(135deg, var(--premium-brand), var(--premium-brand-dark));

      }

      .btn-subtle:hover {

      .mode-tabs {

      .mode-tab {

      }

      .snapshot-banner {

      }

      .summary {

      }

      .stat {
        border-color: #dae6e0;
        background: #ffffff;
      }

      .result-toolbar {

      .tab-group {

      #resultSearch {

      .results-wrap {
        border: 1px solid #d8e5df;
        border-radius: 14px;
        background: #ffffff;
      }

      .loading-state {
        display: grid;
        gap: 10px;
        padding: 10px 8px;
      }

      .loading-bar {
        height: 14px;
        width: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #e9f1ed 0%, #dbe9e2 52%, #e9f1ed 100%);
        background-size: 220% 100%;
        animation: shimmer 1.1s ease-in-out infinite;
      }

      .loading-bar.medium {
        width: 82%;
      }

      .loading-bar.short {
        width: 64%;

      @keyframes shimmer {
        from {

      .result-card {

      .card-top {

        grid-template-columns: minmax(0, 1fr) auto;

      .card-metrics {

          min-height: 44px;

        .mobile-action-bar.is-visible {
          display: flex;

        .bottom-nav {
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 8px;
          position: fixed;
          left: calc(12px + env(safe-area-inset-left));
          right: calc(12px + env(safe-area-inset-right));
          bottom: 0;
          z-index: 32;
          padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
          border: 1px solid #d3e1da;
          border-radius: 12px 12px 0 0;
          background: rgba(248, 252, 250, 0.99);
          box-shadow: 0 -8px 22px rgba(11, 43, 33, 0.12);
        }

        .bottom-nav-btn {
          min-height: 44px;
          border: 1px solid #d1dfd8;
          border-radius: 10px;
          background: #fff;
          color: #1f4f3f;
          font: inherit;
          font-weight: 700;
          cursor: pointer;
        }

        .bottom-nav-btn.active {
          border-color: #84bca9;
          background: #eaf6f0;
          color: var(--brand-dark);
        }

        body[data-screen="details"] .bottom-nav,
        body[data-screen="details"] .mobile-action-bar {
          display: none !important;
        }

        .filters-drawer {
          display: block;
          position: fixed;
          inset: 0;
          z-index: 40;
          pointer-events: none;
        }

        .filters-drawer-backdrop {
          position: absolute;
          inset: 0;
          background: rgba(10, 27, 21, 0.38);
          opacity: 0;
          transition: opacity 160ms ease;
        }

        .filters-drawer-sheet {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          transform: translateY(104%);
          transition: transform 190ms ease;
          border-radius: 14px 14px 0 0;
          border: 1px solid #d3e1da;
          background: #fff;
          padding: 12px;
          display: grid;
          gap: 10px;
          max-height: min(82dvh, 620px);
        }

        .filters-drawer-head {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;

        .filters-drawer-head h3 {

          color: var(--brand-dark);

        .filters-drawer-body {
          display: grid;
          gap: 8px;
          overflow: auto;
        }

        .filters-drawer-actions {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
        }

        .filters-drawer.is-open {
          pointer-events: auto;
        }

        .filters-drawer.is-open .filters-drawer-backdrop {
          opacity: 1;
        }

        .filters-drawer.is-open .filters-drawer-sheet {
          transform: translateY(0);
        }

      @media (max-width: 430px) {

          gap: 6px;
          padding-left: 6px;

          padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }

        #resultsWrap.mobile-grid-layout .result-list {
          grid-template-columns: 1fr;
        }

      /* 10/10 visual polish pass: emerald editorial theme with tighter hierarchy */
      :root {
        --brand: #0c8f66;
        --brand-dark: #0a5f45;
        --brand-soft: #e8f6ef;
        --line: #d2e1d9;
        --line-strong: #aec7bb;
        --focus-ring: 0 0 0 3px rgba(12, 143, 102, 0.24);
        --polish-accent: #bd8b2b;
        --polish-ink: #142a23;
        --polish-muted: #425d53;
      }

      body {
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        color: var(--polish-ink);
        line-height: 1.5;
        background:
          radial-gradient(900px circle at -12% -14%, rgba(12, 143, 102, 0.16), transparent 56%),
          radial-gradient(760px circle at 110% -4%, rgba(189, 139, 43, 0.14), transparent 52%),
          linear-gradient(180deg, #f8fcfa 0%, #eef5f1 54%, #e6eeea 100%);
      }

      .title,
      .panel h2,
      .panel h3,
      .card-title,
      .mode-tab,
      .filters-drawer-head h3 {
        font-family: "Sora", "Segoe UI", sans-serif;
        letter-spacing: -0.01em;
      }

      .subtitle,
      .hint,
      .ghost,
      .status,
      .auth-line,
      .card-subtitle,
      .snapshot-banner-date {
        color: var(--polish-muted);
      }

      .hero-main,
      .auth-strip,
      .panel,
      .stamp,
      .result-toolbar,
      .results-wrap,
      .details-drawer,
      .compare-panel,
      .compare-results,
      .compare-strip {
        border-color: var(--line);
      }

      .hero-main,
      .panel,
      .auth-strip {
        backdrop-filter: blur(7px);
      }

      .hero-main {
        position: relative;
        overflow: hidden;
      }

      .hero-main::after {
        content: "";
        position: absolute;
        inset: auto 0 0 0;
        height: 3px;
        background: linear-gradient(90deg, var(--brand) 0%, #20a97e 46%, var(--polish-accent) 100%);
      }

      .title {
        font-weight: 800;
        color: var(--polish-ink);
      }

      .stamp {
        border-radius: 999px;
        border-color: #ccddd5;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(245, 250, 247, 0.88));
        color: #3e5d51;
        font-weight: 700;
      }

      .mode-tabs {
        gap: 6px;
        margin-bottom: 10px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.72);
      }

      .mode-tab {
        border-radius: 11px;
        border-color: #d0e0d8;
        background: linear-gradient(180deg, #ffffff, #f6fbf8);
        color: #1d4639;
        transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
      }

      .mode-tab.active {
        border-color: #89bca8;
        background: linear-gradient(180deg, #eaf7f1, #deefe7);
        color: #0e5a42;
        box-shadow: 0 8px 16px rgba(12, 80, 58, 0.12);
        transform: translateY(-1px);
      }

      .mode-count {
        border-color: #c6d8cf;
        background: #fcfffd;
        color: #2a4f42;
      }

      .summary {
        gap: 10px;
      }

      .stat {
        position: relative;
        overflow: hidden;
        border-radius: 13px;
        border-color: #d8e7e0;
        background: linear-gradient(180deg, #ffffff, #f6fbf8);
        box-shadow: 0 7px 16px rgba(11, 43, 33, 0.08);
      }

      .stat::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 3px;
        background: linear-gradient(180deg, var(--brand), #19a176);
        opacity: 0.26;
      }

      .summary-filter {
        transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
      }

      .summary-filter.is-active {
        border-color: #89bca8;
        background: linear-gradient(180deg, #ebf8f2, #e0f1e9);
        box-shadow: 0 10px 20px rgba(11, 66, 49, 0.14);
        transform: translateY(-1px);
      }

      .result-toolbar {
        border-color: #d5e4dd;
        border-radius: 14px;
        background: linear-gradient(180deg, #ffffff, #f5faf7);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.84);
      }

      .result-control,
      input[type="text"],
      input[type="number"],
      select,
      textarea {
        border-color: #cfded7;
        transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      .result-control:hover,
      input[type="text"]:hover,
      input[type="number"]:hover,
      select:hover,
      textarea:hover {
        border-color: #abc5b8;
      }

      .btn {
        font-weight: 700;
        letter-spacing: 0.01em;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease,
          box-shadow 160ms ease,
          color 160ms ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn-main {
        border-color: #0d7456;
        box-shadow: 0 10px 18px rgba(11, 96, 67, 0.25);
      }

      .btn-subtle {
        border-color: #cdded6;
        color: #184e3c;
      }

      .btn-subtle:hover {
        border-color: #98bcae;
        background: #eef7f2;
      }

      .results-wrap {
        border-radius: 15px;
        background: linear-gradient(180deg, #fcfefd, #f4faf7);
      }

      .result-list {
        gap: 10px;
      }

      .result-card {
        position: relative;
        overflow: hidden;
        border-color: #d4e3dc;
        border-radius: 15px;
        background: linear-gradient(180deg, #ffffff, #f8fcfa);
        box-shadow: 0 8px 16px rgba(9, 37, 29, 0.07);
        transition: transform 170ms ease, border-color 170ms ease, box-shadow 170ms ease;
      }

      .result-card::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 3px;
        background: linear-gradient(90deg, var(--brand), #19a176, var(--polish-accent));
        opacity: 0;
        transition: opacity 170ms ease;
      }

      .result-card:hover::before,
      .result-card.row-selected::before,
      .result-card.row-pinned::before {
        opacity: 1;
      }

      .result-card:hover {
        border-color: #8db8a6;
        box-shadow: 0 14px 24px rgba(10, 44, 34, 0.12);
        transform: translateY(-2px);
      }

      .result-card.row-selected {
        border-color: #7fa7d6;
        box-shadow: 0 10px 20px rgba(68, 116, 174, 0.16);
      }

      .result-card.row-pinned {
        border-color: #87bca8;
        box-shadow: 0 10px 20px rgba(14, 110, 79, 0.16);
      }

      .card-title {
        font-size: 1.03rem;
        font-weight: 700;
        color: #153f33;
      }

      .metric-pill {
        border-color: #cfddd6;
        background: #fcfffd;
        color: #355b4e;
      }

      .details-drawer {
        border-radius: 14px;
        background: linear-gradient(180deg, #ffffff, #f6fbf8);
      }

      .panel-head-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
      }

      .panel-head-print-btn {
        display: none;
      }

      .brand-logo {
        width: min(56vw, 400px);
        max-height: 110px;
        object-fit: contain;
      }

      .bottom-nav {
        border-color: #cfe1d8;

        backdrop-filter: blur(10px);
