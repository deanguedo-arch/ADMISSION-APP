<style>
      :root {
        --bg-page: #f2f5f3;
        --bg-panel: #ffffff;
        --bg-subtle: #f8fbf9;
        --ink: #2f3a35;
        --ink-soft: #5c6a64;
        --brand: #1f9d72;
        --brand-dark: #176f52;
        --brand-soft: #d8f1e8;
        --line: #d7e2dc;
        --line-strong: #b9ccc2;
        --warn: #8b6200;
        --danger: #8e3a2f;
        --info: #1c5e96;
        --shadow: 0 10px 28px rgba(16, 43, 33, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Open Sans", sans-serif;
        color: var(--ink);
        background: var(--bg-page);
      }

      .shell {
        max-width: 1560px;
        margin: 0 auto;
        padding: 18px 18px 24px;
      }

      .hero {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
      }

      .hero-main {
        flex: 1 1 auto;
        border: 1px solid var(--line);
        border-top: 4px solid var(--brand);
        border-radius: 12px;
        background: var(--bg-panel);
        padding: 10px 14px;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-logo {
        width: min(42vw, 280px);
        max-height: 68px;
        object-fit: contain;
        object-position: left center;
      }

      .title {
        margin: 0;
        font-family: "Rubik", sans-serif;
        font-size: clamp(1.2rem, 0.85vw + 0.95rem, 1.65rem);
        font-weight: 600;
        color: var(--brand-dark);
      }

      .subtitle {
        margin: 5px 0 0;
        color: var(--ink-soft);
        font-size: 0.93rem;
      }

      .stamp {
        font-size: 0.86rem;
        color: var(--brand-dark);
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg-panel);
        min-width: 260px;
      }

      .auth-strip {
        margin-bottom: 12px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg-panel);
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }

      .auth-line {
        margin: 0;
        color: var(--ink-soft);
        font-size: 0.93rem;
      }

      .workflow {
        display: grid;
        grid-template-columns: minmax(300px, 360px) minmax(520px, 1fr) minmax(300px, 380px);
        gap: 14px;
        align-items: start;
      }

      .workflow.inputs-collapsed {
        grid-template-columns: minmax(560px, 1fr) minmax(320px, 420px);
      }

      .workflow.inputs-collapsed .panel-inputs {
        display: none;
      }

      .workflow.inputs-collapsed .panel-results {
        grid-column: 1;
      }

      .workflow.inputs-collapsed .panel-details {
        grid-column: 2;
      }

      .panel {
        background: var(--bg-panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        box-shadow: var(--shadow);
      }

      .panel h2 {
        margin: 0 0 10px;
        font-family: "Rubik", sans-serif;
        font-size: 1.03rem;
        color: var(--brand-dark);
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }

      .panel-head h2 {
        margin: 0;
      }

      .panel-toggle-btn {
        white-space: nowrap;
        padding: 6px 10px;
      }

      .panel-toggle-btn.is-hidden {
        display: none;
      }

      .panel h3 {
        margin: 12px 0 7px;
        font-size: 0.92rem;
        color: var(--ink);
      }

      .hint {
        color: var(--ink-soft);
        margin: 0 0 10px;
        font-size: 0.9rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th,
      td {
        border-bottom: 1px solid #e2ebe6;
        text-align: left;
        padding: 6px 5px;
        vertical-align: top;
      }

      th {
        font-size: 0.73rem;
        letter-spacing: 0.03em;
        color: var(--ink-soft);
        text-transform: uppercase;
      }

      input[type="text"],
      input[type="number"],
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        padding: 7px 8px;
        font: inherit;
        color: var(--ink);
        background: #fff;
      }

      #electiveTable {
        table-layout: fixed;
      }

      #electiveTable th:nth-child(1),
      #electiveTable td:nth-child(1) {
        width: 46%;
      }

      #electiveTable th:nth-child(2),
      #electiveTable td:nth-child(2) {
        width: 20%;
      }

      #electiveTable th:nth-child(3),
      #electiveTable td:nth-child(3) {
        width: 24%;
      }

      #electiveTable th:nth-child(4),
      #electiveTable td:nth-child(4) {
        width: 10%;
      }

      #electiveTable select,
      #electiveTable input.mark-input {
        min-width: 0;
      }

      #electiveTable td:nth-child(4) {
        padding-right: 0;
      }

      #electiveTable td:nth-child(4) .btn-subtle {
        width: 100%;
        min-width: 0;
        padding: 6px 0;
        line-height: 1;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(31, 157, 114, 0.14);
      }

      .mark-input-wrap {
        display: grid;
        gap: 3px;
      }

      .cell-error {
        min-height: 14px;
        font-size: 0.72rem;
        color: var(--danger);
      }

      .input-invalid {
        border-color: #df6e5f !important;
        background: #fff7f5;
      }

      .paste-input {
        resize: vertical;
      }

      .actions {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .run-actions {
        margin-top: 12px;
      }

      .btn {
        border: 1px solid transparent;
        border-radius: 9px;
        font: inherit;
        padding: 7px 11px;
        cursor: pointer;
        transition: border-color 0.12s ease, background 0.12s ease, color 0.12s ease;
      }

      .btn-main {
        background: var(--brand);
        color: #fff;
        font-weight: 700;
      }

      .btn-main:hover {
        background: var(--brand-dark);
      }

      .btn-subtle {
        border-color: var(--line-strong);
        background: #fff;
        color: var(--brand-dark);
      }

      .btn-subtle:hover {
        border-color: var(--brand);
      }

      .btn-danger-lite {
        background: #fff4f1;
        border-color: #eac3ba;
        color: var(--danger);
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 7px;
        margin-bottom: 10px;
      }

      .stat {
        border-radius: 10px;
        padding: 8px;
        border: 1px solid var(--line);
        background: var(--bg-subtle);
      }

      .stat .label {
        font-size: 0.75rem;
        color: var(--ink-soft);
      }

      .stat .value {
        margin-top: 3px;
        font-family: "Rubik", sans-serif;
        font-size: 1.04rem;
        font-weight: 700;
      }

      .stat.good .value {
        color: var(--brand-dark);
      }

      .stat.warn .value {
        color: var(--warn);
      }

      .stat.neutral .value {
        color: #245444;
      }

      .result-toolbar {
        display: grid;
        gap: 8px;
        margin-bottom: 8px;
      }

      .tab-group {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .filter-btn {
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        background: #fff;
        padding: 6px 10px;
        font-size: 0.84rem;
        cursor: pointer;
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .filter-btn.active {
        background: var(--brand-soft);
        border-color: #9ccfbf;
        color: var(--brand-dark);
        font-weight: 700;
      }

      .tab-count {
        min-width: 18px;
        text-align: center;
        padding: 1px 5px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid #c7d9d0;
        font-size: 0.75rem;
      }

      .toolbar-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: stretch;
      }

      .result-control {
        width: auto;
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        padding: 7px 8px;
        font: inherit;
        color: var(--ink);
        background: #fff;
        min-width: 0;
        flex: 1 1 150px;
      }

      #resultSearch {
        flex: 2.2 1 260px;
      }

      #sortSelect {
        flex: 1.3 1 220px;
      }

      .clear-control {
        white-space: nowrap;
        padding: 7px 10px;
        flex: 0 0 auto;
      }

      .results-wrap {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fdfefd;
        padding: 8px;
        max-height: 71vh;
        overflow: auto;
      }

      .result-list {
        display: grid;
        gap: 8px;
      }

      .result-card {
        border: 1px solid #dbe7e1;
        border-radius: 11px;
        padding: 10px;
        background: #fff;
        cursor: pointer;
        display: grid;
        gap: 7px;
      }

      .result-card:hover {
        border-color: #b8cec4;
      }

      .result-card.row-selected {
        border-color: #89b8dc;
        box-shadow: inset 3px 0 0 #73a7e2;
      }

      .result-card.row-pinned {
        box-shadow: inset 3px 0 0 var(--brand);
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
      }

      .card-title-wrap {
        min-width: 0;
      }

      .card-title {
        margin: 0;
        font-family: "Rubik", sans-serif;
        font-size: 1rem;
        color: #1c4135;
      }

      .card-subtitle {
        margin: 2px 0 0;
        font-size: 0.84rem;
        color: var(--ink-soft);
      }

      .card-metrics {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .metric-pill {
        border: 1px solid #d2e1da;
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 0.76rem;
        color: var(--ink-soft);
        background: #fff;
      }

      .status-pill {
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 0.76rem;
        font-weight: 700;
        border: 1px solid transparent;
      }

      .status-pill.eligible {
        color: #155942;
        border-color: #9dcfbf;
        background: #e5f4ee;
      }

      .status-pill.missing {
        color: #7b3a30;
        border-color: #e3b9b1;
        background: #faece9;
      }

      .status-pill.uncheckable {
        color: #184e82;
        border-color: #b2d0ec;
        background: #eaf3fc;
      }

      .card-reason {
        font-size: 0.85rem;
        color: #435750;
      }

      .card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .pin-btn,
      .action-btn {
        border: 1px solid #d1dfd8;
        border-radius: 999px;
        background: #fff;
        color: #2d5a49;
        font-size: 0.74rem;
        padding: 3px 8px;
        cursor: pointer;
      }

      .pin-btn.active,
      .action-btn.active {
        border-color: #8bbfaa;
        background: #edf7f2;
        color: var(--brand-dark);
        font-weight: 700;
      }

      .panel-details {
        display: grid;
        gap: 8px;
      }

      .compare-strip {
        border: 1px dashed #c5d8cf;
        border-radius: 10px;
        background: #f9fcfa;
        padding: 8px;
        display: grid;
        gap: 6px;
      }

      .compare-results {
        margin-top: 8px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fcfefd;
        padding: 8px;
        display: grid;
        gap: 8px;
      }

      .compare-results.is-empty {
        display: none;
      }

      .compare-results-head {
        display: grid;
        gap: 2px;
      }

      .compare-results-title {
        margin: 0;
        font-family: "Rubik", sans-serif;
        font-size: 0.96rem;
        color: #1b4638;
      }

      .compare-results-sub {
        margin: 0;
        font-size: 0.82rem;
        color: var(--ink-soft);
      }

      .compare-results-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }

      .compare-view-toggle {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border: 1px solid #d4e1db;
        border-radius: 999px;
        background: #fff;
        padding: 2px;
      }

      .compare-view-btn {
        border: 1px solid transparent;
        border-radius: 999px;
        background: transparent;
        color: #2d5a49;
        font-size: 0.74rem;
        padding: 4px 9px;
        cursor: pointer;
      }

      .compare-view-btn.active {
        border-color: #8bbfaa;
        background: #edf7f2;
        color: var(--brand-dark);
        font-weight: 700;
      }

      .compare-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .compare-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .compare-chip {
        border: 1px solid #cadcd3;
        border-radius: 999px;
        background: #fff;
        color: #2d5a49;
        font-size: 0.76rem;
        padding: 4px 8px;
        cursor: pointer;
      }

      .details-drawer {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fcfefd;
        padding: 10px;
        display: grid;
        gap: 8px;
        max-height: 72vh;
        overflow: auto;
      }

      .detail-head {
        display: grid;
        gap: 2px;
      }

      .detail-title {
        margin: 0;
        font-family: "Rubik", sans-serif;
        font-size: 1rem;
        color: #1b4638;
      }

      .detail-sub {
        margin: 0;
        font-size: 0.88rem;
        color: var(--ink-soft);
      }

      .meaning-panel {
        border: 1px solid #dae8e1;
        border-radius: 10px;
        padding: 8px;
        background: #fff;
      }

      .meaning-panel h4 {
        margin: 0 0 6px;
        font-size: 0.84rem;
        color: var(--brand-dark);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .meaning-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 4px;
      }

      .meaning-item {
        font-size: 0.86rem;
      }

      .meaning-item.ok {
        color: #1a5b44;
      }

      .meaning-item.bad {
        color: #7f342b;
      }

      .meaning-item.warn {
        color: #7a5600;
      }

      .detail-grid {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .detail-block {
        border: 1px solid #dde9e3;
        border-radius: 10px;
        background: #fff;
        padding: 8px;
      }

      .detail-block h4 {
        margin: 0 0 6px;
        font-size: 0.8rem;
        color: #265845;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .detail-list {
        margin: 0;
        padding-left: 17px;
        display: grid;
        gap: 3px;
      }

      .detail-list li {
        font-size: 0.84rem;
      }

      .requirement-line {
        display: grid;
        gap: 1px;
      }

      .req-label {
        font-weight: 700;
      }

      .req-meta {
        color: var(--ink-soft);
        font-size: 0.79rem;
      }

      .req-status {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .req-status.met {
        color: #1a5b44;
      }

      .req-status.low_mark {
        color: var(--warn);
      }

      .req-status.missing {
        color: var(--danger);
      }

      .req-status.unknown,
      .req-status.assessment {
        color: var(--info);
      }

      .collapsible {
        border: 1px solid #dde9e3;
        border-radius: 10px;
        background: #fff;
        padding: 8px;
      }

      .collapsible > summary {
        cursor: pointer;
        font-size: 0.82rem;
        font-weight: 700;
        color: #265845;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        list-style: none;
      }

      .collapsible > summary::-webkit-details-marker {
        display: none;
      }

      .collapsible > summary::after {
        content: " +";
        color: var(--ink-soft);
      }

      .collapsible[open] > summary::after {
        content: " -";
      }

      .compare-stack {
        display: grid;
        gap: 8px;
      }

      .compare-stack.mode-list {
        grid-template-columns: 1fr;
      }

      .compare-stack.mode-side {
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }

      .compare-columns-wrap {
        border: 1px solid #ddebe6;
        border-radius: 10px;
        overflow: auto;
        background: #fff;
      }

      .compare-columns-table {
        width: 100%;
        min-width: 720px;
        border-collapse: collapse;
      }

      .compare-columns-table th,
      .compare-columns-table td {
        border-bottom: 1px solid #e5f0ec;
        padding: 8px;
        vertical-align: top;
        text-align: left;
      }

      .compare-columns-table thead th {
        background: #f3f9f6;
      }

      .compare-columns-table .field-col {
        width: 190px;
        min-width: 190px;
        color: var(--brand-dark);
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .compare-columns-table .program-col {
        min-width: 220px;
      }

      .compare-columns-table td {
        font-size: 0.82rem;
        color: #3f544c;
        line-height: 1.35;
      }

      .compare-columns-table .compare-program {
        display: grid;
        gap: 3px;
      }

      .compare-columns-table .compare-program .status-pill {
        justify-self: start;
      }

      .compare-item {
        border: 1px solid #dde8e3;
        border-radius: 10px;
        background: #fff;
        padding: 8px;
        display: grid;
        gap: 7px;
      }

      .compare-item-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
      }

      .compare-item-title {
        min-width: 0;
      }

      .compare-item-title strong {
        display: block;
        font-size: 0.9rem;
        color: #1f4b3c;
      }

      .compare-item-title span {
        display: block;
        margin-top: 2px;
        font-size: 0.79rem;
        color: var(--ink-soft);
      }

      .compare-item-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .compare-item-stat {
        border: 1px solid #deebe5;
        border-radius: 8px;
        background: #fbfefd;
        padding: 6px;
      }

      .compare-item-stat .label {
        font-size: 0.72rem;
        color: var(--ink-soft);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .compare-item-stat .value {
        margin-top: 2px;
        font-size: 0.88rem;
        font-weight: 700;
        color: #1f4b3c;
      }

      .compare-item-line {
        margin: 0;
        font-size: 0.82rem;
        color: #3f544c;
      }

      .compare-item-line strong {
        color: #214f3f;
      }

      .compare-item-req {
        margin: 0;
        padding-left: 16px;
        display: grid;
        gap: 3px;
      }

      .compare-item-req li {
        font-size: 0.8rem;
        color: #3f544c;
      }

      .compare-table-wrap {
        border: 1px solid #ddebe6;
        border-radius: 10px;
        overflow: auto;
        background: #fff;
      }

      .compare-table {
        width: 100%;
        min-width: 860px;
        border-collapse: collapse;
      }

      .compare-table th,
      .compare-table td {
        border-bottom: 1px solid #e5f0ec;
        padding: 8px;
        vertical-align: top;
        text-align: left;
      }

      .compare-table thead th {
        background: #f3f9f6;
      }

      .compare-table .field-col {
        width: 210px;
        min-width: 210px;
        color: var(--brand-dark);
        font-size: 0.79rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .compare-program {
        display: grid;
        gap: 2px;
      }

      .compare-program strong {
        font-size: 0.88rem;
        color: #1d4739;
      }

      .compare-program span {
        font-size: 0.78rem;
        color: var(--ink-soft);
      }

      .status {
        margin-top: 8px;
        min-height: 18px;
        color: var(--ink-soft);
        font-size: 0.88rem;
      }

      .status.mini {
        margin-top: 6px;
        min-height: 16px;
        font-size: 0.8rem;
      }

      .status.error {
        color: var(--danger);
      }

      .empty {
        padding: 14px;
        color: var(--ink-soft);
        border: 1px dashed #d7e3dd;
        border-radius: 10px;
        background: #fff;
      }

      .ghost {
        font-size: 0.83rem;
        color: var(--ink-soft);
      }
