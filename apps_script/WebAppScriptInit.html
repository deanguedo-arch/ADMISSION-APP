<script>
      boot();

      if (isMobileAppShell_()) {
        syncScreenFromHash_({ skipRender: true, replaceHash: true });
        updateMobileShellForScreen_({ syncHash: true });
      } else {
        state.mobileScreen = MOBILE_SCREEN_DEFAULT;
        state.lastNonDetailScreen = MOBILE_SCREEN_DEFAULT;
        updateMobileShellForScreen_({ syncHash: false });
      }
      renderResults();
      renderCompareStrip();
      renderCompareResults();
      renderDetailsDrawer();

      document.getElementById("addNamedBtn").addEventListener("click", () => addNamedRow());
      document.getElementById("addElectiveBtn").addEventListener("click", () => addElectiveRow());
      document.getElementById("runBtn").addEventListener("click", runCheck);
      if (ui.csvBtn) ui.csvBtn.addEventListener("click", exportCsv);
      if (ui.pdfBtn) ui.pdfBtn.addEventListener("click", exportPdf);
      document.getElementById("resetBtn").addEventListener("click", resetForm);
      if (ui.toggleInputsBtn) ui.toggleInputsBtn.addEventListener("click", toggleInputsPanel);
      if (ui.showInputsBtn) ui.showInputsBtn.addEventListener("click", toggleInputsPanel);
      if (ui.modeTabs) ui.modeTabs.addEventListener("click", onModeTabClick);
      if (ui.filterGroup) ui.filterGroup.addEventListener("click", onFilterClick);
      if (ui.summaryFilters) ui.summaryFilters.addEventListener("click", onSummaryFilterClick_);
      ui.resultsWrap.addEventListener("click", onResultsWrapClick);
      ui.resultsWrap.addEventListener("keydown", onResultsWrapKeydown);
      ui.resultSearch.addEventListener("input", onResultSearchInput);
      ui.institutionFilter.addEventListener("change", onResultControlChange);
      ui.credentialFilter.addEventListener("change", onResultControlChange);
      if (ui.requirementTypeFilter) ui.requirementTypeFilter.addEventListener("change", onResultControlChange);
      ui.sortSelect.addEventListener("change", onResultControlChange);
      ui.clearResultFiltersBtn.addEventListener("click", clearResultFilters);
      if (ui.showAllBtn) ui.showAllBtn.addEventListener("click", showAllPrograms_);
      if (ui.mobileLayoutToggleBtn) ui.mobileLayoutToggleBtn.addEventListener("click", toggleMobileProgramLayout_);
      if (ui.exportMeetingNotesBtn) ui.exportMeetingNotesBtn.addEventListener("click", exportMeetingPacketPdf);
      if (ui.mobileActionBar) ui.mobileActionBar.addEventListener("click", onMobileActionBarClick_);
      if (ui.mobileHeadPrintBtn) {
        ui.mobileHeadPrintBtn.addEventListener("click", () => {
          if (ui.exportMeetingNotesBtn && !ui.exportMeetingNotesBtn.disabled) exportMeetingPacketPdf();
        });
      }
      if (ui.mobileFiltersBtn) ui.mobileFiltersBtn.addEventListener("click", openFiltersDrawer_);
      if (ui.filtersDrawerCloseBtn) ui.filtersDrawerCloseBtn.addEventListener("click", () => closeFiltersDrawer_({}));
      if (ui.filtersDrawerBackdrop) ui.filtersDrawerBackdrop.addEventListener("click", () => closeFiltersDrawer_({}));
      if (ui.mobileApplyDrawerBtn) ui.mobileApplyDrawerBtn.addEventListener("click", applyFiltersDrawer_);
      if (ui.mobileClearDrawerBtn) ui.mobileClearDrawerBtn.addEventListener("click", clearResultFilters);
      if (ui.mobileDetailsBackBtn) ui.mobileDetailsBackBtn.addEventListener("click", closeDetailsScreen_);
      if (ui.bottomNav) ui.bottomNav.addEventListener("click", onBottomNavClick_);
      ui.compareStrip.addEventListener("click", onCompareStripClick);
      if (ui.compareResults) ui.compareResults.addEventListener("click", onCompareResultsClick);
      if (ui.pinnedComparisonBtn) ui.pinnedComparisonBtn.addEventListener("click", generatePinnedComparisonSheet);
      if (ui.pinnedSemesterPlanBtn) ui.pinnedSemesterPlanBtn.addEventListener("click", generatePinnedSemesterPlan);
      if (ui.detailsDrawer) ui.detailsDrawer.addEventListener("input", onDetailsDrawerInput);
      if (ui.detailsDrawer) ui.detailsDrawer.addEventListener("change", onDetailsDrawerInput);
      if (ui.detailsDrawer) ui.detailsDrawer.addEventListener("click", onDetailsDrawerClick);
      if (ui.detailsDrawer) ui.detailsDrawer.addEventListener("toggle", onDetailsDrawerToggle, true);
      window.addEventListener("resize", () => {
        schedulePanelHeightSync();
        updateMobileShellForScreen_({ syncHash: false });
        renderResults();
        renderCompareStrip();
        renderCompareResults();
      });
      window.addEventListener("popstate", onPopState_);
</script>
