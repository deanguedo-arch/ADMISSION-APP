      function updateSummary(summary) {
        ui.sumTotal.textContent = Number(summary.totalPrograms || 0);
        ui.sumEligible.textContent = Number(summary.eligible || 0);
        ui.sumMissing.textContent = Number(summary.missing || 0);
        ui.sumUncheckable.textContent = Number(summary.uncheckable || 0);
      }

      function formatUtcStamp(value) {
        const iso = String(value || "").trim();
        return iso ? iso.replace("T", " ").replace("Z", " UTC") : "";
      }

      function getResultMeta() {
        if (!(state.resultModel && state.resultModel.meta && typeof state.resultModel.meta === "object")) return {};
        return state.resultModel.meta;
      }

      function getResultDatasetStamp() {
        return String((getResultMeta().datasetStamp || "")).trim();
      }

      function updateHeaderStampFromResult() {
        if (!state.result) return;
        const meta = getResultMeta();
        const generated = formatUtcStamp(state.result.generatedAt || meta.generatedAt || "");
        const syncedLocal = String(meta.lastProgramsSyncLocal || "").trim();
        const synced = formatUtcStamp(meta.lastProgramsSyncUtc || "");
        const datasetStamp = getResultDatasetStamp();
        const rows = (state.resultModel && state.resultModel.rows) || [];
        const institutions = uniqueStrings(
          rows.map((row) => String(row.institution || "").trim()).filter(Boolean)
        );
        const sourceText = institutions.length ? institutions.slice(0, 3).join(" / ") : "Admissions dataset";
        const updateText = syncedLocal || synced || generated || "n/a";
        ui.stamp.textContent = `Data updated: ${updateText} | Source: ${sourceText}`;
        const hidden = [];
        if (syncedLocal) hidden.push(`Synced (local): ${syncedLocal}`);
        if (synced) hidden.push(`Synced (UTC): ${synced}`);
        if (generated) hidden.push(`Generated: ${generated}`);
        if (datasetStamp) hidden.push(`Dataset: ${datasetStamp}`);
        if (meta.cacheHit === true) hidden.push("Cache: hit");
        if (meta.cacheHit === false) hidden.push("Cache: miss");
        ui.stamp.title = hidden.join(" | ");
      }

      function onFilterClick(e) {
        const btn = e.target && e.target.closest("button[data-view]");
        if (!btn) return;
        const nextView = String(btn.dataset.view || "ineligible").trim();
        if (RESULT_VIEWS.indexOf(nextView) < 0) return;
        if (nextView === "shortlist" && countShortlistRows() === 0) {
          state.view = "shortlist";
          updateFilterCounts();
          syncFilterButtons();
          renderResults();
          setStatus("Shortlist is empty. Pin programs from any view to add them.");
          return;
        }
        state.view = nextView;
        updateFilterCounts();
        syncFilterButtons();
        renderResults();
      }

      function onResultControlChange() {
        state.resultFilters.query = String(ui.resultSearch.value || "").trim();
        state.resultFilters.institution = String(ui.institutionFilter.value || "").trim();
        state.resultFilters.credential = String(ui.credentialFilter.value || "").trim();
        state.resultFilters.sort = String(ui.sortSelect.value || DEFAULT_RESULT_SORT).trim() || DEFAULT_RESULT_SORT;
        renderResults();
      }

      function clearResultFilters() {
        state.resultFilters.query = "";
        state.resultFilters.institution = "";
        state.resultFilters.credential = "";
        state.resultFilters.sort = DEFAULT_RESULT_SORT;
        syncResultControls();
        renderResults();
      }

      function syncResultControls() {
        ui.resultSearch.value = state.resultFilters.query || "";
        ui.institutionFilter.value = state.resultFilters.institution || "";
        ui.credentialFilter.value = state.resultFilters.credential || "";
        ui.sortSelect.value = state.resultFilters.sort || DEFAULT_RESULT_SORT;
        ui.clearResultFiltersBtn.disabled =
          !state.resultFilters.query &&
          !state.resultFilters.institution &&
          !state.resultFilters.credential &&
          (state.resultFilters.sort || DEFAULT_RESULT_SORT) === DEFAULT_RESULT_SORT;
      }

      function syncFilterButtons() {
        const all = ui.filterGroup.querySelectorAll("button[data-view]");
        all.forEach((btn) => {
          const active = btn.dataset.view === state.view;
          btn.classList.toggle("active", active);
          btn.setAttribute("aria-selected", active ? "true" : "false");
        });
      }

      function updateFilterCounts() {
        const model = state.resultModel;
        const keysByView = model && model.keysByView ? model.keysByView : {};
        const all = (keysByView.all || []).length;
        const eligible = (keysByView.eligible || []).length;
        const ineligible = (keysByView.ineligible || []).length;
        const uncheckable = (keysByView.uncheckable || []).length;
        const shortlist = countShortlistRows();
        if (ui.tabCountAll) ui.tabCountAll.textContent = String(all);
        if (ui.tabCountEligible) ui.tabCountEligible.textContent = String(eligible);
        if (ui.tabCountIneligible) ui.tabCountIneligible.textContent = String(ineligible);
        if (ui.tabCountUncheckable) ui.tabCountUncheckable.textContent = String(uncheckable);
        if (ui.tabCountShortlist) ui.tabCountShortlist.textContent = String(shortlist);
      }

      function populateResultFilterOptions() {
        const rows = state.resultModel && state.resultModel.rows ? state.resultModel.rows : [];
        const institutions = uniqueStrings(
          rows.map((r) => String(r.institution || "").trim()).filter((x) => x)
        ).sort((a, b) => a.localeCompare(b));
        const credentials = uniqueStrings(
          rows.map((r) => String(r.credential || "").trim()).filter((x) => x)
        ).sort((a, b) => a.localeCompare(b));

        renderSelectOptions(ui.institutionFilter, "All Institutions", institutions, state.resultFilters.institution);
        if (state.resultFilters.institution && institutions.indexOf(state.resultFilters.institution) < 0) {
          state.resultFilters.institution = "";
        }
        renderSelectOptions(ui.credentialFilter, "All Credentials", credentials, state.resultFilters.credential);
        if (state.resultFilters.credential && credentials.indexOf(state.resultFilters.credential) < 0) {
          state.resultFilters.credential = "";
        }
        syncResultControls();
      }

      function renderSelectOptions(select, emptyLabel, options, selectedValue) {
        const selected = String(selectedValue || "").trim();
        const html =
          `<option value="">${escapeHtml(emptyLabel)}</option>` +
          (options || [])
            .map((opt) => {
              const value = String(opt || "").trim();
              const selectedAttr = value === selected ? ' selected="selected"' : "";
              return `<option value="${escapeAttr(value)}"${selectedAttr}>${escapeHtml(value)}</option>`;
            })
            .join("");
        select.innerHTML = html;
      }

      function onResultsWrapClick(e) {
        const pinBtn = e.target && e.target.closest("button[data-pin-key]");
        if (pinBtn) {
          const key = String(pinBtn.getAttribute("data-pin-key") || "").trim();
          if (!key) return;
          toggleShortlistKey(key);
          if (state.view === "shortlist" && countShortlistRows() === 0) {
            state.view = "ineligible";
            syncFilterButtons();
            setStatus("Shortlist is empty. Showing Missing view.");
          }
          updateFilterCounts();
          renderResults();
          renderCompareStrip();
          renderCompareResults();
          renderDetailsDrawer();
          return;
        }

        const compareBtn = e.target && e.target.closest("button[data-compare-key]");
        if (compareBtn) {
          const key = String(compareBtn.getAttribute("data-compare-key") || "").trim();
          if (!key) return;
          toggleCompareKey(key);
          renderResults();
          renderCompareStrip();
          renderCompareResults();
          renderDetailsDrawer();
          return;
        }

        const detailBtn = e.target && e.target.closest("button[data-detail-key]");
        if (detailBtn) {
          const key = String(detailBtn.getAttribute("data-detail-key") || "").trim();
          selectProgramKey(key);
          renderResults();
          renderDetailsDrawer();
          return;
        }

        const rowEl = e.target && e.target.closest(".result-card[data-row-key]");
        if (!rowEl) return;
        selectProgramKey(String(rowEl.getAttribute("data-row-key") || "").trim());
        renderResults();
        renderDetailsDrawer();
      }

      function toggleShortlistKey(key) {
        const k = String(key || "").trim();
        if (!k) return;
        if (state.shortlist[k]) {
          delete state.shortlist[k];
          return;
        }
        state.shortlist[k] = true;
      }

      function countShortlistRows() {
        const model = state.resultModel;
        if (!model || !model.rowsByKey) return 0;
        return Object.keys(state.shortlist).filter((k) => !!model.rowsByKey[k]).length;
      }

      function trimShortlistToCurrentModel() {
        const model = state.resultModel;
        if (!model || !model.rowsByKey) {
          state.shortlist = {};
          return;
        }
        Object.keys(state.shortlist).forEach((k) => {
          if (!model.rowsByKey[k]) delete state.shortlist[k];
        });
      }

      function selectProgramKey(key) {
        const k = String(key || "").trim();
        if (!k) {
          state.selectedProgramKey = "";
          return;
        }
        if (!(state.resultModel && state.resultModel.rowsByKey && state.resultModel.rowsByKey[k])) return;
        state.selectedProgramKey = k;
      }

      function toggleCompareKey(key) {
        const k = String(key || "").trim();
        if (!k) return;
        const idx = state.compareKeys.indexOf(k);
        if (idx >= 0) {
          state.compareKeys.splice(idx, 1);
          return;
        }
        if (state.compareKeys.length >= 3) {
          setStatus("Compare prep supports up to 3 programs. Remove one to add another.", true);
          return;
        }
        state.compareKeys.push(k);
      }

      function trimCompareToCurrentModel() {
        const model = state.resultModel;
        if (!model || !model.rowsByKey) {
          state.compareKeys = [];
          return;
        }
        state.compareKeys = state.compareKeys.filter((k) => !!model.rowsByKey[k]);
      }

      function onCompareStripClick(e) {
        const removeBtn = e.target && e.target.closest("button[data-compare-remove]");
        if (removeBtn) {
          const key = String(removeBtn.getAttribute("data-compare-remove") || "").trim();
          if (!key) return;
          state.compareKeys = state.compareKeys.filter((k) => k !== key);
          renderResults();
          renderCompareStrip();
          renderCompareResults();
          renderDetailsDrawer();
          return;
        }

        const clearBtn = e.target && e.target.closest("button[data-compare-clear]");
        if (!clearBtn) return;
        state.compareKeys = [];
        renderResults();
        renderCompareStrip();
        renderCompareResults();
        renderDetailsDrawer();
      }

      function onCompareResultsClick(e) {
        const viewBtn = e.target && e.target.closest("button[data-compare-view]");
        if (!viewBtn) return;
        const next = String(viewBtn.getAttribute("data-compare-view") || "").trim();
        if (next !== "side" && next !== "list" && next !== "columns") return;
        if (state.compareViewMode === next) return;
        state.compareViewMode = next;
        renderCompareResults();
      }

      function renderResults() {
        if (!state.result || !state.resultModel) {
          ui.resultsWrap.innerHTML = `<div class="empty">Run a check to see program-by-program results.</div>`;
          ui.rowsStamp.textContent = "No results yet";
          syncResultControls();
          updateFilterCounts();
          renderCompareStrip();
          renderCompareResults();
          renderDetailsDrawer();
          return;
        }

        const viewRows = getRowsForView(state.view);
        const filteredRows = sortRows(filterRows(viewRows), state.resultFilters.sort || DEFAULT_RESULT_SORT);
        const viewCount = viewRows.length;
        const shownCount = filteredRows.length;
        ui.rowsStamp.textContent = shownCount === viewCount ? `${shownCount} programs` : `${shownCount} of ${viewCount} programs`;
        updateFilterCounts();

        if (!filteredRows.length) {
          const emptyMsg =
            viewCount === 0
              ? "No programs in this category."
              : "No programs match the current filters. Clear filters to widen results.";
          ui.resultsWrap.innerHTML = `<div class="empty">${escapeHtml(emptyMsg)}</div>`;
          syncResultControls();
          renderCompareStrip();
          renderCompareResults();
          renderDetailsDrawer();
          return;
        }

        const bodyHtml = filteredRows
          .map((row) => {
            const isPinned = !!state.shortlist[row.key];
            const isSelected = row.key === state.selectedProgramKey;
            const isCompared = state.compareKeys.indexOf(row.key) >= 0;
            const status = rowStatusForDisplay_(row);
            const reason = rowReasonForDisplay_(row, status);
            const pinClass = isPinned ? "pin-btn active" : "pin-btn";
            const compareClass = isCompared ? "action-btn active" : "action-btn";
            const viewClass = isSelected ? "action-btn active" : "action-btn";
            const cardClasses = []
              .concat(isPinned ? ["row-pinned"] : [])
              .concat(isSelected ? ["row-selected"] : [])
              .join(" ");
            const cardClass = cardClasses ? ` ${cardClasses}` : "";
            const pinLabel = isPinned ? "Pinned" : "Pin";
            const compareLabel = isCompared ? "Compared" : "Compare";
            const viewLabel = isSelected ? "Viewing" : "View";
            return `
              <article class="result-card${cardClass}" data-row-key="${escapeAttr(row.key)}">
                <div class="card-top">
                  <div class="card-title-wrap">
                    <h3 class="card-title">${escapeHtml(row.program || "Program")}</h3>
                    <p class="card-subtitle">${escapeHtml(row.institution || "Institution")} | ${escapeHtml(
              row.credential || "Credential"
            )}</p>
                  </div>
                  <div class="card-metrics">
                    <span class="metric-pill">Min Avg: ${escapeHtml(Number.isFinite(row.minAvg) ? formatCell(row.minAvg) : "n/a")}</span>
                    <span class="status-pill ${escapeAttr(status.css)}">${escapeHtml(status.label)}</span>
                  </div>
                </div>
                <div class="card-reason">${escapeHtml(reason)}</div>
                <div class="card-actions">
                  <button class="${pinClass}" type="button" data-pin-key="${escapeAttr(row.key)}">${pinLabel}</button>
                  <button class="${compareClass}" type="button" data-compare-key="${escapeAttr(row.key)}">${compareLabel}</button>
                  <button class="${viewClass}" type="button" data-detail-key="${escapeAttr(row.key)}">${viewLabel}</button>
                </div>
              </article>
            `;
          })
          .join("");
        ui.resultsWrap.innerHTML = `<div class="result-list">${bodyHtml}</div>`;
        syncResultControls();
        renderCompareStrip();
        renderCompareResults();
        renderDetailsDrawer();
      }

      function rowStatusForDisplay_(row) {
        if (row && row.viewFlags && row.viewFlags.ineligible) return { label: "Missing", css: "missing" };
        if (row && row.viewFlags && row.viewFlags.uncheckable) return { label: "Uncheckable", css: "uncheckable" };
        return { label: "Eligible", css: "eligible" };
      }

      function rowReasonForDisplay_(row, status) {
        const rowStatus = status || rowStatusForDisplay_(row);
        if (rowStatus.css === "missing") {
          const firstMissing = splitPipedText(row && row.missing).shift();
          return firstMissing ? `Missing: ${firstMissing}` : "Missing marks-based requirement(s).";
        }
        if (rowStatus.css === "uncheckable") {
          const detail = getProgramDetailsForRow(row);
          const advisories = Array.isArray(detail.advisories) ? detail.advisories.filter(Boolean) : [];
          const notes = Array.isArray(detail.notes) ? detail.notes.filter(Boolean) : [];
          return advisories[0] || notes[0] || "Program has additional requirements not fully checkable here.";
        }
        const detail = getProgramDetailsForRow(row);
        const advisories = Array.isArray(detail.advisories) ? detail.advisories.filter(Boolean) : [];
        return advisories[0] || "Meets marks-based checks.";
      }

      function renderCompareStrip() {
        const model = state.resultModel;
        if (!model || !model.rowsByKey) {
          ui.compareStrip.innerHTML = `<div class="ghost">Compare prep: add up to 3 programs while triaging.</div>`;
          return;
        }

        const selected = state.compareKeys.map((k) => model.rowsByKey[k]).filter(Boolean);
        if (!selected.length) {
          ui.compareStrip.innerHTML = `<div class="ghost">Compare prep: add up to 3 programs while triaging.</div>`;
          return;
        }

        const chips = selected
          .map((row) => {
            const label = `${row.program} (${row.institution})`;
            return `<button class="compare-chip" type="button" data-compare-remove="${escapeAttr(
              row.key
            )}" title="Remove">${escapeHtml(label)}</button>`;
          })
          .join("");
        ui.compareStrip.innerHTML = `
          <div class="compare-header">
            <strong>Compare Prep (${selected.length}/3)</strong>
            <button class="action-btn" type="button" data-compare-clear="1">Clear</button>
          </div>
          <div class="compare-chips">${chips}</div>
          <div class="ghost">Selection is ready for side-by-side compare mode.</div>
        `;
      }

      function renderDetailsDrawer() {
        const model = state.resultModel;
        if (!model || !model.rowsByKey) {
          ui.detailsDrawer.innerHTML = `<div class="ghost">Select a program card to inspect requirements and next steps.</div>`;
          return;
        }

        let row = state.selectedProgramKey && model.rowsByKey[state.selectedProgramKey]
          ? model.rowsByKey[state.selectedProgramKey]
          : null;
        if (!row) {
          const compareRows = getCompareRows_();
          if (compareRows.length === 1) row = compareRows[0];
        }

        if (!row) {
          ui.detailsDrawer.innerHTML = `<div class="ghost">Select a program card to inspect requirements and next steps.</div>`;
          return;
        }

        renderSingleProgramDetails_(row);
      }

      function renderCompareResults() {
        if (!ui.compareResults) return;
        const rows = getCompareRows_();
        if (rows.length < 2) {
          ui.compareResults.classList.add("is-empty");
          ui.compareResults.innerHTML = `<div class="ghost">Select at least 2 programs to compare.</div>`;
          return;
        }
        ui.compareResults.classList.remove("is-empty");
        renderCompareDrawer_(rows);
      }

      function renderCompareDrawer_(rows) {
        const items = (rows || []).map((row) => ({
          row,
          detail: getProgramDetailsForRow(row),
        }));
        const mode =
          state.compareViewMode === "list" || state.compareViewMode === "columns" ? state.compareViewMode : "side";
        const sideClass = mode === "side" ? "compare-view-btn active" : "compare-view-btn";
        const listClass = mode === "list" ? "compare-view-btn active" : "compare-view-btn";
        const columnsClass = mode === "columns" ? "compare-view-btn active" : "compare-view-btn";
        const modeCopy =
          mode === "columns"
            ? "Field-by-field column comparison"
            : mode === "side"
            ? "Side-by-side summary"
            : "Stacked list summary";
        const cardHtml = items
          .map((item) => {
            const detail = item.detail || {};
            const avg = detail.average || {};
            const missing = (Array.isArray(detail.missingReasons) ? detail.missingReasons : []).filter(Boolean);
            const advisories = (Array.isArray(detail.advisories) ? detail.advisories : []).filter(Boolean);
            const notes = (Array.isArray(detail.notes) ? detail.notes : []).filter(Boolean);
            const requirements = (Array.isArray(detail.requirements) ? detail.requirements : [])
              .map((req) => {
                const status = normalizeReqStatus(req && req.status);
                return `${statusLabel(status)}: ${String((req && req.label) || "").trim() || "Requirement"}`;
              })
              .slice(0, 5);
            const coursesUsed = `${formatMaybeValue_(avg.usedCourses, "0")}/${formatMaybeValue_(avg.totalCourses)}`;
            const meetsAvg =
              avg.meetsMinimum === null || avg.meetsMinimum === undefined ? "N/A" : avg.meetsMinimum ? "Yes" : "No";
            const status = rowStatusForDisplay_(item.row);
            const requirementSummary = requirements.length
              ? `<ul class="compare-item-req">${requirements.map((r) => `<li>${escapeHtml(r)}</li>`).join("")}</ul>`
              : `<p class="ghost">No requirement detail available.</p>`;

            return `
              <article class="compare-item">
                <div class="compare-item-head">
                  <div class="compare-item-title">
                    <strong>${escapeHtml(detail.program || item.row.program || "Program")}</strong>
                    <span>${escapeHtml(detail.institution || item.row.institution || "Institution")} | ${escapeHtml(
              detail.credential || item.row.credential || "Credential"
            )}</span>
                  </div>
                  <span class="status-pill ${escapeAttr(status.css)}">${escapeHtml(status.label)}</span>
                </div>

                <div class="compare-item-grid">
                  <div class="compare-item-stat">
                    <div class="label">Min Avg</div>
                    <div class="value">${escapeHtml(formatMaybeValue_(avg.min))}</div>
                  </div>
                  <div class="compare-item-stat">
                    <div class="label">Student Avg</div>
                    <div class="value">${escapeHtml(formatMaybeValue_(avg.student))}</div>
                  </div>
                  <div class="compare-item-stat">
                    <div class="label">Courses Used</div>
                    <div class="value">${escapeHtml(coursesUsed)}</div>
                  </div>
                  <div class="compare-item-stat">
                    <div class="label">Meets Avg Minimum</div>
                    <div class="value">${escapeHtml(meetsAvg)}</div>
                  </div>
                </div>

                <p class="compare-item-line"><strong>Missing:</strong> ${escapeHtml(missing[0] || "None")}</p>
                <p class="compare-item-line"><strong>Advisory:</strong> ${escapeHtml(advisories[0] || "None")}</p>
                <p class="compare-item-line"><strong>Notes:</strong> ${escapeHtml(notes[0] || "None")}</p>

                <details class="collapsible">
                  <summary>Requirement Snapshot</summary>
                  ${requirementSummary}
                </details>
              </article>
            `;
          })
          .join("");
        const compareBodyHtml =
          mode === "columns"
            ? renderCompareColumnsTable_(items)
            : `<div class="compare-stack mode-${escapeAttr(mode)}">${cardHtml}</div>`;

        ui.compareResults.innerHTML = `
          <div class="compare-results-head">
            <h3 class="compare-results-title">Program Compare</h3>
            <div class="compare-results-controls">
              <p class="compare-results-sub">${escapeHtml(modeCopy)} for ${items.length} selected program(s).</p>
              <div class="compare-view-toggle" role="group" aria-label="Compare layout mode">
                <button class="${sideClass}" type="button" data-compare-view="side">Side by Side</button>
                <button class="${listClass}" type="button" data-compare-view="list">List</button>
                <button class="${columnsClass}" type="button" data-compare-view="columns">Columns</button>
              </div>
            </div>
          </div>
          ${compareBodyHtml}
        `;
      }

      function renderCompareColumnsTable_(items) {
        const headers = (items || [])
          .map((item) => {
            const detail = item.detail || {};
            const status = rowStatusForDisplay_(item.row);
            return `
              <th class="program-col">
                <div class="compare-program">
                  <strong>${escapeHtml(detail.program || item.row.program || "Program")}</strong>
                  <span>${escapeHtml(detail.institution || item.row.institution || "Institution")} | ${escapeHtml(
              detail.credential || item.row.credential || "Credential"
            )}</span>
                  <span class="status-pill ${escapeAttr(status.css)}">${escapeHtml(status.label)}</span>
                </div>
              </th>
            `;
          })
          .join("");

        const rowDefs = [
          {
            field: "Min Avg",
            pick: (item) => {
              const avg = (item.detail && item.detail.average) || {};
              return formatMaybeValue_(avg.min);
            },
          },
          {
            field: "Student Avg",
            pick: (item) => {
              const avg = (item.detail && item.detail.average) || {};
              return formatMaybeValue_(avg.student);
            },
          },
          {
            field: "Courses Used",
            pick: (item) => {
              const avg = (item.detail && item.detail.average) || {};
              return `${formatMaybeValue_(avg.usedCourses, "0")}/${formatMaybeValue_(avg.totalCourses)}`;
            },
          },
          {
            field: "Meets Avg Minimum",
            pick: (item) => {
              const avg = (item.detail && item.detail.average) || {};
              return avg.meetsMinimum === null || avg.meetsMinimum === undefined ? "N/A" : avg.meetsMinimum ? "Yes" : "No";
            },
          },
          {
            field: "Missing",
            pick: (item) => {
              const missing = (Array.isArray(item.detail && item.detail.missingReasons)
                ? item.detail.missingReasons
                : []
              ).filter(Boolean);
              return missing[0] || "None";
            },
          },
          {
            field: "Advisory",
            pick: (item) => {
              const advisories = (Array.isArray(item.detail && item.detail.advisories) ? item.detail.advisories : []).filter(
                Boolean
              );
              return advisories[0] || "None";
            },
          },
          {
            field: "Notes",
            pick: (item) => {
              const notes = (Array.isArray(item.detail && item.detail.notes) ? item.detail.notes : []).filter(Boolean);
              return notes[0] || "None";
            },
          },
          {
            field: "Requirement Snapshot",
            pick: (item) => {
              const requirements = (Array.isArray(item.detail && item.detail.requirements) ? item.detail.requirements : [])
                .map((req) => {
                  const status = normalizeReqStatus(req && req.status);
                  return `${statusLabel(status)}: ${String((req && req.label) || "").trim() || "Requirement"}`;
                })
                .slice(0, 4);
              return requirements.length ? requirements.join(" | ") : "None";
            },
          },
        ];

        const body = rowDefs
          .map((rowDef) => {
            const cells = (items || [])
              .map((item) => `<td>${escapeHtml(String(rowDef.pick(item) || ""))}</td>`)
              .join("");
            return `<tr><th class="field-col">${escapeHtml(rowDef.field)}</th>${cells}</tr>`;
          })
          .join("");

        return `
          <div class="compare-columns-wrap">
            <table class="compare-columns-table" role="table" aria-label="Program compare columns view">
              <thead>
                <tr>
                  <th class="field-col">Field</th>
                  ${headers}
                </tr>
              </thead>
              <tbody>
                ${body}
              </tbody>
            </table>
          </div>
        `;
      }

      function formatMaybeValue_(value, fallback) {
        const hasValue = !(value === null || value === undefined || value === "");
        if (!hasValue) return fallback || "N/A";
        const text = formatCell(value);
        return text === "" ? (fallback || "N/A") : text;
      }

      function getCompareRows_() {
        const model = state.resultModel;
        if (!model || !model.rowsByKey) return [];
        return state.compareKeys.map((k) => model.rowsByKey[k]).filter(Boolean);
      }

      function renderSingleProgramDetails_(row) {
        const detail = getProgramDetailsForRow(row);
        const missing = (Array.isArray(detail.missingReasons) ? detail.missingReasons : []).filter(Boolean);
        const notes = (Array.isArray(detail.notes) ? detail.notes : []).filter(Boolean);
        const advisories = (Array.isArray(detail.advisories) ? detail.advisories : []).filter(Boolean);
        const requirementLines = (Array.isArray(detail.requirements) ? detail.requirements : [])
          .map((req) => {
            const status = normalizeReqStatus(req.status);
            const issues = (Array.isArray(req.issues) ? req.issues : []).filter(Boolean);
            return `<li><div class="requirement-line"><span class="req-label">${escapeHtml(
              req.label || ""
            )}</span><span class="req-status ${escapeAttr(status)}">${escapeHtml(
              statusLabel(status)
            )}</span><span class="req-meta">${escapeHtml(req.requirement || "")}${
              req.minMark !== "" ? ` (min ${escapeHtml(formatCell(req.minMark))})` : ""
            }${req.matched ? `; matched: ${escapeHtml(req.matched)}` : ""}</span>${
              issues.length ? `<span class="req-meta">${escapeHtml(issues.join(" | "))}</span>` : ""
            }</div></li>`;
          })
          .join("");

        const meaningItems = buildMeaningSummary_(row, detail);
        const meaningHtml = meaningItems.length
          ? `<ul class="meaning-list">${meaningItems
              .map((item) => `<li class="meaning-item ${escapeAttr(item.tone)}">${escapeHtml(item.text)}</li>`)
              .join("")}</ul>`
          : `<p class="ghost">No summary available.</p>`;

        const missingHtml = missing.length
          ? `<ul class="detail-list">${missing.map((x) => `<li>${escapeHtml(x)}</li>`).join("")}</ul>`
          : `<p class="ghost">No missing items from marks-based checks.</p>`;
        const notesHtml = notes.length
          ? `<ul class="detail-list">${notes.map((x) => `<li>${escapeHtml(x)}</li>`).join("")}</ul>`
          : `<p class="ghost">No extra notes.</p>`;
        const advisoryHtml = advisories.length
          ? `<ul class="detail-list">${advisories.map((x) => `<li>${escapeHtml(x)}</li>`).join("")}</ul>`
          : `<p class="ghost">No additional advisory flags.</p>`;

        const avg = detail.average || {};
        const electives = detail.electives || {};
        const avgMinText = avg.min === "" || avg.min === null || avg.min === undefined ? "N/A" : escapeHtml(formatCell(avg.min));
        const avgStudentText =
          avg.student === "" || avg.student === null || avg.student === undefined ? "N/A" : escapeHtml(formatCell(avg.student));
        const avgTotalText =
          avg.totalCourses === "" || avg.totalCourses === null || avg.totalCourses === undefined
            ? "N/A"
            : escapeHtml(formatCell(avg.totalCourses));
        const avgUsedText = escapeHtml(formatCell(avg.usedCourses || 0));
        const allowedGroups = Array.isArray(electives.allowedGroups) ? electives.allowedGroups : [];
        const selectedElectives = Array.isArray(electives.selected) ? electives.selected : [];

        const requirementsSectionHtml = requirementLines
          ? `<details class="collapsible"><summary>Requirements</summary><ul class="detail-list">${requirementLines}</ul></details>`
          : `<details class="collapsible"><summary>Requirements</summary><p class="ghost">Requirement details are unavailable for this row.</p></details>`;

        const selectedElectivesText = selectedElectives.length
          ? selectedElectives.map((e) => `${e.group}${e.name ? ` (${e.name})` : ""}=${formatCell(e.mark)}`).join(", ")
          : "None";
        const electiveSectionHtml = `<details class="collapsible"><summary>Elective Rules</summary>
            <ul class="detail-list">
              <li>Allowed groups: ${escapeHtml(allowedGroups.join("/") || "A/B/C/D")}</li>
              <li>Rule summary: ${escapeHtml(electives.ruleSummary || "None")}</li>
              <li>Selected electives: ${escapeHtml(selectedElectivesText)}</li>
            </ul>
          </details>`;

        ui.detailsDrawer.innerHTML = `
          <div class="detail-head">
            <h3 class="detail-title">${escapeHtml(detail.program || row.program || "")}</h3>
            <p class="detail-sub">${escapeHtml(detail.institution || row.institution || "")} | ${escapeHtml(
              detail.credential || row.credential || ""
            )}</p>
          </div>
          <div class="meaning-panel">
            <h4>What this means</h4>
            ${meaningHtml}
          </div>
          <div class="detail-grid">
            <div class="detail-block">
              <h4>Missing / Next Steps</h4>
              ${missingHtml}
            </div>
            <div class="detail-block">
              <h4>Average Snapshot</h4>
              <ul class="detail-list">
                <li>Min Avg: ${avgMinText}</li>
                <li>Student Avg: ${avgStudentText}</li>
                <li>Courses used: ${avgUsedText}/${avgTotalText}</li>
                <li>Complete: ${avg.complete ? "Yes" : "No"}</li>
                <li>Meets minimum: ${avg.meetsMinimum === null ? "N/A" : avg.meetsMinimum ? "Yes" : "No"}</li>
                <li>Electives needed for avg: ${escapeHtml(formatCell(avg.neededElectivesForAverage || 0))}</li>
              </ul>
            </div>
            <div class="detail-block">
              <h4>Advisories</h4>
              ${advisoryHtml}
            </div>
            <div class="detail-block">
              <h4>Notes</h4>
              ${notesHtml}
            </div>
          </div>
          ${requirementsSectionHtml}
          ${electiveSectionHtml}
        `;
      }

      function buildMeaningSummary_(row, detail) {
        const out = [];
        const requirements = Array.isArray(detail.requirements) ? detail.requirements : [];
        if (requirements.length) {
          const failed = requirements.find((req) => {
            const status = normalizeReqStatus(req && req.status);
            return status === "missing" || status === "low_mark";
          });
          if (failed) out.push({ tone: "bad", text: `Requirement gap: ${failed.label || "subject requirement"}` });
          else out.push({ tone: "ok", text: "Meets listed subject requirements." });
        }

        const avg = detail.average || {};
        if (avg.meetsMinimum === true) {
          out.push({ tone: "ok", text: "Meets minimum average requirement." });
        } else if (avg.meetsMinimum === false) {
          const min = toFiniteNumber(avg.min);
          const student = toFiniteNumber(avg.student);
          if (Number.isFinite(min) && Number.isFinite(student)) {
            const gap = Math.max(0, min - student);
            out.push({ tone: "bad", text: `Average short by ${formatMarkDisplay(gap)}.` });
          } else {
            out.push({ tone: "bad", text: "Average requirement not met." });
          }
        } else if (avg.complete === false) {
          out.push({ tone: "warn", text: "Average cannot be fully checked yet." });
        }

        const missing = (Array.isArray(detail.missingReasons) ? detail.missingReasons : []).filter(Boolean);
        if (missing.length) out.push({ tone: "bad", text: `Missing: ${missing[0]}` });

        const status = rowStatusForDisplay_(row);
        if (status.css === "uncheckable") {
          out.push({ tone: "warn", text: "Program has additional requirements beyond marks checks." });
        }

        const advisories = (Array.isArray(detail.advisories) ? detail.advisories : []).filter(Boolean);
        if (advisories.length) out.push({ tone: "warn", text: advisories[0] });

        if (!out.length) out.push({ tone: "ok", text: "Meets marks-based checks." });
        return out.slice(0, 5);
      }

      function getProgramDetailsForRow(row) {
        const model = state.resultModel || {};
        const map = model.detailsByKey && typeof model.detailsByKey === "object" ? model.detailsByKey : {};
        const fromBackend = row && row.key && map[row.key] ? map[row.key] : null;
        if (fromBackend && typeof fromBackend === "object") return fromBackend;

        return {
          institution: row.institution || "",
          program: row.program || "",
          credential: row.credential || "",
          requirements: [],
          average: {
            min: row.minAvg,
            student: row.studentAvg,
            totalCourses: toFiniteNumber(row.cells[5]),
            usedCourses: NaN,
            complete: false,
            meetsMinimum: null,
            neededElectivesForAverage: parseMissingElectiveCount(row.missing || ""),
          },
          electives: { allowedGroups: [], ruleSummary: "", selected: [] },
          missingReasons: splitPipedText(row.missing),
          notes: splitPipedText(row.notes),
          advisories: [],
        };
      }

      function splitPipedText(text) {
        return String(text || "")
          .split("|")
          .map((x) => x.trim())
          .filter(Boolean);
      }

      function normalizeReqStatus(status) {
        const s = String(status || "").trim().toLowerCase();
        if (s === "met" || s === "low_mark" || s === "missing" || s === "unknown" || s === "assessment") return s;
        return "unknown";
      }

      function statusLabel(status) {
        if (status === "met") return "Met";
        if (status === "low_mark") return "Low Mark";
        if (status === "missing") return "Missing";
        if (status === "assessment") return "Assessment";
        return "Unknown";
      }

      function getRowsForView(view) {
        const model = state.resultModel;
        if (!model || !model.keysByView || !model.rowsByKey) return [];
        if (view === "shortlist") {
          return (model.keysByView.all || [])
            .filter((k) => !!state.shortlist[k])
            .map((k) => model.rowsByKey[k])
            .filter(Boolean);
        }
        const safeView = RESULT_VIEWS.indexOf(view) >= 0 ? view : "all";
        const keys = model.keysByView[safeView] || [];
        return keys.map((k) => model.rowsByKey[k]).filter(Boolean);
      }

      function filterRows(rows) {
        const query = String(state.resultFilters.query || "").trim().toLowerCase();
        const institution = String(state.resultFilters.institution || "").trim();
        const credential = String(state.resultFilters.credential || "").trim();
        return (rows || []).filter((row) => {
          if (institution && row.institution !== institution) return false;
          if (credential && row.credential !== credential) return false;
          if (!query) return true;
          const terms = query.split(/\s+/).filter(Boolean);
          if (!terms.length) return true;
          const haystack = String(row.searchText || "").toLowerCase();
          return terms.every((term) => haystack.indexOf(term) >= 0);
        });
      }

      function sortRows(rows, sortKey) {
        const safeSort = String(sortKey || DEFAULT_RESULT_SORT).trim() || DEFAULT_RESULT_SORT;
        const list = (rows || []).slice();
        list.sort((a, b) => compareRowsBySort(a, b, safeSort));
        return list;
      }

      function compareRowsBySort(a, b, sortKey) {
        if (sortKey === "min_avg_asc") {
          const cmp = compareNumbersNullable(a.minAvg, b.minAvg, true);
          return cmp !== 0 ? cmp : compareInstitutionProgram(a, b);
        }
        if (sortKey === "min_avg_desc") {
          const cmp = compareNumbersNullable(a.minAvg, b.minAvg, false);
          return cmp !== 0 ? cmp : compareInstitutionProgram(a, b);
        }
        if (sortKey === "institution_program") {
          return compareInstitutionProgram(a, b);
        }
        if (sortKey === "program_az") {
          const p = String(a.program || "").localeCompare(String(b.program || ""));
          if (p !== 0) return p;
          return compareInstitutionProgram(a, b);
        }
        return compareClosestRows(a, b);
      }

      function compareClosestRows(a, b) {
        const aUncheckablePenalty = a.viewFlags && a.viewFlags.uncheckable ? 1 : 0;
        const bUncheckablePenalty = b.viewFlags && b.viewFlags.uncheckable ? 1 : 0;

        if (a.issueCount !== b.issueCount) return a.issueCount - b.issueCount;
        if (aUncheckablePenalty !== bUncheckablePenalty) return aUncheckablePenalty - bUncheckablePenalty;
        if (a.avgGap !== b.avgGap) return a.avgGap - b.avgGap;
        if (a.electiveGap !== b.electiveGap) return a.electiveGap - b.electiveGap;
        return compareInstitutionProgram(a, b);
      }

      function compareInstitutionProgram(a, b) {
        const i = String(a.institution || "").localeCompare(String(b.institution || ""));
        if (i !== 0) return i;
        const p = String(a.program || "").localeCompare(String(b.program || ""));
        if (p !== 0) return p;
        return String(a.credential || "").localeCompare(String(b.credential || ""));
      }

      function compareNumbersNullable(a, b, ascending) {
        const aNum = Number.isFinite(a);
        const bNum = Number.isFinite(b);
        if (aNum && bNum) return ascending ? a - b : b - a;
        if (aNum) return -1;
        if (bNum) return 1;
        return 0;
      }

      function exportCsv() {
        if (!state.result || !state.resultModel) return;
        const label = viewLabel(state.view);
        const generated = formatUtcStamp(state.result.generatedAt || getResultMeta().generatedAt || "");
        const datasetStamp = getResultDatasetStamp() || "n/a";
        const visible = sortRows(filterRows(getRowsForView(state.view)), state.resultFilters.sort || DEFAULT_RESULT_SORT);
        const rows = [
          ["Report View", label],
          ["Generated At (UTC)", generated || "n/a"],
          ["Dataset Stamp", datasetStamp],
          [],
          state.resultModel.headers || [],
        ].concat(visible.map((r) => r.cells));
        const csv = rows.map((r) => r.map(csvCell).join(",")).join("\r\n");
        downloadBlob(csv, "text/csv;charset=utf-8", fileStamp(`admissions_${viewSlug(state.view)}`, "csv"));
      }

      function exportPdf() {
        if (!state.result || !state.resultModel) return;
        const headers = state.resultModel.headers || [];
        const rows = sortRows(filterRows(getRowsForView(state.view)), state.resultFilters.sort || DEFAULT_RESULT_SORT).map(
          (r) => r.cells
        );
        const label = viewLabel(state.view);
        const generated = formatUtcStamp(state.result.generatedAt || getResultMeta().generatedAt || "");
        const datasetStamp = getResultDatasetStamp() || "n/a";
        const html = `
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Admissions ${escapeHtml(label)}</title>
    <style>
      body { font-family: "Open Sans", sans-serif; margin: 24px; color: #505155; }
      h1 { margin: 0 0 4px; font-family: "Rubik", sans-serif; font-size: 20px; color: #127956; }
      p { margin: 0 0 14px; color: #1e634c; }
      table { width: 100%; border-collapse: collapse; font-size: 11px; }
      th, td { border: 1px solid #d6e5df; padding: 5px; text-align: left; vertical-align: top; }
      th { background: #f1f7f4; color: #1e634c; }
      @media print { body { margin: 8mm; } }
    </style>
  </head>
  <body>
    <h1>Next Step Admissions Checker</h1>
    <p>${escapeHtml(label)} | Generated: ${escapeHtml(generated || "n/a")} | Dataset: ${escapeHtml(datasetStamp)}</p>
    <table>
      <thead><tr>${headers.map((h) => `<th>${escapeHtml(String(h))}</th>`).join("")}</tr></thead>
      <tbody>${rows
        .map((r) => `<tr>${r.map((c) => `<td>${escapeHtml(formatCell(c))}</td>`).join("")}</tr>`)
        .join("")}</tbody>
    </table>
  </body>
</html>`;
        const frameId = "pdfExportFrame";
        let frame = document.getElementById(frameId);
        if (!frame) {
          frame = document.createElement("iframe");
          frame.id = frameId;
          frame.style.position = "fixed";
          frame.style.right = "0";
          frame.style.bottom = "0";
          frame.style.width = "0";
          frame.style.height = "0";
          frame.style.border = "0";
          frame.setAttribute("aria-hidden", "true");
          document.body.appendChild(frame);
        }
        frame.onload = () => {
          setTimeout(() => {
            try {
              const win = frame.contentWindow;
              if (!win) throw new Error("Print frame unavailable");
              win.focus();
              win.print();
            } catch (err) {
              setStatus("PDF export failed in this browser. Use CSV export instead.", true);
            }
          }, 160);
        };
        if ("srcdoc" in frame) {
          frame.srcdoc = html;
          return;
        }
        const doc = frame.contentWindow && frame.contentWindow.document;
        if (!doc) {
          setStatus("PDF export failed in this browser. Use CSV export instead.", true);
          return;
        }
        doc.open();
        doc.write(html);
        doc.close();
      }

      function buildResultModel(result) {
        if (!result || typeof result !== "object") return null;
        const headers = Array.isArray(result.headers) ? result.headers.map((x) => String(x || "")) : [];
        const headerIndex = buildHeaderIndex(headers);
        const results = result.results && typeof result.results === "object" ? result.results : {};
        const rawDetailsByKey =
          result.detailsByKey && typeof result.detailsByKey === "object" ? result.detailsByKey : {};

        let allRowsRaw = Array.isArray(results.all) ? results.all : [];
        if (!allRowsRaw.length) {
          allRowsRaw = []
            .concat(Array.isArray(results.eligible) ? results.eligible : [])
            .concat(Array.isArray(results.ineligible) ? results.ineligible : [])
            .concat(Array.isArray(results.uncheckable) ? results.uncheckable : []);
        }

        const providedViewKeys =
          result.rowKeysByView && typeof result.rowKeysByView === "object" ? result.rowKeysByView : {};
        const providedAllKeys = Array.isArray(providedViewKeys.all) ? providedViewKeys.all : [];
        const usedKeys = {};
        const rows = allRowsRaw.map((cells, i) => {
          const rowCells = Array.isArray(cells) ? cells.slice() : [];
          const providedKey = sanitizeProgramKey(providedAllKeys[i]);
          const fallbackKey = makeProgramKey(rowCells, i);
          const key = claimUniqueKey(providedKey || fallbackKey, usedKeys);
          return buildResultRow({
            key,
            cells: rowCells,
            headerIndex,
          });
        });

        const rowsByKey = {};
        rows.forEach((row) => {
          rowsByKey[row.key] = row;
        });

        const detailsByKey = {};
        Object.keys(rawDetailsByKey).forEach((k) => {
          const key = sanitizeProgramKey(k);
          if (!key || !rowsByKey[key]) return;
          detailsByKey[key] = rawDetailsByKey[k];
        });

        const keysByView = {
          all: rows.map((r) => r.key),
          eligible: [],
          ineligible: [],
          uncheckable: [],
        };

        ["eligible", "ineligible", "uncheckable"].forEach((view) => {
          const providedKeys = Array.isArray(providedViewKeys[view]) ? providedViewKeys[view] : [];
          const validProvided = uniqueStrings(
            providedKeys.map((k) => sanitizeProgramKey(k)).filter((k) => k && rowsByKey[k])
          );
          if (validProvided.length) {
            keysByView[view] = validProvided;
            return;
          }

          const viewRowsRaw = Array.isArray(results[view]) ? results[view] : [];
          keysByView[view] = deriveViewKeysFromRows(rows, viewRowsRaw);
        });

        Object.keys(keysByView).forEach((view) => {
          (keysByView[view] || []).forEach((key) => {
            if (!rowsByKey[key]) return;
            rowsByKey[key].viewFlags[view] = true;
          });
        });

        return {
          headers,
          headerIndex,
          rows,
          rowsByKey,
          keysByView,
          detailsByKey,
          meta: result.meta && typeof result.meta === "object" ? result.meta : {},
        };
      }

      function buildResultRow(opts) {
        const key = String((opts && opts.key) || "").trim();
        const cells = (opts && opts.cells) || [];
        const headerIndex = (opts && opts.headerIndex) || {};
        const institution = String(getHeaderValue(cells, headerIndex, "Institution") || "").trim();
        const program = String(getHeaderValue(cells, headerIndex, "Program") || "").trim();
        const credential = String(getHeaderValue(cells, headerIndex, "Credential") || "").trim();
        const minAvg = toFiniteNumber(getHeaderValue(cells, headerIndex, "Min Avg"));
        const studentAvg = toFiniteNumber(getHeaderValue(cells, headerIndex, "Student Avg"));
        const missing = String(getHeaderValue(cells, headerIndex, "Missing") || "").trim();
        const notes = String(getHeaderValue(cells, headerIndex, "Notes") || "").trim();
        const issueCount = countMissingIssues(missing);
        const avgGap = parseAverageGap(missing, minAvg, studentAvg);
        const electiveGap = parseMissingElectiveCount(missing);
        return {
          key,
          cells: cells.slice(),
          institution,
          program,
          credential,
          minAvg,
          studentAvg,
          missing,
          notes,
          issueCount,
          avgGap,
          electiveGap,
          searchText: `${institution} ${program} ${credential} ${missing} ${notes}`.toLowerCase(),
          viewFlags: {},
        };
      }

      function deriveViewKeysFromRows(allRows, viewRowsRaw) {
        const queues = {};
        (allRows || []).forEach((row) => {
          const signature = rowSignature(row.cells);
          if (!queues[signature]) queues[signature] = [];
          queues[signature].push(row.key);
        });

        const out = [];
        (viewRowsRaw || []).forEach((cells) => {
          const signature = rowSignature(Array.isArray(cells) ? cells : []);
          const queue = queues[signature];
          if (!queue || !queue.length) return;
          out.push(queue.shift());
        });
        return out;
      }

      function rowSignature(cells) {
        return (cells || []).map((x) => String(x === null || x === undefined ? "" : x)).join("\u001f");
      }

      function buildHeaderIndex(headers) {
        const idx = {};
        (headers || []).forEach((h, i) => {
          const key = String(h || "").trim().toLowerCase();
          if (key && idx[key] === undefined) idx[key] = i;
        });
        return idx;
      }

      function getHeaderValue(cells, headerIndex, name) {
        const key = String(name || "").trim().toLowerCase();
        const idx = headerIndex[key];
        if (idx === undefined) return "";
        return cells[idx];
      }

      function toFiniteNumber(value) {
        if (value === null || value === undefined) return NaN;
        const num = Number(String(value).trim());
        return Number.isFinite(num) ? num : NaN;
      }

      function countMissingIssues(missingText) {
        const text = String(missingText || "").trim();
        if (!text) return 0;
        const parts = text.split("|").map((x) => x.trim()).filter(Boolean);
        return parts.length || 1;
      }

      function parseAverageGap(missingText, minAvg, studentAvg) {
        const text = String(missingText || "");
        const match = text.match(/(\d+(?:\.\d+)?)\s*<\s*(\d+(?:\.\d+)?)/);
        if (match) {
          const left = Number(match[1]);
          const right = Number(match[2]);
          if (Number.isFinite(left) && Number.isFinite(right)) return Math.max(0, right - left);
        }
        if (Number.isFinite(minAvg) && Number.isFinite(studentAvg)) return Math.max(0, minAvg - studentAvg);
        return 0;
      }

      function parseMissingElectiveCount(missingText) {
        const text = String(missingText || "");
        const match = text.match(/Need\s+(\d+)\s+more\s+elective/i);
        if (!match) return 0;
        const count = Number(match[1]);
        return Number.isFinite(count) ? Math.max(0, count) : 0;
      }

      function makeProgramKey(cells, index) {
        const inst = slugPart(cells[0]);
        const program = slugPart(cells[1]);
        const credential = slugPart(cells[2]);
        const parts = [inst, program, credential].filter(Boolean);
        const stem = parts.length ? parts.join("_") : `row_${index + 1}`;
        const hash = simpleHash(rowSignature(Array.isArray(cells) ? cells : []));
        return `${stem}_${hash.toString(36)}`;
      }

      function sanitizeProgramKey(key) {
        const safe = String(key || "").trim().replace(/[^a-zA-Z0-9._-]/g, "_");
        return safe || "";
      }

      function claimUniqueKey(baseKey, used) {
        const base = sanitizeProgramKey(baseKey) || "row_key";
        if (!used[base]) {
          used[base] = 1;
          return base;
        }
        const n = used[base] + 1;
        used[base] = n;
        return `${base}_${n}`;
      }

      function slugPart(value) {
        return String(value || "")
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "_")
          .replace(/^_+|_+$/g, "")
          .slice(0, 60);
      }

      function simpleHash(text) {
        const input = String(text || "");
        let hash = 2166136261;
        for (let i = 0; i < input.length; i++) {
          hash ^= input.charCodeAt(i);
          hash += (hash << 1) + (hash << 4) + (hash << 7) + (hash << 8) + (hash << 24);
        }
        return hash >>> 0;
      }

      function uniqueStrings(values) {
        const seen = {};
        const out = [];
        (values || []).forEach((value) => {
          const key = String(value || "");
          if (!key || seen[key]) return;
          seen[key] = true;
          out.push(key);
        });
        return out;
      }

      function viewSlug(view) {
        return String(view || "all")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "_")
          .replace(/^_+|_+$/g, "") || "all";
      }

      function isMockMode() {
        const params = new URLSearchParams(window.location.search || "");
        return params.get("mock") === "1";
      }

      function isAppsScriptContext() {
        return !!(window.google && google.script && google.script.run);
      }

      function bindDatalist(id, options) {
        const list = document.getElementById(id);
        const safeOptions = Array.isArray(options) ? options : [];
        list.innerHTML = safeOptions
          .map((opt) => `<option value="${escapeAttr(String(opt || "").trim())}"></option>`)
          .join("");
      }

      function setBusy(isBusy) {
        ui.runBtn.disabled = !!isBusy;
        ui.runBtn.textContent = isBusy ? "Checking..." : "Check Eligibility";
      }

      function setStatus(message, isError) {
        ui.status.textContent = message || "";
        ui.status.classList.toggle("error", !!isError);
      }

      function readError(err) {
        const raw = err && err.message ? String(err.message) : "Could not complete the eligibility check.";
        return raw || "Could not complete the eligibility check.";
      }

      function csvCell(v) {
        const s = String(v === null || v === undefined ? "" : v);
        return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
      }

      function formatCell(v) {
        if (v === null || v === undefined) return "";
        if (typeof v === "number") return Number.isInteger(v) ? String(v) : String(v.toFixed(1));
        return String(v);
      }

      function fileStamp(prefix, ext) {
        const d = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(
          d.getHours()
        )}${pad(d.getMinutes())}`;
        return `${prefix}_${stamp}.${ext}`;
      }

      function downloadBlob(content, mime, filename) {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function viewLabel(view) {
        if (view === "eligible") return "Eligible";
        if (view === "ineligible") return "Missing";
        if (view === "uncheckable") return "Uncheckable";
        if (view === "shortlist") return "Shortlist";
        return "All Programs";
      }

      function escapeHtml(v) {
        return String(v || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function escapeAttr(v) {
        return escapeHtml(v);
      }
</script>
