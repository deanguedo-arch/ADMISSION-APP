<script>
function boot() {
        resetForm();
        setInputsCollapsed(state.inputsCollapsed);
        state.meetingMode = loadMeetingModePreference_();
        setMeetingMode_(state.meetingMode, { persist: false });
        state.studentMode = loadStudentModePreference_();
        setStudentMode_(state.studentMode, { persist: false });
        state.meetingNotesByKey = loadMeetingNotes_();
        updateMeetingNotesControls_();
        state.mockMode = isMockMode();
        if (state.mockMode) {
          bootMockMode();
          return;
        }
        if (!isAppsScriptContext()) {
          setStatus(
            "This page is ready. Use Apps Script /dev for real backend, or run local server with ?mock=1 for UI preview.",
            true
          );
          ui.stamp.textContent = "Standalone preview (no backend)";
          ui.authLine.textContent = "Not connected to Apps Script backend.";
          updateSnapshotBannerDate_("");
          return;
        }
        loadPublicBootstrap();
      }

      let panelHeightSyncRaf = 0;
      const MEETING_MODE_KEY = "admissions_meeting_mode";
      const STUDENT_MODE_KEY = "admissions_student_mode";
      const MEETING_NOTES_KEY = "admissions_meeting_notes_v1";
      const DEFAULT_HERO_SUBTITLE = "Enter marks, triage programs, and review requirements with clear next steps.";
      const STUDENT_HERO_SUBTITLE = "Enter your final marks to see likely options and clear next steps.";
      const DEFAULT_INPUTS_HINT = "Add final marks only. Duplicate courses are deduped automatically (latest entry wins).";
      const STUDENT_INPUTS_HINT = "Add your final marks only. We automatically keep the latest mark for duplicates.";
      const DEFAULT_SNAPSHOT_TITLE = "Snapshot (advisory) - verify on institution site for final decisions";
      const STUDENT_SNAPSHOT_TITLE = "Student view (advisory) - confirm details on official program websites.";
      const RESULT_SORT_OPTIONS = [
        { value: "closest", label: "Sort: Closest to eligible" },
        { value: "institution_program", label: "Sort: Institution + Program" },
        { value: "program_az", label: "Sort: Program A-Z" },
        { value: "min_avg_asc", label: "Sort: Min Avg low-high" },
        { value: "min_avg_desc", label: "Sort: Min Avg high-low" },
      ];
      const EXPLORER_SORT_OPTIONS = [
        { value: "institution_program", label: "Sort: Institution + Program" },
        { value: "program_az", label: "Sort: Program A-Z" },
        { value: "min_avg_asc", label: "Sort: Min Avg low-high" },
        { value: "min_avg_desc", label: "Sort: Min Avg high-low" },
      ];

      function schedulePanelHeightSync() {
        if (panelHeightSyncRaf) {
          cancelAnimationFrame(panelHeightSyncRaf);
          panelHeightSyncRaf = 0;
        }
        panelHeightSyncRaf = requestAnimationFrame(() => {
          panelHeightSyncRaf = 0;
          syncResultsDetailsPanelHeights();
        });
      }

      function syncResultsDetailsPanelHeights() {
        if (!ui.resultsPanel || !ui.detailsPanel) return;
        ui.detailsPanel.style.height = "";

        const resultsRect = ui.resultsPanel.getBoundingClientRect();
        const detailsRect = ui.detailsPanel.getBoundingClientRect();
        const sideBySide = Math.abs(resultsRect.top - detailsRect.top) <= 10;
        if (!sideBySide) return;

        const targetHeight = Math.ceil(ui.resultsPanel.offsetHeight);
        if (targetHeight > 0) ui.detailsPanel.style.height = `${targetHeight}px`;
      }

      function loadPublicBootstrap() {
        setStatus("Checking access...");
        google.script.run
          .withSuccessHandler(handleBootstrapResponse)
          .withFailureHandler((err) => {
            setStatus(readError(err), true);
            ui.stamp.textContent = "Load failed";
            ui.authLine.textContent = "Sign-in check failed.";
          })
          .getWebAppBootstrapData({});
      }

      function loadSecureBootstrap() {
        if (!state.auth.idToken) {
          setStatus("Sign in with your school account to continue.", true);
          return;
        }
        setStatus("Verifying sign-in...");
        google.script.run
          .withSuccessHandler(handleBootstrapResponse)
          .withFailureHandler((err) => {
            setStatus(readError(err), true);
            ui.authLine.textContent = "Sign-in failed. Try again.";
          })
          .getWebAppBootstrapData({ idToken: state.auth.idToken });
      }

      function handleBootstrapResponse(data) {
        const boot = data || {};
        if (boot.requiresAuth) {
          const auth = boot.auth || {};
          const message = String(auth.message || "").trim();
          ui.googleSignIn.innerHTML = "";
          ui.authLine.textContent = message || `Sign in with your ${auth.allowedDomainSuffix || "@eips.ca"} account.`;
          ui.stamp.textContent = "Awaiting sign-in";
          setStatus(message || "Sign in with your school account and reload the page.", true);
          return;
        }

        state.boot = boot;
        setExplorerProgramsFromBoot_(state.boot);
        state.auth.email = String((boot.auth && boot.auth.email) || "").trim().toLowerCase();
        bindDatalist("namedCourses", state.boot.namedCourseOptions || []);
        bindDatalist("electiveCourses", state.boot.electiveCourseOptions || []);
        seedRows();
        const stamp = formatUtcStamp(state.boot.generatedAt || "");
        ui.stamp.textContent = stamp ? `Options loaded: ${stamp}` : "Options loaded";
        ui.authLine.textContent = state.auth.email ? `Signed in as ${state.auth.email}` : "Authenticated";
        updateSnapshotBannerFromBoot_(state.boot);
        updateModeCounts_();
        syncModeTabs_();
        setStatus("Ready.");
      }

      function initializeGoogleSignIn(clientId) {
        if (!clientId) {
          setStatus(
            "Web app auth is not configured. Set Script Property WEBAPP_GOOGLE_CLIENT_ID in Apps Script.",
            true
          );
          return;
        }
        if (!(window.google && google.accounts && google.accounts.id)) {
          setStatus("Google sign-in script did not load. Refresh and try again.", true);
          return;
        }
        ui.googleSignIn.innerHTML = "";
        google.accounts.id.initialize({
          client_id: clientId,
          callback: onGoogleCredential,
          auto_select: false,
          cancel_on_tap_outside: true,
        });
        google.accounts.id.renderButton(ui.googleSignIn, {
          theme: "outline",
          size: "large",
          shape: "pill",
          text: "signin_with",
          logo_alignment: "left",
        });
      }

      function onGoogleCredential(response) {
        const token = String((response && response.credential) || "").trim();
        if (!token) {
          setStatus("Google sign-in did not return a token. Try again.", true);
          return;
        }
        state.auth.idToken = token;
        loadSecureBootstrap();
      }

      function seedRows() {
        const namedTarget = 8;
        const electiveTarget = Number(state.boot && state.boot.manualElectiveSlots) || 5;
        while (ui.namedBody.children.length < namedTarget) addNamedRow();
        while (ui.electiveBody.children.length < electiveTarget) addElectiveRow();
        while (ui.electiveBody.children.length > electiveTarget) {
          ui.electiveBody.removeChild(ui.electiveBody.lastElementChild);
        }
      }

      function resetForm() {
        ui.namedBody.innerHTML = "";
        ui.electiveBody.innerHTML = "";
        for (let i = 0; i < 8; i++) addNamedRow();
        const electiveSlots = Number(state.boot && state.boot.manualElectiveSlots) || 5;
        for (let i = 0; i < electiveSlots; i++) addElectiveRow();
        state.result = null;
        state.resultModel = null;
        state.view = "ineligible";
        state.shortlist = {};
        state.selectedProgramKey = "";
        state.selectedExplorerKey = "";
        state.compareKeys = [];
        state.compareViewMode = "side";
        state.resultFilters.query = "";
        state.resultFilters.institution = "";
        state.resultFilters.credential = "";
        state.resultFilters.requirementType = "";
        state.resultFilters.sort = DEFAULT_RESULT_SORT;
        state.electiveRulesCollapsed = false;
        ui.csvBtn.disabled = true;
        ui.pdfBtn.disabled = true;
        syncResultControlContext_();
        syncResultControls();
        populateResultFilterOptions();
        updateSummary({ totalPrograms: 0, eligible: 0, missing: 0, uncheckable: 0 });
        updateSnapshotBannerFromBoot_(state.boot);
        renderResults();
        renderCompareStrip();
        renderCompareResults();
        renderDetailsDrawer();
        setStatus("");
        setPasteStatus("");
        if (ui.pasteInput) ui.pasteInput.value = "";
        updateFilterCounts();
        updateModeCounts_();
        syncModeTabs_();
        syncFilterButtons();
        updateMeetingNotesControls_();
        setMeetingMode_(state.meetingMode, { persist: false });
        setStudentMode_(state.studentMode, { persist: false });
      }

      function toggleInputsPanel() {
        setInputsCollapsed(!state.inputsCollapsed);
      }

      function setInputsCollapsed(collapsed) {
        const next = !!collapsed;
        state.inputsCollapsed = next;
        if (ui.workflowMain) ui.workflowMain.classList.toggle("inputs-collapsed", next);
        if (ui.toggleInputsBtn) {
          ui.toggleInputsBtn.textContent = next ? "Show >>" : "Hide <<";
          ui.toggleInputsBtn.setAttribute("aria-expanded", next ? "false" : "true");
        }
        if (ui.showInputsBtn) {
          ui.showInputsBtn.classList.toggle("is-hidden", !next);
          ui.showInputsBtn.setAttribute("aria-expanded", next ? "false" : "true");
        }
        schedulePanelHeightSync();
      }

      function loadMeetingModePreference_() {
        try {
          return window.localStorage.getItem(MEETING_MODE_KEY) === "1";
        } catch (err) {
          return false;
        }
      }

      function saveMeetingModePreference_(enabled) {
        try {
          window.localStorage.setItem(MEETING_MODE_KEY, enabled ? "1" : "0");
        } catch (err) {
          // Non-fatal for restricted browser contexts.
        }
      }

      function loadStudentModePreference_() {
        try {
          return window.localStorage.getItem(STUDENT_MODE_KEY) === "1";
        } catch (err) {
          return false;
        }
      }

      function saveStudentModePreference_(enabled) {
        try {
          window.localStorage.setItem(STUDENT_MODE_KEY, enabled ? "1" : "0");
        } catch (err) {
          // Non-fatal for restricted browser contexts.
        }
      }

      function normalizeMeetingDecision_(value) {
        const t = String(value || "").trim().toLowerCase();
        if (t === "apply") return "apply";
        if (t === "hold") return "hold";
        if (t === "not_now") return "not_now";
        return "";
      }

      function meetingDecisionLabel_(decision) {
        const normalized = normalizeMeetingDecision_(decision);
        if (normalized === "apply") return "Apply";
        if (normalized === "hold") return "Hold";
        if (normalized === "not_now") return "Not now";
        return "";
      }

      function meetingDecisionClass_(decision) {
        const normalized = normalizeMeetingDecision_(decision);
        if (!normalized) return "";
        return `decision-${normalized}`;
      }

      function normalizeMeetingRecord_(value) {
        if (value && typeof value === "object" && !Array.isArray(value)) {
          const followRaw = String(value.followUpDate || "").trim();
          const followMatch = /^(\d{4})-(\d{2})-(\d{2})$/.exec(followRaw);
          return {
            note: String(value.note || "").trim(),
            decision: normalizeMeetingDecision_(value.decision),
            owner: String(value.owner || "").trim(),
            followUpDate: followMatch ? followRaw : "",
          };
        }
        return {
          note: String(value || "").trim(),
          decision: "",
          owner: "",
          followUpDate: "",
        };
      }

      function meetingRecordHasContent_(record) {
        if (!record || typeof record !== "object") return false;
        return !!(
          String(record.note || "").trim() ||
          normalizeMeetingDecision_(record.decision) ||
          String(record.owner || "").trim() ||
          String(record.followUpDate || "").trim()
        );
      }

      function parseMeetingNotesMap_(raw) {
        if (!raw) return {};
        try {
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return {};
          const out = {};
          Object.keys(parsed).forEach((key) => {
            const safeKey = sanitizeProgramKey(key);
            if (!safeKey) return;
            const record = normalizeMeetingRecord_(parsed[key]);
            if (!meetingRecordHasContent_(record)) return;
            out[safeKey] = record;
          });
          return out;
        } catch (err) {
          return {};
        }
      }

      function getUsableStorage_(propName) {
        try {
          const storage = window[propName];
          if (!storage) return null;
          const probeKey = `${MEETING_NOTES_KEY}__probe__`;
          storage.setItem(probeKey, "1");
          storage.removeItem(probeKey);
          return storage;
        } catch (err) {
          return null;
        }
      }

      function meetingNotesStorageLabel_() {
        const mode = String(state.meetingNotesStorageMode || "memory").trim();
        if (mode === "local") return "Saved in this browser and persists after refresh.";
        if (mode === "session") return "Saved for this tab session; clears when tab closes.";
        return "Browser storage is restricted; notes stay until this page refreshes.";
      }

      function loadMeetingNotes_() {
        const local = getUsableStorage_("localStorage");
        if (local) {
          state.meetingNotesStorageMode = "local";
          const localMap = parseMeetingNotesMap_(local.getItem(MEETING_NOTES_KEY));
          if (Object.keys(localMap).length) return localMap;
          const session = getUsableStorage_("sessionStorage");
          if (session) {
            const sessionMap = parseMeetingNotesMap_(session.getItem(MEETING_NOTES_KEY));
            if (Object.keys(sessionMap).length) {
              state.meetingNotesStorageMode = "session";
              return sessionMap;
            }
          }
          return {};
        }

        const session = getUsableStorage_("sessionStorage");
        if (session) {
          state.meetingNotesStorageMode = "session";
          return parseMeetingNotesMap_(session.getItem(MEETING_NOTES_KEY));
        }

        state.meetingNotesStorageMode = "memory";
        return {};
      }

      function saveMeetingNotes_() {
        const payload = JSON.stringify(state.meetingNotesByKey || {});
        const local = getUsableStorage_("localStorage");
        if (local) {
          try {
            local.setItem(MEETING_NOTES_KEY, payload);
            state.meetingNotesStorageMode = "local";
            return true;
          } catch (err) {
            // fall through
          }
        }

        const session = getUsableStorage_("sessionStorage");
        if (session) {
          try {
            session.setItem(MEETING_NOTES_KEY, payload);
            state.meetingNotesStorageMode = "session";
            return true;
          } catch (err) {
            // fall through
          }
        }

        state.meetingNotesStorageMode = "memory";
        return false;
      }

      function countMeetingNotes_() {
        const map = state.meetingNotesByKey && typeof state.meetingNotesByKey === "object" ? state.meetingNotesByKey : {};
        return Object.keys(map).filter((key) => {
          return meetingRecordHasContent_(normalizeMeetingRecord_(map[key]));
        }).length;
      }

      function updateMeetingNotesControls_() {
        if (!ui.exportMeetingNotesBtn) return;
        const count = countMeetingNotes_();
        ui.exportMeetingNotesBtn.disabled = count <= 0;
        ui.exportMeetingNotesBtn.textContent = count > 0 ? `Export Packet (${count})` : "Export Packet";
        ui.exportMeetingNotesBtn.title = meetingNotesStorageLabel_();
      }

      function getMeetingRecordForKey_(key) {
        const safeKey = sanitizeProgramKey(key);
        if (!safeKey) return normalizeMeetingRecord_(null);
        const map = state.meetingNotesByKey && typeof state.meetingNotesByKey === "object" ? state.meetingNotesByKey : {};
        return normalizeMeetingRecord_(map[safeKey]);
      }

      function getMeetingNoteForKey_(key) {
        return getMeetingRecordForKey_(key).note || "";
      }

      function setMeetingRecordField_(key, field, value) {
        const safeKey = sanitizeProgramKey(key);
        if (!safeKey) return;
        const map = state.meetingNotesByKey && typeof state.meetingNotesByKey === "object" ? state.meetingNotesByKey : {};
        state.meetingNotesByKey = map;
        const current = normalizeMeetingRecord_(map[safeKey]);
        if (field === "note") current.note = String(value || "").replace(/\r\n/g, "\n").trim();
        if (field === "owner") current.owner = String(value || "").trim();
        if (field === "followUpDate") {
          const raw = String(value || "").trim();
          const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(raw);
          current.followUpDate = match ? raw : "";
        }
        if (field === "decision") current.decision = normalizeMeetingDecision_(value);
        if (meetingRecordHasContent_(current)) map[safeKey] = current;
        else delete map[safeKey];
        saveMeetingNotes_();
        updateMeetingNotesControls_();
      }

      function clearMeetingRecordForKey_(key) {
        const safeKey = sanitizeProgramKey(key);
        if (!safeKey) return;
        const map = state.meetingNotesByKey && typeof state.meetingNotesByKey === "object" ? state.meetingNotesByKey : {};
        if (map[safeKey] !== undefined) {
          delete map[safeKey];
          saveMeetingNotes_();
          updateMeetingNotesControls_();
        }
      }

      function renderMeetingNoteEditor_(key) {
        const safeKey = sanitizeProgramKey(key);
        if (!safeKey) return "";
        const record = getMeetingRecordForKey_(safeKey);
        const decision = normalizeMeetingDecision_(record.decision);
        const applyClass = decision === "apply" ? "meeting-decision-btn active decision-apply" : "meeting-decision-btn";
        const holdClass = decision === "hold" ? "meeting-decision-btn active decision-hold" : "meeting-decision-btn";
        const notNowClass = decision === "not_now" ? "meeting-decision-btn active decision-not_now" : "meeting-decision-btn";
        return `
          <div class="detail-block meeting-notes-block">
            <h4>Meeting Workflow</h4>
            <p class="ghost meeting-note-meta">${escapeHtml(meetingNotesStorageLabel_())}</p>
            <div class="meeting-decision-row" role="group" aria-label="Decision tags">
              <button class="${applyClass}" type="button" data-meeting-decision-key="${escapeAttr(safeKey)}" data-meeting-decision="apply">Apply</button>
              <button class="${holdClass}" type="button" data-meeting-decision-key="${escapeAttr(safeKey)}" data-meeting-decision="hold">Hold</button>
              <button class="${notNowClass}" type="button" data-meeting-decision-key="${escapeAttr(safeKey)}" data-meeting-decision="not_now">Not now</button>
            </div>
            <div class="meeting-meta-grid">
              <label class="meeting-field">
                <span class="meeting-field-label">Owner</span>
                <input
                  type="text"
                  class="meeting-meta-input"
                  data-meeting-owner-key="${escapeAttr(safeKey)}"
                  aria-label="Meeting owner"
                  placeholder="Counsellor or staff name"
                  value="${escapeAttr(record.owner || "")}"
                />
              </label>
              <label class="meeting-field">
                <span class="meeting-field-label">Follow-up Date</span>
                <input
                  type="date"
                  class="meeting-meta-input"
                  data-meeting-followup-key="${escapeAttr(safeKey)}"
                  aria-label="Follow-up date"
                  value="${escapeAttr(record.followUpDate || "")}"
                />
              </label>
            </div>
            <textarea
              class="meeting-note-input"
              rows="6"
              data-meeting-note-key="${escapeAttr(safeKey)}"
              aria-label="Meeting notes"
              placeholder="Capture meeting decision, concerns, and follow-up..."
            >${escapeHtml(record.note || "")}</textarea>
            <div class="actions meeting-note-actions">
              <button class="btn btn-subtle" type="button" data-meeting-note-clear="${escapeAttr(safeKey)}">Clear Meeting Fields</button>
            </div>
          </div>
        `;
      }

      function syncMeetingModeButton_() {
        if (!ui.meetingToggleBtn) return;
        const on = !!state.meetingMode;
        ui.meetingToggleBtn.textContent = on ? "Meeting Mode On" : "Meeting Mode";
        ui.meetingToggleBtn.setAttribute("aria-pressed", on ? "true" : "false");
      }

      function syncStudentModeCopy_() {
        const on = !!state.studentMode;
        if (ui.heroSubtitle) ui.heroSubtitle.textContent = on ? STUDENT_HERO_SUBTITLE : DEFAULT_HERO_SUBTITLE;
        if (ui.inputsHint) ui.inputsHint.textContent = on ? STUDENT_INPUTS_HINT : DEFAULT_INPUTS_HINT;
        if (ui.snapshotBannerTitle) {
          ui.snapshotBannerTitle.textContent = on ? STUDENT_SNAPSHOT_TITLE : DEFAULT_SNAPSHOT_TITLE;
        }
      }

      function syncStudentModeButton_() {
        if (!ui.studentToggleBtn) return;
        const on = !!state.studentMode;
        ui.studentToggleBtn.textContent = on ? "Student Mode On" : "Student Mode";
        ui.studentToggleBtn.setAttribute("aria-pressed", on ? "true" : "false");
      }

      function setMeetingMode_(enabled, opts) {
        const on = !!enabled;
        state.meetingMode = on;
        document.body.classList.toggle("is-meeting", on);
        syncMeetingModeButton_();
        if (on) setInputsCollapsed(true);
        if (!(opts && opts.persist === false)) saveMeetingModePreference_(on);
        schedulePanelHeightSync();
      }

      function toggleMeetingMode() {
        setMeetingMode_(!state.meetingMode);
      }

      function setStudentMode_(enabled, opts) {
        const on = !!enabled;
        state.studentMode = on;
        document.body.classList.toggle("is-student", on);
        if (on) {
          state.primaryMode = "results";
          state.resultFilters.institution = "";
          state.resultFilters.credential = "";
          state.resultFilters.requirementType = "";
          state.resultFilters.sort = DEFAULT_RESULT_SORT;
          setInputsCollapsed(true);
        }
        syncStudentModeButton_();
        syncStudentModeCopy_();
        syncModeTabs_();
        syncResultControlContext_();
        syncResultControls();
        populateResultFilterOptions();
        renderResults();
        renderDetailsDrawer();
        if (!(opts && opts.persist === false)) saveStudentModePreference_(on);
        schedulePanelHeightSync();
      }

      function toggleStudentMode() {
        setStudentMode_(!state.studentMode);
      }

      function setExplorerProgramsFromBoot_(bootData) {
        const boot = bootData && typeof bootData === "object" ? bootData : {};
        const source = Array.isArray(boot.explorerPrograms) ? boot.explorerPrograms : [];
        const out = [];
        for (let i = 0; i < source.length; i++) {
          const item = source[i];
          if (!item || typeof item !== "object" || Array.isArray(item)) continue;
          const institution = String(item.institution || "").trim();
          const program = String(item.program || "").trim();
          if (!institution || !program) continue;
          const credential = String(item.credential || "").trim();
          const minAvg = toFiniteNumber(item.minAvg);
          const competitiveGuidance = String(item.competitiveGuidance || "").trim();
          const requirementType = String(item.requirementType || "").trim();
          const sourceUrl = normalizeHttpUrl_(item.sourceUrl || "");
          const datasetDate = toYmdDate_(item.datasetDate || "") || toYmdDate_((boot.dataset && boot.dataset.lastProgramsSyncUtc) || "");
          const key = sanitizeProgramKey(item.key) || `explorer_${i + 1}`;
          out.push({
            key,
            institution,
            program,
            credential,
            minAvg: Number.isFinite(minAvg) ? minAvg : NaN,
            competitiveGuidance,
            requirementType,
            sourceUrl,
            datasetDate,
            searchText: `${institution} ${program} ${credential} ${competitiveGuidance} ${requirementType}`.toLowerCase(),
          });
        }
        out.sort((a, b) => compareInstitutionProgram(a, b));
        state.explorerRows = out;
        if (state.selectedExplorerKey && !out.find((x) => x.key === state.selectedExplorerKey)) {
          state.selectedExplorerKey = "";
        }
        if (state.primaryMode === "explorer" && !out.length) {
          state.primaryMode = "results";
        }
        if (state.primaryMode === "explorer") populateResultFilterOptions();
      }

      function addNamedRow(seed) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><input type="text" list="namedCourses" placeholder="English 30-1" value="${escapeAttr(
            seed && seed.course
          )}" /></td>
          <td>
            <div class="mark-input-wrap">
              <input class="mark-input" type="text" inputmode="decimal" placeholder="0-100" value="${escapeAttr(
                seed && seed.mark !== undefined && seed.mark !== null ? formatMarkDisplay(seed.mark) : ""
              )}" />
              <div class="cell-error"></div>
            </div>
          </td>
          <td><button class="btn btn-subtle" type="button">x</button></td>
        `;
        const courseInput = tr.querySelector('td:nth-child(1) input');
        const markInput = tr.querySelector("input.mark-input");
        const markError = tr.querySelector(".cell-error");
        wireMarkInput(markInput, markError);
        validateMarkField(markInput, markError);
        courseInput.addEventListener("change", () => {
          dedupeNamedRowsForActiveRow_(tr);
        });
        courseInput.addEventListener("blur", () => {
          dedupeNamedRowsForActiveRow_(tr);
        });
        tr.querySelector("button").addEventListener("click", () => {
          tr.remove();
        });
        ui.namedBody.appendChild(tr);
      }

      function addElectiveRow(seed) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><input type="text" list="electiveCourses" placeholder="Art 30" value="${escapeAttr(
            seed && seed.course
          )}" /></td>
          <td>
            <select>
              <option value="">Auto</option>
              <option value="A"${seed && seed.group === "A" ? " selected" : ""}>A</option>
              <option value="B"${seed && seed.group === "B" ? " selected" : ""}>B</option>
              <option value="C"${seed && seed.group === "C" ? " selected" : ""}>C</option>
              <option value="D"${seed && seed.group === "D" ? " selected" : ""}>D</option>
            </select>
          </td>
          <td>
            <div class="mark-input-wrap">
              <input class="mark-input" type="text" inputmode="decimal" placeholder="0-100" value="${escapeAttr(
                seed && seed.mark !== undefined && seed.mark !== null ? formatMarkDisplay(seed.mark) : ""
              )}" />
              <div class="cell-error"></div>
            </div>
          </td>
          <td><button class="btn btn-subtle" type="button">x</button></td>
        `;
        const courseInput = tr.querySelector('td:nth-child(1) input');
        const groupSelect = tr.querySelector("select");
        const markInput = tr.querySelector("input.mark-input");
        const markError = tr.querySelector(".cell-error");
        wireMarkInput(markInput, markError);
        validateMarkField(markInput, markError);
        courseInput.addEventListener("change", () => {
          dedupeManualRowsForActiveRow_(tr);
        });
        courseInput.addEventListener("blur", () => {
          dedupeManualRowsForActiveRow_(tr);
        });
        groupSelect.addEventListener("change", () => {
          dedupeManualRowsForActiveRow_(tr);
        });
        tr.querySelector("button").addEventListener("click", () => {
          tr.remove();
        });
        ui.electiveBody.appendChild(tr);
      }

      function wireMarkInput(input, errorEl) {
        if (!input) return;
        input.addEventListener("input", () => {
          validateMarkField(input, errorEl);
        });
        input.addEventListener("blur", () => {
          const parsed = parseMarkInput(input.value);
          if (parsed.ok && !parsed.empty) input.value = parsed.normalized;
          validateMarkField(input, errorEl);
        });
      }

      function validateMarkField(input, errorEl) {
        if (!input) return { ok: true, empty: true };
        const parsed = parseMarkInput(input.value);
        const invalid = !parsed.ok;
        input.classList.toggle("input-invalid", invalid);
        input.setAttribute("aria-invalid", invalid ? "true" : "false");
        if (errorEl) errorEl.textContent = invalid ? parsed.error : "";
        return parsed;
      }

      function parseMarkInput(raw) {
        const text = String(raw || "").trim();
        if (!text) return { ok: true, empty: true, value: NaN, normalized: "" };
        const cleaned = text.replace(/%/g, "").replace(/\s+/g, "");
        if (!/^[+-]?\d+(?:\.\d+)?$/.test(cleaned)) {
          return { ok: false, empty: false, value: NaN, normalized: "", error: "Enter a numeric mark (0-100)." };
        }
        const parsed = Number(cleaned);
        if (!Number.isFinite(parsed)) {
          return { ok: false, empty: false, value: NaN, normalized: "", error: "Enter a numeric mark (0-100)." };
        }
        const clamped = Math.max(0, Math.min(100, parsed));
        return {
          ok: true,
          empty: false,
          value: clamped,
          normalized: formatMarkDisplay(clamped),
          clamped: clamped !== parsed,
        };
      }

      function formatMarkDisplay(value) {
        const num = Number(value);
        if (!Number.isFinite(num)) return "";
        const rounded = Math.round(num * 10) / 10;
        return Number.isInteger(rounded) ? String(rounded) : String(rounded.toFixed(1));
      }

      function normalizeCourseToken(value) {
        return String(value || "")
          .trim()
          .toUpperCase()
          .replace(/\s+/g, " ");
      }

      function normalizeGroupValue(value) {
        const raw = String(value || "").trim().toUpperCase();
        if (!raw) return "";
        return ["A", "B", "C", "D"].indexOf(raw) >= 0 ? raw : "";
      }

      function buildCourseLookup(kind) {
        const named = (state.boot && state.boot.namedCourseOptions) || [];
        const elective = (state.boot && state.boot.electiveCourseOptions) || [];
        const source = kind === "elective" ? elective : named.concat(elective);
        const map = {};
        (source || []).forEach((opt) => {
          const label = String(opt || "").trim();
          const key = normalizeCourseToken(label);
          if (!key || !label) return;
          if (!map[key]) map[key] = label;
        });
        return map;
      }

      function resolveCourseLabel(rawCourse, kind) {
        const key = normalizeCourseToken(rawCourse);
        if (!key) return null;
        const lookup = buildCourseLookup(kind);
        const label = lookup[key] || "";
        if (!label) return null;
        return { key, label };
      }

      function dedupeNamedRowsForActiveRow_(activeRow) {
        if (!activeRow) return;
        const input = activeRow.querySelector('td:nth-child(1) input');
        const token = normalizeCourseToken(input && input.value);
        if (!token) return;
        const rows = Array.from(ui.namedBody.querySelectorAll("tr"));
        rows.forEach((row) => {
          if (row === activeRow) return;
          const rowInput = row.querySelector('td:nth-child(1) input');
          const rowToken = normalizeCourseToken(rowInput && rowInput.value);
          if (rowToken === token) row.remove();
        });
      }

      function dedupeManualRowsForActiveRow_(activeRow) {
        if (!activeRow) return;
        const courseInput = activeRow.querySelector('td:nth-child(1) input');
        const groupSelect = activeRow.querySelector("select");
        const token = normalizeCourseToken(courseInput && courseInput.value);
        const group = normalizeGroupValue(groupSelect && groupSelect.value) || "AUTO";
        if (!token) return;
        const key = `${token}||${group}`;
        const rows = Array.from(ui.electiveBody.querySelectorAll("tr"));
        rows.forEach((row) => {
          if (row === activeRow) return;
          const rowCourse = row.querySelector('td:nth-child(1) input');
          const rowGroup = row.querySelector("select");
          const rowKey = `${normalizeCourseToken(rowCourse && rowCourse.value)}||${
            normalizeGroupValue(rowGroup && rowGroup.value) || "AUTO"
          }`;
          if (rowKey === key) row.remove();
        });
      }

      function dedupeAllInputRows_() {
        const namedRows = Array.from(ui.namedBody.querySelectorAll("tr"));
        const seenNamed = {};
        for (let i = namedRows.length - 1; i >= 0; i--) {
          const tr = namedRows[i];
          const courseInput = tr.querySelector('td:nth-child(1) input');
          const token = normalizeCourseToken(courseInput && courseInput.value);
          if (!token) continue;
          if (seenNamed[token]) {
            tr.remove();
            continue;
          }
          seenNamed[token] = true;
        }

        const electiveRows = Array.from(ui.electiveBody.querySelectorAll("tr"));
        const seenManual = {};
        for (let i = electiveRows.length - 1; i >= 0; i--) {
          const tr = electiveRows[i];
          const courseInput = tr.querySelector('td:nth-child(1) input');
          const groupSelect = tr.querySelector("select");
          const token = normalizeCourseToken(courseInput && courseInput.value);
          const group = normalizeGroupValue(groupSelect && groupSelect.value) || "AUTO";
          if (!token) continue;
          const key = `${token}||${group}`;
          if (seenManual[key]) {
            tr.remove();
            continue;
          }
          seenManual[key] = true;
        }
      }

      function collectPayload() {
        const errors = [];
        const namedMap = new Map();
        const manualMap = new Map();

        Array.from(ui.namedBody.querySelectorAll("tr")).forEach((tr, i) => {
          const courseInput = tr.querySelector('td:nth-child(1) input');
          const markInput = tr.querySelector("input.mark-input");
          const markError = tr.querySelector(".cell-error");
          const courseRaw = String((courseInput && courseInput.value) || "").trim();
          const parsedMark = validateMarkField(markInput, markError);
          if (!courseRaw && parsedMark.empty) return;
          if (!courseRaw || !parsedMark.ok || parsedMark.empty) {
            errors.push(`Named row ${i + 1} needs both a valid course and mark.`);
            return;
          }
          const resolved = resolveCourseLabel(courseRaw, "named");
          if (!resolved) {
            errors.push(`Named row ${i + 1} course is not recognized: ${courseRaw}`);
            return;
          }
          if (courseInput) courseInput.value = resolved.label;
          if (markInput) markInput.value = parsedMark.normalized;
          if (namedMap.has(resolved.key)) namedMap.delete(resolved.key);
          namedMap.set(resolved.key, { course: resolved.label, mark: parsedMark.value });
        });

        Array.from(ui.electiveBody.querySelectorAll("tr")).forEach((tr, i) => {
          const courseInput = tr.querySelector('td:nth-child(1) input');
          const groupSelect = tr.querySelector("select");
          const markInput = tr.querySelector("input.mark-input");
          const markError = tr.querySelector(".cell-error");
          const courseRaw = String((courseInput && courseInput.value) || "").trim();
          const group = normalizeGroupValue(groupSelect && groupSelect.value);
          const parsedMark = validateMarkField(markInput, markError);
          if (!courseRaw && parsedMark.empty) return;
          if (!courseRaw || !parsedMark.ok || parsedMark.empty) {
            errors.push(`Elective row ${i + 1} needs both a valid course and mark.`);
            return;
          }
          const resolved = resolveCourseLabel(courseRaw, "elective");
          if (!resolved) {
            errors.push(`Elective row ${i + 1} course is not recognized: ${courseRaw}`);
            return;
          }
          if (courseInput) courseInput.value = resolved.label;
          if (markInput) markInput.value = parsedMark.normalized;
          if (groupSelect) groupSelect.value = group;
          const dedupeKey = `${resolved.key}||${group || "AUTO"}`;
          if (manualMap.has(dedupeKey)) manualMap.delete(dedupeKey);
          manualMap.set(dedupeKey, { course: resolved.label, group, mark: parsedMark.value });
        });

        return {
          auth: { idToken: state.auth.idToken || "" },
          namedCourses: Array.from(namedMap.values()),
          manualElectives: Array.from(manualMap.values()),
          errors,
        };
      }

      function setPasteStatus(message, isError) {
        if (!ui.pasteStatus) return;
        ui.pasteStatus.textContent = message || "";
        ui.pasteStatus.classList.toggle("error", !!isError);
      }

      function clearTranscriptPaste() {
        if (ui.pasteInput) ui.pasteInput.value = "";
        setPasteStatus("");
      }

      function parseTranscriptLine(line) {
        const raw = String(line || "").trim();
        if (!raw) return { skip: true };

        if (raw.indexOf(",") >= 0) {
          const tokens = raw.split(",").map((x) => String(x || "").trim()).filter(Boolean);
          if (tokens.length === 2) {
            return { course: tokens[0], markText: tokens[1], group: "" };
          }
          if (tokens.length === 3) {
            const groupMid = normalizeGroupValue(tokens[1]);
            if (groupMid) return { course: tokens[0], markText: tokens[2], group: groupMid };
            const groupEnd = normalizeGroupValue(tokens[2]);
            if (groupEnd) return { course: tokens[0], markText: tokens[1], group: groupEnd };
          }
        }

        const match = raw.match(/^(.*?)[\s:]+([0-9]+(?:\.[0-9]+)?%?)\s*(?:\(?\s*(?:group\s*)?([ABCD])\s*\)?)?$/i);
        if (!match) return { invalid: true };
        return {
          course: String(match[1] || "").trim(),
          markText: String(match[2] || "").trim(),
          group: normalizeGroupValue(match[3]),
        };
      }

      function upsertNamedRowFromEntry(entry) {
        const key = normalizeCourseToken(entry.course);
        if (!key) return "skipped";
        const rows = Array.from(ui.namedBody.querySelectorAll("tr"));
        let target = null;
        rows.forEach((tr) => {
          const courseInput = tr.querySelector('td:nth-child(1) input');
          const rowKey = normalizeCourseToken(courseInput && courseInput.value);
          if (rowKey === key && !target) target = tr;
        });
        if (!target) {
          addNamedRow({ course: entry.course, mark: entry.mark });
          dedupeNamedRowsForActiveRow_(ui.namedBody.lastElementChild);
          return "added";
        }
        const courseInput = target.querySelector('td:nth-child(1) input');
        const markInput = target.querySelector("input.mark-input");
        const markError = target.querySelector(".cell-error");
        if (courseInput) courseInput.value = entry.course;
        if (markInput) markInput.value = formatMarkDisplay(entry.mark);
        validateMarkField(markInput, markError);
        dedupeNamedRowsForActiveRow_(target);
        return "updated";
      }

      function upsertManualRowFromEntry(entry) {
        const key = `${normalizeCourseToken(entry.course)}||${entry.group || "AUTO"}`;
        if (key === "||AUTO") return "skipped";
        const rows = Array.from(ui.electiveBody.querySelectorAll("tr"));
        let target = null;
        rows.forEach((tr) => {
          const courseInput = tr.querySelector('td:nth-child(1) input');
          const groupSelect = tr.querySelector("select");
          const rowKey = `${normalizeCourseToken(courseInput && courseInput.value)}||${
            normalizeGroupValue(groupSelect && groupSelect.value) || "AUTO"
          }`;
          if (rowKey === key && !target) target = tr;
        });
        if (!target) {
          addElectiveRow({ course: entry.course, group: entry.group, mark: entry.mark });
          dedupeManualRowsForActiveRow_(ui.electiveBody.lastElementChild);
          return "added";
        }
        const courseInput = target.querySelector('td:nth-child(1) input');
        const groupSelect = target.querySelector("select");
        const markInput = target.querySelector("input.mark-input");
        const markError = target.querySelector(".cell-error");
        if (courseInput) courseInput.value = entry.course;
        if (groupSelect) groupSelect.value = entry.group || "";
        if (markInput) markInput.value = formatMarkDisplay(entry.mark);
        validateMarkField(markInput, markError);
        dedupeManualRowsForActiveRow_(target);
        return "updated";
      }

      function applyTranscriptPaste() {
        const text = String((ui.pasteInput && ui.pasteInput.value) || "").trim();
        if (!text) {
          setPasteStatus("Paste area is empty.", true);
          return;
        }

        const namedMap = new Map();
        const manualMap = new Map();
        let skipped = 0;
        let invalid = 0;

        text.split(/\r?\n/).forEach((line) => {
          const parsed = parseTranscriptLine(line);
          if (parsed.skip) {
            skipped++;
            return;
          }
          if (parsed.invalid) {
            invalid++;
            return;
          }

          const markParsed = parseMarkInput(parsed.markText);
          if (!markParsed.ok || markParsed.empty) {
            invalid++;
            return;
          }

          const group = normalizeGroupValue(parsed.group);
          const resolved = resolveCourseLabel(parsed.course, group ? "elective" : "named");
          if (!resolved) {
            invalid++;
            return;
          }

          if (group) {
            const k = `${resolved.key}||${group}`;
            if (manualMap.has(k)) manualMap.delete(k);
            manualMap.set(k, { course: resolved.label, group, mark: markParsed.value });
            return;
          }

          if (namedMap.has(resolved.key)) namedMap.delete(resolved.key);
          namedMap.set(resolved.key, { course: resolved.label, mark: markParsed.value });
        });

        let added = 0;
        let updated = 0;
        Array.from(namedMap.values()).forEach((entry) => {
          const outcome = upsertNamedRowFromEntry(entry);
          if (outcome === "added") added++;
          if (outcome === "updated") updated++;
        });
        Array.from(manualMap.values()).forEach((entry) => {
          const outcome = upsertManualRowFromEntry(entry);
          if (outcome === "added") added++;
          if (outcome === "updated") updated++;
        });

        dedupeAllInputRows_();

        const applied = added + updated;
        if (!applied && invalid > 0) {
          setPasteStatus(`No rows applied. ${invalid} line(s) were invalid.`, true);
          return;
        }

        setPasteStatus(
          `Paste applied: ${added} added, ${updated} updated, ${skipped} skipped, ${invalid} invalid.`,
          invalid > 0
        );
      }

      function runCheck() {
        dedupeAllInputRows_();
        if (!state.mockMode && !isAppsScriptContext()) {
          setStatus("Open this page using the deployed Apps Script web app URL to run checks.", true);
          return;
        }
        if (!state.mockMode && !state.boot) {
          setStatus("Access is not ready. Sign in with your school account and reload.", true);
          return;
        }

        const payload = collectPayload();
        if (payload.errors && payload.errors.length) {
          setStatus(payload.errors[0], true);
          return;
        }
        if (!payload.namedCourses.length && !payload.manualElectives.length) {
          setStatus("Enter at least one course and mark before running the check.", true);
          return;
        }
        const requestPayload = {
          auth: payload.auth || { idToken: "" },
          namedCourses: Array.isArray(payload.namedCourses) ? payload.namedCourses : [],
          manualElectives: Array.isArray(payload.manualElectives) ? payload.manualElectives : [],
        };
        if (state.primaryMode !== "results") {
          state.primaryMode = "results";
          syncModeTabs_();
          syncResultControlContext_();
        }
        if (state.mockMode) {
          runMockCheck(requestPayload);
          return;
        }

        setBusy(true);
        setStatus("Checking admissions rules...");
        google.script.run
          .withSuccessHandler((data) => {
            applyResultPayload(data || null);
            setStatus("Check complete.");
            setBusy(false);
          })
          .withFailureHandler((err) => {
            setStatus(readError(err), true);
            setBusy(false);
          })
          .runWebEligibility(requestPayload);
      }

      function runMockCheck(payload) {
        setBusy(true);
        setStatus("Running local mock check...");

            all: [eligibleRow, missingRow, uncheckableRow],

      function updateSummary(summary) {
        ui.sumTotal.textContent = Number(summary.totalPrograms || 0);
        ui.sumEligible.textContent = Number(summary.eligible || 0);

      }

      function formatUtcStamp(value) {
        const iso = String(value || "").trim();
        return iso ? iso.replace("T", " ").replace("Z", " UTC") : "";
      }

      function toYmdDate_(value) {
        const raw = String(value || "").trim();
        if (!raw) return "";
        const direct = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (direct) return `${direct[1]}-${direct[2]}-${direct[3]}`;
        const isoPrefix = raw.match(/^(\d{4})-(\d{2})-(\d{2})[T\s]/);
        if (isoPrefix) return `${isoPrefix[1]}-${isoPrefix[2]}-${isoPrefix[3]}`;
        const parsed = new Date(raw);
        if (!(parsed instanceof Date) || Number.isNaN(parsed.getTime())) return "";
        const y = parsed.getUTCFullYear();
        const m = String(parsed.getUTCMonth() + 1).padStart(2, "0");
        const d = String(parsed.getUTCDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function getResultMeta() {
        if (!(state.resultModel && state.resultModel.meta && typeof state.resultModel.meta === "object")) return {};
        return state.resultModel.meta;
      }

      function getResultDatasetStamp() {
        return String((getResultMeta().datasetStamp || "")).trim();
      }

      function getResultDatasetDate() {
        const meta = getResultMeta();
        const fromMeta = toYmdDate_(meta.datasetDate || "");
        if (fromMeta) return fromMeta;
        const rows = (state.resultModel && state.resultModel.rows) || [];
        for (let i = 0; i < rows.length; i++) {
          const ymd = toYmdDate_(rows[i] && rows[i].datasetDate);
          if (ymd) return ymd;
        }
        return "";
      }

      function updateSnapshotBannerDate_(datasetDate) {
        if (!ui.snapshotDataDate) return;
        const ymd = toYmdDate_(datasetDate || "");
        ui.snapshotDataDate.textContent = `Data date: ${ymd || "n/a"}`;
      }

      function updateSnapshotBannerFromBoot_(bootData) {
        const boot = bootData && typeof bootData === "object" ? bootData : {};
        const dataset = boot.dataset && typeof boot.dataset === "object" ? boot.dataset : {};
        const dateFromBoot = toYmdDate_(dataset.lastProgramsSyncUtc || dataset.lastProgramsSyncLocal || "");
        updateSnapshotBannerDate_(dateFromBoot);
      }

      function updateSnapshotBannerFromResult_() {
        if (!state.result) return;
        updateSnapshotBannerDate_(getResultDatasetDate());
      }

      function updateHeaderStampFromResult() {
        if (!state.result) return;
        const meta = getResultMeta();
        const generated = formatUtcStamp(state.result.generatedAt || meta.generatedAt || "");
        const syncedLocal = String(meta.lastProgramsSyncLocal || "").trim();
        const synced = formatUtcStamp(meta.lastProgramsSyncUtc || "");
        const datasetStamp = getResultDatasetStamp();
        const rows = (state.resultModel && state.resultModel.rows) || [];
        const institutions = uniqueStrings(
          rows.map((row) => String(row.institution || "").trim()).filter(Boolean)
        );
        const sourceText = institutions.length ? institutions.slice(0, 3).join(" / ") : "Admissions dataset";
        const updateText = syncedLocal || synced || generated || "n/a";
        ui.stamp.textContent = `Data updated: ${updateText} | Source: ${sourceText}`;
        const hidden = [];
        if (syncedLocal) hidden.push(`Synced (local): ${syncedLocal}`);
        if (synced) hidden.push(`Synced (UTC): ${synced}`);
        if (generated) hidden.push(`Generated: ${generated}`);
        if (datasetStamp) hidden.push(`Dataset: ${datasetStamp}`);
        if (meta.cacheHit === true) hidden.push("Cache: hit");
        if (meta.cacheHit === false) hidden.push("Cache: miss");
        ui.stamp.title = hidden.join(" | ");
      }

      function normalizePrimaryMode_(value) {
        const mode = String(value || "results").trim().toLowerCase();
        return PRIMARY_MODES.indexOf(mode) >= 0 ? mode : "results";
      }

      function getSortOptionsForMode_(mode) {
        return normalizePrimaryMode_(mode) === "explorer" ? EXPLORER_SORT_OPTIONS : RESULT_SORT_OPTIONS;
      }

      function syncSortOptionsForMode_() {
        if (!ui.sortSelect) return;
        const mode = normalizePrimaryMode_(state.primaryMode);
        const options = getSortOptionsForMode_(mode);
        const optionSig = options.map((opt) => `${opt.value}|${opt.label}`).join("||");
        const currentSig = Array.from(ui.sortSelect.options)
          .map((opt) => `${String(opt.value || "")}|${String(opt.textContent || "")}`)
          .join("||");
        if (optionSig !== currentSig) {
          ui.sortSelect.innerHTML = options
            .map((opt) => `<option value="${escapeAttr(opt.value)}">${escapeHtml(opt.label)}</option>`)
            .join("");
        }

        const allowedValues = options.map((opt) => opt.value);
        const defaultSort = mode === "explorer" ? "institution_program" : DEFAULT_RESULT_SORT;
        const requestedSort = String(state.resultFilters.sort || "").trim();
        state.resultFilters.sort = allowedValues.indexOf(requestedSort) >= 0 ? requestedSort : defaultSort;
      }

      function syncResultControlContext_() {
        const isExplorerMode = normalizePrimaryMode_(state.primaryMode) === "explorer";
        const isStudentMode = !!state.studentMode;
        if (ui.requirementTypeFilter) ui.requirementTypeFilter.style.display = isExplorerMode ? "" : "none";
        if (ui.resultSearch) {
          if (isStudentMode) {
            ui.resultSearch.placeholder = "Search programs or institutions...";
          } else {
            ui.resultSearch.placeholder = isExplorerMode
              ? "Search institution, program, credential, requirement..."
              : "Search institution, program, credential...";
          }
        }
        syncSortOptionsForMode_();
      }

      function updateModeCounts_() {
        const resultsCount = state.resultModel && state.resultModel.rows ? state.resultModel.rows.length : 0;
        const explorerCount = Array.isArray(state.explorerRows) ? state.explorerRows.length : 0;
        if (ui.modeCountResults) ui.modeCountResults.textContent = String(resultsCount);
        if (ui.modeCountExplorer) ui.modeCountExplorer.textContent = String(explorerCount);
      }

      function syncModeTabs_() {
        if (!ui.modeTabs) return;
        const next = normalizePrimaryMode_(state.primaryMode);
        state.primaryMode = next;
        const tabs = ui.modeTabs.querySelectorAll("button[data-mode]");
        tabs.forEach((btn) => {
          const active = String(btn.getAttribute("data-mode") || "") === next;
          btn.classList.toggle("active", active);
          btn.setAttribute("aria-selected", active ? "true" : "false");
        });
      }

      function setPrimaryMode_(mode) {
        const next = normalizePrimaryMode_(mode);
        if (next === "explorer" && (!state.explorerRows || !state.explorerRows.length)) {
          setStatus("Program Explorer data is not available right now.", true);
          return;
        }
        state.primaryMode = next;
        syncModeTabs_();
        syncResultControlContext_();
        populateResultFilterOptions();
        updateModeCounts_();
        renderResults();
        renderDetailsDrawer();
      }

      function onModeTabClick(e) {
        const btn = e.target && e.target.closest("button[data-mode]");
        if (!btn) return;
        const mode = String(btn.getAttribute("data-mode") || "results").trim();
        if (mode === state.primaryMode) return;
        setPrimaryMode_(mode);
      }

      function onFilterClick(e) {
        if (state.primaryMode !== "results") return;
        const btn = e.target && e.target.closest("button[data-view]");
        if (!btn) return;
        const nextView = String(btn.dataset.view || "ineligible").trim();
        if (RESULT_VIEWS.indexOf(nextView) < 0) return;
        if (nextView === "shortlist" && countShortlistRows() === 0) {
          state.view = "shortlist";
          updateFilterCounts();
          syncFilterButtons();
          renderResults();
          setStatus("Shortlist is empty. Pin programs from any view to add them.");
          return;
        }
        state.view = nextView;
        updateFilterCounts();
        syncFilterButtons();
        renderResults();
      }

      function getFilterSourceRows_() {
        if (state.primaryMode === "explorer") return Array.isArray(state.explorerRows) ? state.explorerRows : [];
        return state.resultModel && state.resultModel.rows ? state.resultModel.rows : [];
      }

      function onResultSearchInput() {
        if (state.resultSearchDebounceTimer) {
          clearTimeout(state.resultSearchDebounceTimer);
          state.resultSearchDebounceTimer = 0;
        }
        state.resultSearchDebounceTimer = setTimeout(() => {
          state.resultSearchDebounceTimer = 0;
          onResultControlChange();
        }, 140);
      }

      function onResultControlChange() {
        state.resultFilters.query = String(ui.resultSearch.value || "").trim();
        state.resultFilters.institution = String(ui.institutionFilter.value || "").trim();
        state.resultFilters.credential = String(ui.credentialFilter.value || "").trim();
        state.resultFilters.requirementType = String((ui.requirementTypeFilter && ui.requirementTypeFilter.value) || "").trim();
        state.resultFilters.sort = String(ui.sortSelect.value || DEFAULT_RESULT_SORT).trim() || DEFAULT_RESULT_SORT;
        renderResults();
      }

      function clearResultFilters() {
        if (state.resultSearchDebounceTimer) {
          clearTimeout(state.resultSearchDebounceTimer);
          state.resultSearchDebounceTimer = 0;
        }
        const modeDefaultSort = normalizePrimaryMode_(state.primaryMode) === "explorer" ? "institution_program" : DEFAULT_RESULT_SORT;
        state.resultFilters.query = "";
        state.resultFilters.institution = "";
        state.resultFilters.credential = "";
        state.resultFilters.requirementType = "";
        state.resultFilters.sort = modeDefaultSort;
        syncResultControlContext_();
        syncResultControls();
        renderResults();
      }

      function syncResultControls() {
        syncSortOptionsForMode_();
        const modeDefaultSort = normalizePrimaryMode_(state.primaryMode) === "explorer" ? "institution_program" : DEFAULT_RESULT_SORT;
        ui.resultSearch.value = state.resultFilters.query || "";
        ui.institutionFilter.value = state.resultFilters.institution || "";
        ui.credentialFilter.value = state.resultFilters.credential || "";
        if (ui.requirementTypeFilter) ui.requirementTypeFilter.value = state.resultFilters.requirementType || "";
        ui.sortSelect.value = state.resultFilters.sort || modeDefaultSort;
        const requirementTypeActive =
          normalizePrimaryMode_(state.primaryMode) === "explorer" && !!state.resultFilters.requirementType;
        ui.clearResultFiltersBtn.disabled =
          !state.resultFilters.query &&
          !state.resultFilters.institution &&
          !state.resultFilters.credential &&
          !requirementTypeActive &&
          (state.resultFilters.sort || modeDefaultSort) === modeDefaultSort;
      }

      function syncFilterButtons() {
        const all = ui.filterGroup.querySelectorAll("button[data-view]");
        all.forEach((btn) => {
          const active = btn.dataset.view === state.view;
          btn.classList.toggle("active", active);
          btn.setAttribute("aria-selected", active ? "true" : "false");
        });
      }

      function updateFilterCounts() {
        const model = state.resultModel;
        const keysByView = model && model.keysByView ? model.keysByView : {};
        const all = (keysByView.all || []).length;
        const eligible = (keysByView.eligible || []).length;
        const ineligible = (keysByView.ineligible || []).length;
        const uncheckable = (keysByView.uncheckable || []).length;
        const shortlist = countShortlistRows();
        if (ui.tabCountAll) ui.tabCountAll.textContent = String(all);
        if (ui.tabCountEligible) ui.tabCountEligible.textContent = String(eligible);
        if (ui.tabCountIneligible) ui.tabCountIneligible.textContent = String(ineligible);
        if (ui.tabCountUncheckable) ui.tabCountUncheckable.textContent = String(uncheckable);
        if (ui.tabCountShortlist) ui.tabCountShortlist.textContent = String(shortlist);
      }

      function populateResultFilterOptions() {
        const rows = getFilterSourceRows_();
        const isExplorerMode = normalizePrimaryMode_(state.primaryMode) === "explorer";
        const institutions = uniqueStrings(
          rows.map((r) => String(r.institution || "").trim()).filter((x) => x)
        ).sort((a, b) => a.localeCompare(b));
        const credentials = uniqueStrings(
          rows.map((r) => String(r.credential || "").trim()).filter((x) => x)
        ).sort((a, b) => a.localeCompare(b));
        const requirementTypes = isExplorerMode
          ? uniqueStrings(rows.map((r) => String(r.requirementType || "").trim()).filter((x) => x)).sort((a, b) =>
              a.localeCompare(b)
            )
          : [];

        renderSelectOptions(ui.institutionFilter, "All Institutions", institutions, state.resultFilters.institution);
        if (state.resultFilters.institution && institutions.indexOf(state.resultFilters.institution) < 0) {
          state.resultFilters.institution = "";
        }
        renderSelectOptions(ui.credentialFilter, "All Credentials", credentials, state.resultFilters.credential);
        if (state.resultFilters.credential && credentials.indexOf(state.resultFilters.credential) < 0) {
          state.resultFilters.credential = "";
        }
        if (ui.requirementTypeFilter && isExplorerMode) {
          renderSelectOptions(
            ui.requirementTypeFilter,
            "All Req Types",
            requirementTypes,
            state.resultFilters.requirementType
          );
          if (state.resultFilters.requirementType && requirementTypes.indexOf(state.resultFilters.requirementType) < 0) {
            state.resultFilters.requirementType = "";
          }
        }
        syncResultControls();
      }

      function renderSelectOptions(select, emptyLabel, options, selectedValue) {
        const selected = String(selectedValue || "").trim();
        const html =
          `<option value="">${escapeHtml(emptyLabel)}</option>` +
          (options || [])
            .map((opt) => {
              const value = String(opt || "").trim();
              const selectedAttr = value === selected ? ' selected="selected"' : "";
              return `<option value="${escapeAttr(value)}"${selectedAttr}>${escapeHtml(value)}</option>`;
            })
            .join("");
        select.innerHTML = html;
      }

      function onResultsWrapKeydown(e) {
        const key = String((e && e.key) || "");
        if (key !== "Enter" && key !== " ") return;
        const target = e && e.target;
        if (!target || !(target instanceof Element)) return;
        const tag = String(target.tagName || "").toUpperCase();
        if (tag === "BUTTON" || tag === "A" || tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
        const card = target.closest(".result-card");
        if (!card) return;
        e.preventDefault();
        card.click();
      }

      function onResultsWrapClick(e) {
        if (state.primaryMode === "explorer") {
          const detailBtn = e.target && e.target.closest("button[data-explorer-detail-key]");
          if (detailBtn) {
            const key = String(detailBtn.getAttribute("data-explorer-detail-key") || "").trim();
            if (key) state.selectedExplorerKey = key;
            renderResults();
            renderDetailsDrawer();
            return;
          }

          const sourceLink = e.target && e.target.closest("a[data-source-link]");
          if (sourceLink) return;

          const rowEl = e.target && e.target.closest(".result-card[data-explorer-key]");
          if (!rowEl) return;
          state.selectedExplorerKey = String(rowEl.getAttribute("data-explorer-key") || "").trim();
          renderResults();
          renderDetailsDrawer();
          return;
        }

        const pinBtn = e.target && e.target.closest("button[data-pin-key]");
        if (pinBtn) {
          const key = String(pinBtn.getAttribute("data-pin-key") || "").trim();
          if (!key) return;
          toggleShortlistKey(key);
          if (state.view === "shortlist" && countShortlistRows() === 0) {
            state.view = "ineligible";
            syncFilterButtons();
            setStatus("Shortlist is empty. Showing likely ineligible view.");
          }
          updateFilterCounts();
          renderResults();
          renderCompareStrip();
          renderCompareResults();
          renderDetailsDrawer();
          return;
        }

        const compareBtn = e.target && e.target.closest("button[data-compare-key]");
        if (compareBtn) {
          const key = String(compareBtn.getAttribute("data-compare-key") || "").trim();
          if (!key) return;
          toggleCompareKey(key);
          renderResults();
          renderCompareStrip();
          renderCompareResults();
          renderDetailsDrawer();
          return;
        }

        const detailBtn = e.target && e.target.closest("button[data-detail-key]");
        if (detailBtn) {
          const key = String(detailBtn.getAttribute("data-detail-key") || "").trim();
          selectProgramKey(key);
          renderResults();
          renderDetailsDrawer();
          return;
        }

        const sourceLink = e.target && e.target.closest("a[data-source-link]");
        if (sourceLink) return;

        const rowEl = e.target && e.target.closest(".result-card[data-row-key]");
        if (!rowEl) return;
        selectProgramKey(String(rowEl.getAttribute("data-row-key") || "").trim());
        renderResults();
        renderDetailsDrawer();
      }

      function toggleShortlistKey(key) {
        const k = String(key || "").trim();
        if (!k) return;
        if (state.shortlist[k]) {
          delete state.shortlist[k];
          return;
        }
        state.shortlist[k] = true;
      }

      function countShortlistRows() {
        const model = state.resultModel;
        if (!model || !model.rowsByKey) return 0;
        return Object.keys(state.shortlist).filter((k) => !!model.rowsByKey[k]).length;
      }

      function trimShortlistToCurrentModel() {
        const model = state.resultModel;
        if (!model || !model.rowsByKey) {
          state.shortlist = {};
          return;
        }
        Object.keys(state.shortlist).forEach((k) => {
          if (!model.rowsByKey[k]) delete state.shortlist[k];
        });
      }

      function selectProgramKey(key) {
        const k = String(key || "").trim();
        if (!k) {
          state.selectedProgramKey = "";
          return;
        }
        if (!(state.resultModel && state.resultModel.rowsByKey && state.resultModel.rowsByKey[k])) return;
        state.selectedProgramKey = k;
      }

      function toggleCompareKey(key) {
        const k = String(key || "").trim();
        if (!k) return;
        const idx = state.compareKeys.indexOf(k);
        if (idx >= 0) {
          state.compareKeys.splice(idx, 1);
          return;
        }
        if (state.compareKeys.length >= 3) {
          setStatus("Compare prep supports up to 3 programs. Remove one to add another.", true);
          return;
        }
        state.compareKeys.push(k);
      }

      function trimCompareToCurrentModel() {
        const model = state.resultModel;
        if (!model || !model.rowsByKey) {
          state.compareKeys = [];
          return;
        }
        state.compareKeys = state.compareKeys.filter((k) => !!model.rowsByKey[k]);
      }

      function onCompareStripClick(e) {
        const removeBtn = e.target && e.target.closest("button[data-compare-remove]");
        if (removeBtn) {
          const key = String(removeBtn.getAttribute("data-compare-remove") || "").trim();
          if (!key) return;
          state.compareKeys = state.compareKeys.filter((k) => k !== key);
          renderResults();
          renderCompareStrip();
          renderCompareResults();
          renderDetailsDrawer();
          return;
        }

        const clearBtn = e.target && e.target.closest("button[data-compare-clear]");
        if (!clearBtn) return;
        state.compareKeys = [];
        renderResults();
        renderCompareStrip();
        renderCompareResults();
        renderDetailsDrawer();
      }

      function onCompareResultsClick(e) {
        const viewBtn = e.target && e.target.closest("button[data-compare-view]");
        if (!viewBtn) return;
        const next = String(viewBtn.getAttribute("data-compare-view") || "").trim();
        if (next !== "side" && next !== "list" && next !== "columns") return;
        if (state.compareViewMode === next) return;
        state.compareViewMode = next;
        renderCompareResults();
      }

      function onDetailsDrawerInput(e) {
        const noteInput = e.target && e.target.closest("textarea[data-meeting-note-key]");
        if (noteInput) {
          const noteKey = String(noteInput.getAttribute("data-meeting-note-key") || "").trim();
          if (!noteKey) return;
          setMeetingRecordField_(noteKey, "note", noteInput.value);
          return;
        }

        const ownerInput = e.target && e.target.closest("input[data-meeting-owner-key]");
        if (ownerInput) {
          const ownerKey = String(ownerInput.getAttribute("data-meeting-owner-key") || "").trim();
          if (!ownerKey) return;
          setMeetingRecordField_(ownerKey, "owner", ownerInput.value);
          return;
        }

        const followInput = e.target && e.target.closest("input[data-meeting-followup-key]");
        if (!followInput) return;
        const followKey = String(followInput.getAttribute("data-meeting-followup-key") || "").trim();
        if (!followKey) return;
        setMeetingRecordField_(followKey, "followUpDate", followInput.value);
      }

      function onDetailsDrawerClick(e) {
        const decisionBtn = e.target && e.target.closest("button[data-meeting-decision-key]");
        if (decisionBtn) {
          const key = String(decisionBtn.getAttribute("data-meeting-decision-key") || "").trim();
          const decision = String(decisionBtn.getAttribute("data-meeting-decision") || "").trim();
          if (!key) return;
          setMeetingRecordField_(key, "decision", decision);
          renderResults();
          renderDetailsDrawer();
          return;
        }

        const clearBtn = e.target && e.target.closest("button[data-meeting-note-clear]");
        if (!clearBtn) return;
        const key = String(clearBtn.getAttribute("data-meeting-note-clear") || "").trim();
        if (!key) return;
        clearMeetingRecordForKey_(key);
        renderResults();
        renderDetailsDrawer();
      }

      function onDetailsDrawerToggle(e) {
        const target = e && e.target;
        if (!(target instanceof HTMLDetailsElement)) return;
        if (!target.hasAttribute("data-elective-rules")) return;
        state.electiveRulesCollapsed = !target.open;
      }

      function renderResults() {
        syncModeTabs_();
        updateModeCounts_();
        syncResultControlContext_();

        if (state.primaryMode === "explorer") {
          setResultsModeVisibility_(true);
          const viewRows = Array.isArray(state.explorerRows) ? state.explorerRows : [];
          const filteredRows = sortRows(filterRows(viewRows), getExplorerSortKey_());
          const viewCount = viewRows.length;
          const shownCount = filteredRows.length;
          ui.rowsStamp.textContent = shownCount === viewCount ? `${shownCount} programs` : `${shownCount} of ${viewCount} programs`;

          if (!filteredRows.length) {
            const emptyMsg =
              viewCount === 0
                ? "Program Explorer is empty."
                : "No programs match the current filters. Clear filters to widen results.";
            ui.resultsWrap.innerHTML = `<div class="empty">${escapeHtml(emptyMsg)}</div>`;
            syncResultControls();
            renderDetailsDrawer();
            return;
          }

          const bodyHtml = filteredRows
            .map((row) => {
              const isSelected = row.key === state.selectedExplorerKey;
              const viewClass = isSelected ? "action-btn active" : "action-btn";
              const viewLabel = isSelected ? "Viewing" : "View";
              const cardClass = isSelected ? " row-selected" : "";
              const sourceLinkHtml = row.sourceUrl
                ? `<a class="source-link-inline" data-source-link="1" href="${escapeAttr(
                    row.sourceUrl
                  )}" target="_blank" rel="noopener noreferrer">Program Link</a>`
                : `<span class="source-link-missing">Source link missing</span>`;
              const minAvgText = Number.isFinite(row.minAvg) ? formatCell(row.minAvg) : "n/a";
              const reasonText =
                row.competitiveGuidance ||
                row.requirementType ||
                "General admissions snapshot. Run eligibility check with marks for personalized results.";
              const meetingRecord = getMeetingRecordForKey_(row.key);
              const decision = normalizeMeetingDecision_(meetingRecord.decision);
              const decisionPillHtml = decision
                ? `<span class="decision-pill ${escapeAttr(meetingDecisionClass_(decision))}">${escapeHtml(
                    meetingDecisionLabel_(decision)
                  )}</span>`
                : "";
              const cardAria = `Open details for ${row.program || "program"} at ${row.institution || "institution"}`;
              return `
                <article
                  class="result-card${cardClass}"
                  data-explorer-key="${escapeAttr(row.key)}"
                  tabindex="0"
                  aria-label="${escapeAttr(cardAria)}"
                >
                  <div class="card-top">
                    <div class="card-title-wrap">
                      <h3 class="card-title">${escapeHtml(row.program || "Program")}</h3>
                      <p class="card-subtitle">${escapeHtml(row.institution || "Institution")} | ${escapeHtml(
                row.credential || "Credential"
              )}</p>
                    </div>
                    <div class="card-metrics">
                      <span class="metric-pill">Min Avg: ${escapeHtml(minAvgText)}</span>
                      <span class="metric-pill">${escapeHtml(row.datasetDate || "Data date n/a")}</span>
                      ${decisionPillHtml}
                      <span class="status-pill uncheckable">Explorer</span>
                    </div>
                  </div>
                  <div class="card-reason">${escapeHtml(reasonText)}</div>
                  <div class="card-actions">
                    ${sourceLinkHtml}
                    <button class="${viewClass}" type="button" data-explorer-detail-key="${escapeAttr(row.key)}">${viewLabel}</button>
                  </div>
                </article>
              `;
            })
            .join("");
          ui.resultsWrap.innerHTML = `<div class="result-list">${bodyHtml}</div>`;
          syncResultControls();
          renderDetailsDrawer();
          return;
        }

        setResultsModeVisibility_(false);
        if (!state.result || !state.resultModel) {
          ui.resultsWrap.innerHTML = `<div class="empty">Run a check to see program-by-program results.</div>`;
          ui.rowsStamp.textContent = "No results yet";
          syncResultControls();
          updateFilterCounts();
          renderCompareStrip();
          renderCompareResults();
          renderDetailsDrawer();
          return;
        }

        const viewRows = getRowsForView(state.view);
        const filteredRows = sortRows(filterRows(viewRows), state.resultFilters.sort || DEFAULT_RESULT_SORT);
        const viewCount = viewRows.length;
        const shownCount = filteredRows.length;
        ui.rowsStamp.textContent = shownCount === viewCount ? `${shownCount} programs` : `${shownCount} of ${viewCount} programs`;
        updateFilterCounts();

        if (!filteredRows.length) {
          const emptyMsg =
            viewCount === 0
              ? "No programs in this category."
              : "No programs match the current filters. Clear filters to widen results.";
          ui.resultsWrap.innerHTML = `<div class="empty">${escapeHtml(emptyMsg)}</div>`;
          syncResultControls();
          renderCompareStrip();
          renderCompareResults();
          renderDetailsDrawer();
          return;
        }

        const bodyHtml = filteredRows
          .map((row) => {
            const isPinned = !!state.shortlist[row.key];
            const isSelected = row.key === state.selectedProgramKey;
            const isCompared = state.compareKeys.indexOf(row.key) >= 0;
            const detail = getProgramDetailsForRow(row);
            const confidence = normalizeConfidence_(detail.confidence || row.confidence);
            const status = rowStatusForDisplay_(row);
            const reason = rowReasonForDisplay_(row, status);
            const warning = buildWarningDisplay_(detail, confidence);
            const warningHtml = renderWarningHtml_(warning, "card-warning");
            const sourceLinkHtml = renderSourceLinkInline_(detail, confidence);
            const pinClass = isPinned ? "pin-btn active" : "pin-btn";
            const compareClass = isCompared ? "action-btn active" : "action-btn";
            const viewClass = isSelected ? "action-btn active" : "action-btn";
            const cardClasses = []
              .concat(isPinned ? ["row-pinned"] : [])
              .concat(isSelected ? ["row-selected"] : [])
              .join(" ");
            const cardClass = cardClasses ? ` ${cardClasses}` : "";
            const pinLabel = isPinned ? "Pinned" : "Pin";
            const compareLabel = isCompared ? "Compared" : "Compare";
            const viewLabel = isSelected ? "Viewing" : "View";
            const studentAvgText = Number.isFinite(row.studentAvg) ? `${formatMarkDisplay(row.studentAvg)}%` : "N/A";
            const avgToneClass =
              status.css === "eligible" || status.css === "missing" || status.css === "uncheckable"
                ? status.css
                : "neutral";
            const meetingRecord = getMeetingRecordForKey_(row.key);
            const decision = normalizeMeetingDecision_(meetingRecord.decision);
            const decisionPillHtml = decision
              ? `<span class="decision-pill ${escapeAttr(meetingDecisionClass_(decision))}">${escapeHtml(
                  meetingDecisionLabel_(decision)
                )}</span>`
              : "";
            const cardAria = `Open details for ${row.program || "program"} at ${row.institution || "institution"}`;
            return `
              <article
                class="result-card${cardClass}"
                data-row-key="${escapeAttr(row.key)}"
                tabindex="0"
                aria-label="${escapeAttr(cardAria)}"
              >
                <div class="card-top">
                  <div class="card-title-wrap">
                    <h3 class="card-title">${escapeHtml(row.program || "Program")}</h3>
                    <p class="card-subtitle">${escapeHtml(row.institution || "Institution")} | ${escapeHtml(
              row.credential || "Credential"
            )}</p>
                  </div>
                  <div class="card-metrics">
                    <span class="metric-pill">Min Avg: ${escapeHtml(Number.isFinite(row.minAvg) ? formatCell(row.minAvg) : "n/a")}</span>
                    <span class="metric-pill">Confidence: ${escapeHtml(confidence)}</span>
                    ${decisionPillHtml}
                    <span class="status-pill ${escapeAttr(status.css)}">${escapeHtml(status.label)}</span>
                    <div class="student-avg-block ${escapeAttr(avgToneClass)}">
                      <div class="student-avg-label">Student Avg Used</div>
                      <div class="student-avg-value">${escapeHtml(studentAvgText)}</div>
                    </div>
                  </div>
                </div>
                <div class="card-reason">${escapeHtml(reason)}</div>
                ${warningHtml}
                <div class="card-actions">
                  ${sourceLinkHtml}
                  <button class="${pinClass}" type="button" data-pin-key="${escapeAttr(row.key)}">${pinLabel}</button>
