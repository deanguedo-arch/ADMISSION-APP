<script>
function boot() {
        resetForm();
        setInputsCollapsed(state.inputsCollapsed);
        state.mockMode = isMockMode();
        if (state.mockMode) {
          bootMockMode();
          return;
        }
        if (!isAppsScriptContext()) {
          setStatus(
            "This page is ready. Use Apps Script /dev for real backend, or run local server with ?mock=1 for UI preview.",
            true
          );
          ui.stamp.textContent = "Standalone preview (no backend)";
          ui.authLine.textContent = "Not connected to Apps Script backend.";
          return;
        }
        loadPublicBootstrap();
      }

      function loadPublicBootstrap() {
        setStatus("Checking access...");
        google.script.run
          .withSuccessHandler(handleBootstrapResponse)
          .withFailureHandler((err) => {
            setStatus(readError(err), true);
            ui.stamp.textContent = "Load failed";
            ui.authLine.textContent = "Sign-in check failed.";
          })
          .getWebAppBootstrapData({});
      }

      function loadSecureBootstrap() {
        if (!state.auth.idToken) {
          setStatus("Sign in with your school account to continue.", true);
          return;
        }
        setStatus("Verifying sign-in...");
        google.script.run
          .withSuccessHandler(handleBootstrapResponse)
          .withFailureHandler((err) => {
            setStatus(readError(err), true);
            ui.authLine.textContent = "Sign-in failed. Try again.";
          })
          .getWebAppBootstrapData({ idToken: state.auth.idToken });
      }

      function handleBootstrapResponse(data) {
        const boot = data || {};
        if (boot.requiresAuth) {
          const auth = boot.auth || {};
          const message = String(auth.message || "").trim();
          ui.googleSignIn.innerHTML = "";
          ui.authLine.textContent = message || `Sign in with your ${auth.allowedDomainSuffix || "@eips.ca"} account.`;
          ui.stamp.textContent = "Awaiting sign-in";
          setStatus(message || "Sign in with your school account and reload the page.", true);
          return;
        }

        state.boot = boot;
        state.auth.email = String((boot.auth && boot.auth.email) || "").trim().toLowerCase();
        bindDatalist("namedCourses", state.boot.namedCourseOptions || []);
        bindDatalist("electiveCourses", state.boot.electiveCourseOptions || []);
        seedRows();
        const stamp = formatUtcStamp(state.boot.generatedAt || "");
        ui.stamp.textContent = stamp ? `Options loaded: ${stamp}` : "Options loaded";
        ui.authLine.textContent = state.auth.email ? `Signed in as ${state.auth.email}` : "Authenticated";
        setStatus("Ready.");
      }

      function initializeGoogleSignIn(clientId) {
        if (!clientId) {
          setStatus(
            "Web app auth is not configured. Set Script Property WEBAPP_GOOGLE_CLIENT_ID in Apps Script.",
            true
          );
          return;
        }
        if (!(window.google && google.accounts && google.accounts.id)) {
          setStatus("Google sign-in script did not load. Refresh and try again.", true);
          return;
        }
        ui.googleSignIn.innerHTML = "";
        google.accounts.id.initialize({
          client_id: clientId,
          callback: onGoogleCredential,
          auto_select: false,
          cancel_on_tap_outside: true,
        });
        google.accounts.id.renderButton(ui.googleSignIn, {
          theme: "outline",
          size: "large",
          shape: "pill",
          text: "signin_with",
          logo_alignment: "left",
        });
      }

      function onGoogleCredential(response) {
        const token = String((response && response.credential) || "").trim();
        if (!token) {
          setStatus("Google sign-in did not return a token. Try again.", true);
          return;
        }
        state.auth.idToken = token;
        loadSecureBootstrap();
      }

      function seedRows() {
        const namedTarget = 8;
        const electiveTarget = Number(state.boot && state.boot.manualElectiveSlots) || 5;
        while (ui.namedBody.children.length < namedTarget) addNamedRow();
        while (ui.electiveBody.children.length < electiveTarget) addElectiveRow();
        while (ui.electiveBody.children.length > electiveTarget) {
          ui.electiveBody.removeChild(ui.electiveBody.lastElementChild);
        }
      }

      function resetForm() {
        ui.namedBody.innerHTML = "";
        ui.electiveBody.innerHTML = "";
        for (let i = 0; i < 8; i++) addNamedRow();
        const electiveSlots = Number(state.boot && state.boot.manualElectiveSlots) || 5;
        for (let i = 0; i < electiveSlots; i++) addElectiveRow();
        state.result = null;
        state.resultModel = null;
        state.view = "ineligible";
        state.shortlist = {};
        state.selectedProgramKey = "";
        state.compareKeys = [];
        state.compareViewMode = "side";
        state.resultFilters.query = "";
        state.resultFilters.institution = "";
        state.resultFilters.credential = "";
        state.resultFilters.sort = DEFAULT_RESULT_SORT;
        ui.csvBtn.disabled = true;
        ui.pdfBtn.disabled = true;
        syncResultControls();
        populateResultFilterOptions();
        updateSummary({ totalPrograms: 0, eligible: 0, missing: 0, uncheckable: 0 });
        renderResults();
        renderCompareStrip();
        renderCompareResults();
        renderDetailsDrawer();
        setStatus("");
        setPasteStatus("");
        if (ui.pasteInput) ui.pasteInput.value = "";
        updateFilterCounts();
        syncFilterButtons();
      }

      function toggleInputsPanel() {
        setInputsCollapsed(!state.inputsCollapsed);
      }

      function setInputsCollapsed(collapsed) {
        const next = !!collapsed;
        state.inputsCollapsed = next;
        if (ui.workflowMain) ui.workflowMain.classList.toggle("inputs-collapsed", next);
        if (ui.toggleInputsBtn) {
          ui.toggleInputsBtn.textContent = next ? "Show >>" : "Hide <<";
          ui.toggleInputsBtn.setAttribute("aria-expanded", next ? "false" : "true");
        }
        if (ui.showInputsBtn) {
          ui.showInputsBtn.classList.toggle("is-hidden", !next);
          ui.showInputsBtn.setAttribute("aria-expanded", next ? "false" : "true");
        }
      }

      function addNamedRow(seed) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><input type="text" list="namedCourses" placeholder="English 30-1" value="${escapeAttr(
            seed && seed.course
          )}" /></td>
          <td>
            <div class="mark-input-wrap">
              <input class="mark-input" type="text" inputmode="decimal" placeholder="0-100" value="${escapeAttr(
                seed && seed.mark !== undefined && seed.mark !== null ? formatMarkDisplay(seed.mark) : ""
              )}" />
              <div class="cell-error"></div>
            </div>
          </td>
          <td><button class="btn btn-subtle" type="button">x</button></td>
        `;
        const courseInput = tr.querySelector('td:nth-child(1) input');
        const markInput = tr.querySelector("input.mark-input");
        const markError = tr.querySelector(".cell-error");
        wireMarkInput(markInput, markError);
        validateMarkField(markInput, markError);
        courseInput.addEventListener("change", () => {
          dedupeNamedRowsForActiveRow_(tr);
        });
        courseInput.addEventListener("blur", () => {
          dedupeNamedRowsForActiveRow_(tr);
        });
        tr.querySelector("button").addEventListener("click", () => {
          tr.remove();
        });
        ui.namedBody.appendChild(tr);
      }

      function addElectiveRow(seed) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><input type="text" list="electiveCourses" placeholder="Art 30" value="${escapeAttr(
            seed && seed.course
          )}" /></td>
          <td>
            <select>
              <option value="">Auto</option>
              <option value="A"${seed && seed.group === "A" ? " selected" : ""}>A</option>
              <option value="B"${seed && seed.group === "B" ? " selected" : ""}>B</option>
              <option value="C"${seed && seed.group === "C" ? " selected" : ""}>C</option>
              <option value="D"${seed && seed.group === "D" ? " selected" : ""}>D</option>
            </select>
          </td>
          <td>
            <div class="mark-input-wrap">
              <input class="mark-input" type="text" inputmode="decimal" placeholder="0-100" value="${escapeAttr(
                seed && seed.mark !== undefined && seed.mark !== null ? formatMarkDisplay(seed.mark) : ""
              )}" />
              <div class="cell-error"></div>
            </div>
          </td>
          <td><button class="btn btn-subtle" type="button">x</button></td>
        `;
        const courseInput = tr.querySelector('td:nth-child(1) input');
        const groupSelect = tr.querySelector("select");
        const markInput = tr.querySelector("input.mark-input");
        const markError = tr.querySelector(".cell-error");
        wireMarkInput(markInput, markError);
        validateMarkField(markInput, markError);
        courseInput.addEventListener("change", () => {
          dedupeManualRowsForActiveRow_(tr);
        });
        courseInput.addEventListener("blur", () => {
          dedupeManualRowsForActiveRow_(tr);
        });
        groupSelect.addEventListener("change", () => {
          dedupeManualRowsForActiveRow_(tr);
        });
        tr.querySelector("button").addEventListener("click", () => {
          tr.remove();
        });
        ui.electiveBody.appendChild(tr);
      }

      function wireMarkInput(input, errorEl) {
        if (!input) return;
        input.addEventListener("input", () => {
          validateMarkField(input, errorEl);
        });
        input.addEventListener("blur", () => {
          const parsed = parseMarkInput(input.value);
          if (parsed.ok && !parsed.empty) input.value = parsed.normalized;
          validateMarkField(input, errorEl);
        });
      }

      function validateMarkField(input, errorEl) {
        if (!input) return { ok: true, empty: true };
        const parsed = parseMarkInput(input.value);
        const invalid = !parsed.ok;
        input.classList.toggle("input-invalid", invalid);
        input.setAttribute("aria-invalid", invalid ? "true" : "false");
        if (errorEl) errorEl.textContent = invalid ? parsed.error : "";
        return parsed;
      }

      function parseMarkInput(raw) {
        const text = String(raw || "").trim();
        if (!text) return { ok: true, empty: true, value: NaN, normalized: "" };
        const cleaned = text.replace(/%/g, "").replace(/\s+/g, "");
        if (!/^[+-]?\d+(?:\.\d+)?$/.test(cleaned)) {
          return { ok: false, empty: false, value: NaN, normalized: "", error: "Enter a numeric mark (0-100)." };
        }
        const parsed = Number(cleaned);
        if (!Number.isFinite(parsed)) {
          return { ok: false, empty: false, value: NaN, normalized: "", error: "Enter a numeric mark (0-100)." };
        }
        const clamped = Math.max(0, Math.min(100, parsed));
        return {
          ok: true,
          empty: false,
          value: clamped,
          normalized: formatMarkDisplay(clamped),
          clamped: clamped !== parsed,
        };
      }

      function formatMarkDisplay(value) {
        const num = Number(value);
        if (!Number.isFinite(num)) return "";
        const rounded = Math.round(num * 10) / 10;
        return Number.isInteger(rounded) ? String(rounded) : String(rounded.toFixed(1));
      }

      function normalizeCourseToken(value) {
        return String(value || "")
          .trim()
          .toUpperCase()
          .replace(/\s+/g, " ");
      }

      function normalizeGroupValue(value) {
        const raw = String(value || "").trim().toUpperCase();
        if (!raw) return "";
        return ["A", "B", "C", "D"].indexOf(raw) >= 0 ? raw : "";
      }

      function buildCourseLookup(kind) {
        const named = (state.boot && state.boot.namedCourseOptions) || [];
        const elective = (state.boot && state.boot.electiveCourseOptions) || [];
        const source = kind === "elective" ? elective : named.concat(elective);
        const map = {};
        (source || []).forEach((opt) => {
          const label = String(opt || "").trim();
          const key = normalizeCourseToken(label);
          if (!key || !label) return;
          if (!map[key]) map[key] = label;
        });
        return map;
      }

      function resolveCourseLabel(rawCourse, kind) {
        const key = normalizeCourseToken(rawCourse);
        if (!key) return null;
        const lookup = buildCourseLookup(kind);
        const label = lookup[key] || "";
        if (!label) return null;
        return { key, label };
      }

      function dedupeNamedRowsForActiveRow_(activeRow) {
        if (!activeRow) return;
        const input = activeRow.querySelector('td:nth-child(1) input');
        const token = normalizeCourseToken(input && input.value);
        if (!token) return;
        const rows = Array.from(ui.namedBody.querySelectorAll("tr"));
        rows.forEach((row) => {
          if (row === activeRow) return;
          const rowInput = row.querySelector('td:nth-child(1) input');
          const rowToken = normalizeCourseToken(rowInput && rowInput.value);
          if (rowToken === token) row.remove();
        });
      }

      function dedupeManualRowsForActiveRow_(activeRow) {
        if (!activeRow) return;
        const courseInput = activeRow.querySelector('td:nth-child(1) input');
        const groupSelect = activeRow.querySelector("select");
        const token = normalizeCourseToken(courseInput && courseInput.value);
        const group = normalizeGroupValue(groupSelect && groupSelect.value) || "AUTO";
        if (!token) return;
        const key = `${token}||${group}`;
        const rows = Array.from(ui.electiveBody.querySelectorAll("tr"));
        rows.forEach((row) => {
          if (row === activeRow) return;
          const rowCourse = row.querySelector('td:nth-child(1) input');
          const rowGroup = row.querySelector("select");
          const rowKey = `${normalizeCourseToken(rowCourse && rowCourse.value)}||${
            normalizeGroupValue(rowGroup && rowGroup.value) || "AUTO"
          }`;
          if (rowKey === key) row.remove();
        });
      }

      function dedupeAllInputRows_() {
        const namedRows = Array.from(ui.namedBody.querySelectorAll("tr"));
        const seenNamed = {};
        for (let i = namedRows.length - 1; i >= 0; i--) {
          const tr = namedRows[i];
          const courseInput = tr.querySelector('td:nth-child(1) input');
          const token = normalizeCourseToken(courseInput && courseInput.value);
          if (!token) continue;
          if (seenNamed[token]) {
            tr.remove();
            continue;
          }
          seenNamed[token] = true;
        }

        const electiveRows = Array.from(ui.electiveBody.querySelectorAll("tr"));
        const seenManual = {};
        for (let i = electiveRows.length - 1; i >= 0; i--) {
          const tr = electiveRows[i];
          const courseInput = tr.querySelector('td:nth-child(1) input');
          const groupSelect = tr.querySelector("select");
          const token = normalizeCourseToken(courseInput && courseInput.value);
          const group = normalizeGroupValue(groupSelect && groupSelect.value) || "AUTO";
          if (!token) continue;
          const key = `${token}||${group}`;
          if (seenManual[key]) {
            tr.remove();
            continue;
          }
          seenManual[key] = true;
        }
      }

      function collectPayload() {
        const errors = [];
        const namedMap = new Map();
        const manualMap = new Map();

        Array.from(ui.namedBody.querySelectorAll("tr")).forEach((tr, i) => {
          const courseInput = tr.querySelector('td:nth-child(1) input');
          const markInput = tr.querySelector("input.mark-input");
          const markError = tr.querySelector(".cell-error");
          const courseRaw = String((courseInput && courseInput.value) || "").trim();
          const parsedMark = validateMarkField(markInput, markError);
          if (!courseRaw && parsedMark.empty) return;
          if (!courseRaw || !parsedMark.ok || parsedMark.empty) {
            errors.push(`Named row ${i + 1} needs both a valid course and mark.`);
            return;
          }
          const resolved = resolveCourseLabel(courseRaw, "named");
          if (!resolved) {
            errors.push(`Named row ${i + 1} course is not recognized: ${courseRaw}`);
            return;
          }
          if (courseInput) courseInput.value = resolved.label;
          if (markInput) markInput.value = parsedMark.normalized;
          if (namedMap.has(resolved.key)) namedMap.delete(resolved.key);
          namedMap.set(resolved.key, { course: resolved.label, mark: parsedMark.value });
        });

        Array.from(ui.electiveBody.querySelectorAll("tr")).forEach((tr, i) => {
          const courseInput = tr.querySelector('td:nth-child(1) input');
          const groupSelect = tr.querySelector("select");
          const markInput = tr.querySelector("input.mark-input");
          const markError = tr.querySelector(".cell-error");
          const courseRaw = String((courseInput && courseInput.value) || "").trim();
          const group = normalizeGroupValue(groupSelect && groupSelect.value);
          const parsedMark = validateMarkField(markInput, markError);
          if (!courseRaw && parsedMark.empty) return;
          if (!courseRaw || !parsedMark.ok || parsedMark.empty) {
            errors.push(`Elective row ${i + 1} needs both a valid course and mark.`);
            return;
          }
          const resolved = resolveCourseLabel(courseRaw, "elective");
          if (!resolved) {
            errors.push(`Elective row ${i + 1} course is not recognized: ${courseRaw}`);
            return;
          }
          if (courseInput) courseInput.value = resolved.label;
          if (markInput) markInput.value = parsedMark.normalized;
          if (groupSelect) groupSelect.value = group;
          const dedupeKey = `${resolved.key}||${group || "AUTO"}`;
          if (manualMap.has(dedupeKey)) manualMap.delete(dedupeKey);
          manualMap.set(dedupeKey, { course: resolved.label, group, mark: parsedMark.value });
        });

        return {
          auth: { idToken: state.auth.idToken || "" },
          namedCourses: Array.from(namedMap.values()),
          manualElectives: Array.from(manualMap.values()),
          errors,
        };
      }

      function setPasteStatus(message, isError) {
        if (!ui.pasteStatus) return;
        ui.pasteStatus.textContent = message || "";
        ui.pasteStatus.classList.toggle("error", !!isError);
      }

      function clearTranscriptPaste() {
        if (ui.pasteInput) ui.pasteInput.value = "";
        setPasteStatus("");
      }

      function parseTranscriptLine(line) {
        const raw = String(line || "").trim();
        if (!raw) return { skip: true };

        if (raw.indexOf(",") >= 0) {
          const tokens = raw.split(",").map((x) => String(x || "").trim()).filter(Boolean);
          if (tokens.length === 2) {
            return { course: tokens[0], markText: tokens[1], group: "" };
          }
          if (tokens.length === 3) {
            const groupMid = normalizeGroupValue(tokens[1]);
            if (groupMid) return { course: tokens[0], markText: tokens[2], group: groupMid };
            const groupEnd = normalizeGroupValue(tokens[2]);
            if (groupEnd) return { course: tokens[0], markText: tokens[1], group: groupEnd };
          }
        }

        const match = raw.match(/^(.*?)[\s:]+([0-9]+(?:\.[0-9]+)?%?)\s*(?:\(?\s*(?:group\s*)?([ABCD])\s*\)?)?$/i);
        if (!match) return { invalid: true };
        return {
          course: String(match[1] || "").trim(),
          markText: String(match[2] || "").trim(),
          group: normalizeGroupValue(match[3]),
        };
      }

      function upsertNamedRowFromEntry(entry) {
        const key = normalizeCourseToken(entry.course);
        if (!key) return "skipped";
        const rows = Array.from(ui.namedBody.querySelectorAll("tr"));
        let target = null;
        rows.forEach((tr) => {
          const courseInput = tr.querySelector('td:nth-child(1) input');
          const rowKey = normalizeCourseToken(courseInput && courseInput.value);
          if (rowKey === key && !target) target = tr;
        });
        if (!target) {
          addNamedRow({ course: entry.course, mark: entry.mark });
          dedupeNamedRowsForActiveRow_(ui.namedBody.lastElementChild);
          return "added";
        }
        const courseInput = target.querySelector('td:nth-child(1) input');
        const markInput = target.querySelector("input.mark-input");
        const markError = target.querySelector(".cell-error");
        if (courseInput) courseInput.value = entry.course;
        if (markInput) markInput.value = formatMarkDisplay(entry.mark);
        validateMarkField(markInput, markError);
        dedupeNamedRowsForActiveRow_(target);
        return "updated";
      }

      function upsertManualRowFromEntry(entry) {
        const key = `${normalizeCourseToken(entry.course)}||${entry.group || "AUTO"}`;
        if (key === "||AUTO") return "skipped";
        const rows = Array.from(ui.electiveBody.querySelectorAll("tr"));
        let target = null;
        rows.forEach((tr) => {
          const courseInput = tr.querySelector('td:nth-child(1) input');
          const groupSelect = tr.querySelector("select");
          const rowKey = `${normalizeCourseToken(courseInput && courseInput.value)}||${
            normalizeGroupValue(groupSelect && groupSelect.value) || "AUTO"
          }`;
          if (rowKey === key && !target) target = tr;
        });
        if (!target) {
          addElectiveRow({ course: entry.course, group: entry.group, mark: entry.mark });
          dedupeManualRowsForActiveRow_(ui.electiveBody.lastElementChild);
          return "added";
        }
        const courseInput = target.querySelector('td:nth-child(1) input');
        const groupSelect = target.querySelector("select");
        const markInput = target.querySelector("input.mark-input");
        const markError = target.querySelector(".cell-error");
        if (courseInput) courseInput.value = entry.course;
        if (groupSelect) groupSelect.value = entry.group || "";
        if (markInput) markInput.value = formatMarkDisplay(entry.mark);
        validateMarkField(markInput, markError);
        dedupeManualRowsForActiveRow_(target);
        return "updated";
      }

      function applyTranscriptPaste() {
        const text = String((ui.pasteInput && ui.pasteInput.value) || "").trim();
        if (!text) {
          setPasteStatus("Paste area is empty.", true);
          return;
        }

        const namedMap = new Map();
        const manualMap = new Map();
        let skipped = 0;
        let invalid = 0;

        text.split(/\r?\n/).forEach((line) => {
          const parsed = parseTranscriptLine(line);
          if (parsed.skip) {
            skipped++;
            return;
          }
          if (parsed.invalid) {
            invalid++;
            return;
          }

          const markParsed = parseMarkInput(parsed.markText);
          if (!markParsed.ok || markParsed.empty) {
            invalid++;
            return;
          }

          const group = normalizeGroupValue(parsed.group);
          const resolved = resolveCourseLabel(parsed.course, group ? "elective" : "named");
          if (!resolved) {
            invalid++;
            return;
          }

          if (group) {
            const k = `${resolved.key}||${group}`;
            if (manualMap.has(k)) manualMap.delete(k);
            manualMap.set(k, { course: resolved.label, group, mark: markParsed.value });
            return;
          }

          if (namedMap.has(resolved.key)) namedMap.delete(resolved.key);
          namedMap.set(resolved.key, { course: resolved.label, mark: markParsed.value });
        });

        let added = 0;
        let updated = 0;
        Array.from(namedMap.values()).forEach((entry) => {
          const outcome = upsertNamedRowFromEntry(entry);
          if (outcome === "added") added++;
          if (outcome === "updated") updated++;
        });
        Array.from(manualMap.values()).forEach((entry) => {
          const outcome = upsertManualRowFromEntry(entry);
          if (outcome === "added") added++;
          if (outcome === "updated") updated++;
        });

        dedupeAllInputRows_();

        const applied = added + updated;
        if (!applied && invalid > 0) {
          setPasteStatus(`No rows applied. ${invalid} line(s) were invalid.`, true);
          return;
        }

        setPasteStatus(
          `Paste applied: ${added} added, ${updated} updated, ${skipped} skipped, ${invalid} invalid.`,
          invalid > 0
        );
      }

      function runCheck() {
        dedupeAllInputRows_();
        if (!state.mockMode && !isAppsScriptContext()) {
          setStatus("Open this page using the deployed Apps Script web app URL to run checks.", true);
          return;
        }
        if (!state.mockMode && !state.boot) {
          setStatus("Access is not ready. Sign in with your school account and reload.", true);
          return;
        }

        const payload = collectPayload();
        if (payload.errors && payload.errors.length) {
          setStatus(payload.errors[0], true);
          return;
        }
        if (!payload.namedCourses.length && !payload.manualElectives.length) {
          setStatus("Enter at least one course and mark before running the check.", true);
          return;
        }
        const requestPayload = {
          auth: payload.auth || { idToken: "" },
          namedCourses: Array.isArray(payload.namedCourses) ? payload.namedCourses : [],
          manualElectives: Array.isArray(payload.manualElectives) ? payload.manualElectives : [],
        };
        if (state.mockMode) {
          runMockCheck(requestPayload);
          return;
        }

        setBusy(true);
        setStatus("Checking admissions rules...");
        google.script.run
          .withSuccessHandler((data) => {
            applyResultPayload(data || null);
            setStatus("Check complete.");
            setBusy(false);
          })
          .withFailureHandler((err) => {
            setStatus(readError(err), true);
            setBusy(false);
          })
          .runWebEligibility(requestPayload);
      }

      function runMockCheck(payload) {
        setBusy(true);
        setStatus("Running local mock check...");
        setTimeout(() => {
          applyResultPayload(buildMockResult(payload));
          setBusy(false);
          setStatus("Mock check complete.");
        }, 250);
      }

      function applyResultPayload(result) {
        state.result = result || null;
        state.resultModel = buildResultModel(state.result);
        if (RESULT_VIEWS.indexOf(state.view) < 0) state.view = "ineligible";
        trimShortlistToCurrentModel();
        trimCompareToCurrentModel();
        if (state.selectedProgramKey && !(state.resultModel && state.resultModel.rowsByKey && state.resultModel.rowsByKey[state.selectedProgramKey])) {
          state.selectedProgramKey = "";
        }
        syncResultControls();
        populateResultFilterOptions();
        if (state.view === "shortlist" && countShortlistRows() === 0) {
          state.view = "ineligible";
        }
        ui.csvBtn.disabled = !state.result;
        ui.pdfBtn.disabled = !state.result;
        updateSummary((state.result && state.result.summary) || {});
        updateHeaderStampFromResult();
        updateFilterCounts();
        syncFilterButtons();
        renderResults();
        renderCompareStrip();
        renderCompareResults();
        renderDetailsDrawer();
      }

      function bootMockMode() {

          generatedAt: new Date().toISOString(),

            "Biology 30",
            "Chemistry 30",

        };
        bindDatalist("namedCourses", state.boot.namedCourseOptions);
        bindDatalist("electiveCourses", state.boot.electiveCourseOptions);
        seedRows();
        ui.stamp.textContent = "Mock mode";
        ui.authLine.textContent = "Local preview mode (no real student data is sent).";
