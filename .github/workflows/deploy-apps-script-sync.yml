name: Deploy Apps Script Sync Webhook
run-name: Deploy Apps Script Sync Webhook

on:
  push:
    branches:
      - main
    paths:
      - "apps_script_sync/**"
      - "tools/validate-sync-surface.ps1"
      - ".github/workflows/deploy-apps-script-sync.yml"
  workflow_dispatch:
    inputs:
      apps_script_sync_id:
        description: "Optional override for APPS_SCRIPT_SYNC_ID"
        required: true
        type: string
      apps_script_sync_deployment_id:
        description: "Optional override for APPS_SCRIPT_SYNC_DEPLOYMENT_ID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-apps-script-sync
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APPS_SCRIPT_SYNC_ID_SECRET: ${{ secrets.APPS_SCRIPT_SYNC_ID }}
      APPS_SCRIPT_SYNC_ID_VAR: ${{ vars.APPS_SCRIPT_SYNC_ID }}
      APPS_SCRIPT_SYNC_DEPLOYMENT_ID_SECRET: ${{ secrets.APPS_SCRIPT_SYNC_DEPLOYMENT_ID }}
      APPS_SCRIPT_SYNC_DEPLOYMENT_ID_VAR: ${{ vars.APPS_SCRIPT_SYNC_DEPLOYMENT_ID }}
      APPS_SCRIPT_SYNC_ID_INPUT: ${{ github.event.inputs.apps_script_sync_id }}
      APPS_SCRIPT_SYNC_DEPLOYMENT_ID_INPUT: ${{ github.event.inputs.apps_script_sync_deployment_id }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Validate required secrets
        run: |
          APPS_SCRIPT_SYNC_ID="${APPS_SCRIPT_SYNC_ID_INPUT:-${APPS_SCRIPT_SYNC_ID_SECRET:-$APPS_SCRIPT_SYNC_ID_VAR}}"
          APPS_SCRIPT_SYNC_DEPLOYMENT_ID="${APPS_SCRIPT_SYNC_DEPLOYMENT_ID_INPUT:-${APPS_SCRIPT_SYNC_DEPLOYMENT_ID_SECRET:-$APPS_SCRIPT_SYNC_DEPLOYMENT_ID_VAR}}"

          echo "Source check: sync_id_secret=$([ -n "$APPS_SCRIPT_SYNC_ID_SECRET" ] && echo yes || echo no), sync_id_var=$([ -n "$APPS_SCRIPT_SYNC_ID_VAR" ] && echo yes || echo no), sync_id_input=$([ -n "$APPS_SCRIPT_SYNC_ID_INPUT" ] && echo yes || echo no)"
          echo "Source check: deploy_id_secret=$([ -n "$APPS_SCRIPT_SYNC_DEPLOYMENT_ID_SECRET" ] && echo yes || echo no), deploy_id_var=$([ -n "$APPS_SCRIPT_SYNC_DEPLOYMENT_ID_VAR" ] && echo yes || echo no), deploy_id_input=$([ -n "$APPS_SCRIPT_SYNC_DEPLOYMENT_ID_INPUT" ] && echo yes || echo no)"

          if [ -z "$CLASPRC_JSON" ]; then
            echo "Missing secret: CLASPRC_JSON"
            exit 1
          fi
          if [ -z "$APPS_SCRIPT_SYNC_ID" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "Missing APPS_SCRIPT_SYNC_ID on push event; skipping sync deploy."
              echo "SKIP_SYNC_DEPLOY=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Missing APPS_SCRIPT_SYNC_ID. Provide workflow_dispatch input or set secret/variable."
            exit 1
          fi
          if [ -z "$APPS_SCRIPT_SYNC_DEPLOYMENT_ID" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "Missing APPS_SCRIPT_SYNC_DEPLOYMENT_ID on push event; skipping sync deploy."
              echo "SKIP_SYNC_DEPLOY=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Missing APPS_SCRIPT_SYNC_DEPLOYMENT_ID. Provide workflow_dispatch input or set secret/variable."
            exit 1
          fi

          echo "APPS_SCRIPT_SYNC_ID=$APPS_SCRIPT_SYNC_ID" >> "$GITHUB_ENV"
          echo "APPS_SCRIPT_SYNC_DEPLOYMENT_ID=$APPS_SCRIPT_SYNC_DEPLOYMENT_ID" >> "$GITHUB_ENV"

      - name: Write clasp auth and project config
        if: env.SKIP_SYNC_DEPLOY != 'true'
        run: |
          printf "%s" "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          cat > .clasp.json <<EOF
          {
            "scriptId": "$APPS_SCRIPT_SYNC_ID",
            "rootDir": "apps_script_sync"
          }
          EOF

      - name: Validate sync surface
        if: env.SKIP_SYNC_DEPLOY != 'true'
        run: pwsh -File ./tools/validate-sync-surface.ps1

      - name: Push sync Apps Script files
        if: env.SKIP_SYNC_DEPLOY != 'true'
        run: clasp push --force

      - name: Update sync deployment
        if: env.SKIP_SYNC_DEPLOY != 'true'
        run: clasp deploy --deploymentId "$APPS_SCRIPT_SYNC_DEPLOYMENT_ID" --description "CI ${GITHUB_SHA}"
