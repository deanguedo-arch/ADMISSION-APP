name: Deploy Apps Script Sync Webhook

on:
  push:
    branches:
      - main
    paths:
      - "apps_script_sync/**"
      - "tools/validate-sync-surface.ps1"
      - ".github/workflows/deploy-apps-script-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-apps-script-sync
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APPS_SCRIPT_SYNC_ID: ${{ secrets.APPS_SCRIPT_SYNC_ID || vars.APPS_SCRIPT_SYNC_ID }}
      APPS_SCRIPT_SYNC_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_SYNC_DEPLOYMENT_ID || vars.APPS_SCRIPT_SYNC_DEPLOYMENT_ID }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Validate required secrets
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "Missing secret: CLASPRC_JSON"
            exit 1
          fi
          if [ -z "$APPS_SCRIPT_SYNC_ID" ]; then
            echo "Missing secret/variable: APPS_SCRIPT_SYNC_ID"
            exit 1
          fi
          if [ -z "$APPS_SCRIPT_SYNC_DEPLOYMENT_ID" ]; then
            echo "Missing secret/variable: APPS_SCRIPT_SYNC_DEPLOYMENT_ID"
            exit 1
          fi

      - name: Write clasp auth and project config
        run: |
          printf "%s" "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          cat > .clasp.json <<EOF
          {
            "scriptId": "$APPS_SCRIPT_SYNC_ID",
            "rootDir": "apps_script_sync"
          }
          EOF

      - name: Validate sync surface
        run: pwsh -File ./tools/validate-sync-surface.ps1

      - name: Push sync Apps Script files
        run: clasp push --force

      - name: Update sync deployment
        run: clasp deploy --deploymentId "$APPS_SCRIPT_SYNC_DEPLOYMENT_ID" --description "CI ${GITHUB_SHA}"
