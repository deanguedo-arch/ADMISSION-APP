name: Dataset Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate canonical dataset
        run: python tools/validate-dataset.py

      - name: Check dataset quality fixtures
        run: python tools/check-dataset-quality-fixtures.py

      - name: Build review queue artifact
        run: python tools/build-review-queue.py

      - name: Check high school display flag
        run: python tools/check-high-school-display-flag.py

      - name: Check web high school filter
        run: node tools/check-web-high-school-filter.js

      - name: Check web auth bootstrap
        run: node tools/check-web-auth-bootstrap.js

      - name: Check science requirement parsing
        run: node tools/check-science-requirement-parsing.js

      - name: Check placement confidence
        run: node tools/check-placement-confidence.js

      - name: Check first load UX
        run: node tools/check-first-load-ux.js

      - name: Check course input upsert
        run: node tools/check-course-input-upsert.js

      - name: Check details panel height sync
        run: node tools/check-details-panel-height-sync.js

      - name: Check explorer program structure
        run: node tools/check-explorer-program-structure.js

      - name: Check offline bridge explorer bootstrap
        run: node tools/check-offline-bridge-explorer-bootstrap.js

      - name: Check admission route display
        run: node tools/check-admission-route-display.js

      - name: Check refresh workflow skips unsafe CI flags
        run: node tools/check-refresh-workflow-no-skip-scrape.js
