name: Deploy Offline Snapshot to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "offline_snapshot/site/**"
      - ".github/workflows/deploy-offline-snapshot-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: offline_snapshot/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
