name: Update + Build + Deploy Offline Snapshot (GitHub Pages)

on:
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: "Dataset refresh mode before snapshot build"
        required: false
        type: choice
        default: fast
        options:
          - fast
          - full
      skip_fixtures:
        description: "Skip fixture checks during refresh (faster, less strict)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup project venv/deps
        shell: pwsh
        run: |
          .\tools\setup-python.ps1

      - name: Refresh dataset for offline snapshot
        shell: pwsh
        run: |
          $refreshParams = @{
            SkipSync = $true
            SkipElectivePrefill = $true
            AllowStaleNorquestSeed = $true
          }
          if ("${{ inputs.refresh_mode }}" -eq "fast") {
            $refreshParams.SkipScrape = $true
            $refreshParams.SkipAvgApply = $true
          }
          if ("${{ inputs.skip_fixtures }}" -eq "true") {
            $refreshParams.SkipFixtures = $true
          }
          $enabled = @($refreshParams.GetEnumerator() | Sort-Object Name | Where-Object { $_.Value } | ForEach-Object { "-$($_.Name)" })
          Write-Host "refresh-all switches: $($enabled -join ' ')"
          & .\tools\refresh-all.ps1 @refreshParams
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build offline snapshot
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe .\offline_snapshot\build_snapshot.py

      - name: Print snapshot metadata
        shell: pwsh
        run: |
          Get-Content .\offline_snapshot\site\snapshot.meta.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: offline_snapshot/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
