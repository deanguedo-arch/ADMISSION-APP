name: STEP 3 - Publish Offline Snapshot (GitHub Pages)

on:
  push:
    branches:
      - main
    paths:
      - "apps_script/**"
      - "offline_snapshot/**"
      - "data/ALBERTA_ADMISSIONS_MASTER_CANONICAL.csv"
      - "data/ALBERTA_ADMISSIONS_MASTER_CANONICAL.csv.new"
      - ".github/workflows/deploy-offline-snapshot-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Offline Snapshot for Pages
        run: python offline_snapshot/build_snapshot.py --out docs

      - name: Verify snapshot row count
        run: |
          python - << 'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("docs/snapshot.meta.json").read_text(encoding="utf-8"))
          rows = int(meta.get("row_count_total", 0))
          if rows < 100:
              raise SystemExit(f"Snapshot row count unexpectedly low: {rows}")
          print(f"Snapshot rows: {rows}")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
