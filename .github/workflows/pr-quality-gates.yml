name: PR Quality Gates

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path ".\pipeline\requirements.txt") {
            python -m pip install -r .\pipeline\requirements.txt
          }

      - name: Validate web app surface
        run: pwsh -File ./tools/validate-webapp-surface.ps1

      - name: Validate Apps Script structure
        run: pwsh -File ./tools/validate-apps-script-structure.ps1

      - name: Validate sync surface
        run: pwsh -File ./tools/validate-sync-surface.ps1

      - name: Run pipeline fixtures
        shell: pwsh
        run: |
          python .\pipeline\check_avg_total_fixtures.py
          python .\pipeline\check_enrichment_link_fixtures.py
          python .\pipeline\check_nait_program_filter_fixtures.py
          python .\pipeline\check_macewan_seed_fixtures.py
          python .\pipeline\check_ualberta_url_map_fixtures.py

      - name: Validate canonical dataset
        shell: pwsh
        run: |
          $requiredInstitutions = @("NAIT", "NorQuest", "MacEwan", "UAlberta")
          .\tools\validate-canonical.ps1 -CsvPath "data/ALBERTA_ADMISSIONS_MASTER_CANONICAL.csv" -MinRows 100 -RequiredInstitutions $requiredInstitutions
