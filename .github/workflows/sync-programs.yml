name: Sync Programs To Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: read

concurrency:
  group: sync-programs-to-sheets
  cancel-in-progress: true

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip requests

      - name: Validate required secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.SHEETS_WEBHOOK_URL }}")) {
            throw "Missing secret: SHEETS_WEBHOOK_URL"
          }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.SHEETS_SYNC_TOKEN }}")) {
            throw "Missing secret: SHEETS_SYNC_TOKEN"
          }

      - name: Rebuild canonical dataset
        shell: pwsh
        run: |
          .\tools\clean-master.ps1

      - name: Resolve canonical CSV path
        id: csv
        shell: pwsh
        run: |
          $canonical = "data/ALBERTA_ADMISSIONS_MASTER_CANONICAL.csv"
          $fallback = "data/ALBERTA_ADMISSIONS_MASTER_CANONICAL.csv.new"

          if ((Test-Path $canonical) -and (Test-Path $fallback)) {
            $a = Get-Item $canonical
            $b = Get-Item $fallback
            $selected = if ($b.LastWriteTimeUtc -gt $a.LastWriteTimeUtc) { $fallback } else { $canonical }
          } elseif (Test-Path $canonical) {
            $selected = $canonical
          } elseif (Test-Path $fallback) {
            $selected = $fallback
          } else {
            throw "No canonical CSV found."
          }

          "path=$selected" >> $env:GITHUB_OUTPUT

      - name: Validate canonical dataset
        shell: pwsh
        run: |
          $requiredInstitutions = @("NAIT", "NorQuest", "MacEwan")
          .\tools\validate-canonical.ps1 `
            -CsvPath "${{ steps.csv.outputs.path }}" `
            -MinRows 100 `
            -RequiredInstitutions $requiredInstitutions

      - name: Upload to Google Sheet
        run: |
          python .\pipeline\push_to_sheets.py `
            --webhook "${{ secrets.SHEETS_WEBHOOK_URL }}" `
            --token "${{ secrets.SHEETS_SYNC_TOKEN }}" `
            --sheet "Programs" `
            --csv "${{ steps.csv.outputs.path }}"
