name: Update Normal Use Playbook

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/*.yml"
      - "apps_script/**"
      - "scripts/**"
      - "tools/generate-normal-use-playbook.ps1"
      - "docs/APPS_SCRIPT_GITHUB_SYNC.md"
      - "docs/GITHUB_AUTOMATION.md"
      - "docs/WORK_LOG.md"

permissions:
  contents: write

concurrency:
  group: update-normal-use-playbook
  cancel-in-progress: true

jobs:
  refresh-playbook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate playbook
        run: pwsh -File ./tools/generate-normal-use-playbook.ps1

      - name: Commit playbook updates (if changed)
        shell: pwsh
        run: |
          $diff = git status --porcelain=v1 -- docs/NORMAL_USE_PLAYBOOK.md
          if (-not $diff) {
            Write-Host "No playbook changes."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/NORMAL_USE_PLAYBOOK.md
          git commit -m "docs: refresh normal use playbook"
          git push
